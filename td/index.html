<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TouchDesigner | CUCEU</title>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #d0d0d0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Menu Bar */
        .top-bar {
            background-color: #2b2b2b;
            height: 28px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            border-bottom: 1px solid #111;
        }

        .menu-items span {
            margin-right: 15px;
            cursor: pointer;
        }

        .menu-items span:hover {
            color: #fff;
        }

        /* Path Bar */
        .path-bar {
            background-color: #333333;
            height: 30px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            border-bottom: 1px solid #111;
            color: #aaa;
        }

        /* Main Network Editor */
        .network-editor {
            flex-grow: 1;
            position: relative;
            background-color: #222222;
            /* Creates the classic TD grid */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            cursor: crosshair;
            background-position: center center;
        }

        /* SVG Wire Layer */
        #wire-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* The Nodes */
        .td-node {
            position: absolute;
            width: 160px;
            background-color: #1e1e1e;
            border: 1px solid #000;
            border-radius: 2px;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: border-color 0.1s, transform 0.1s;
            z-index: 5;
        }

        .td-node:hover {
            border-color: #999;
        }

        .td-node:active {
            transform: scale(0.98);
        }

        /* Video Node Specifics */
        #project-node {
            left: 35%;
            top: 30%;
        }

        .node-header-top {
            background-color: #7b4b8a; /* TOP Purple */
            color: white;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        /* Download Node Specifics */
        #download-node {
            left: 55%;
            top: 55%;
        }
