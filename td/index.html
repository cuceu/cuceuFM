<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.td</title>
    <link rel="icon" href="data:image/svg+xml,<svg viewBox=%220 0 100 100%22 xmlns=%22http://www.w3.org/2000/svg%22><rect x=%220%22 y=%220%22 width=%22100%22 height=%22100%22 fill=%22%23919c7d%22/><path d=%22M 50 0 L 50 100 M 0 50 L 100 50%22 stroke=%22%23111%22 stroke-width=%225%22/><path d=%22M 20 20 L 50 50 M 80 20 L 50 50 M 20 80 L 50 50 M 80 80 L 50 50%22 stroke=%22%23111%22 stroke-width=%225%22/><rect x=%2212%22 y=%2212%22 width=%2220%22 height=%2220%22 fill=%22%23111%22 /><rect x=%2268%22 y=%2212%22 width=%2220%22 height=%2220%22 fill=%22%23111%22 /><rect x=%2212%22 y=%2268%22 width=%2220%22 height=%2220%22 fill=%22%23111%22 /><rect x=%2268%22 y=%2268%22 width=%2220%22 height=%2220%22 fill=%22%23111%22 /><circle cx=%2250%22 cy=%2250%22 r=%2223%22 fill=%22%23ffffff%22 stroke=%22%23111%22 stroke-width=%225%22 /><rect x=%2243%22 y=%2243%22 width=%2214%22 height=%2214%22 fill=%22%23111%22 /></svg>">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- SMOOTH PAGE TRANSITIONS --- */
        #page-transition-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; z-index: 99999;
            pointer-events: none; opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #page-transition-overlay.loaded { opacity: 0; }
        #page-transition-overlay.leaving { opacity: 1; pointer-events: auto; }

        /* --- UI SEQUENCED ANIMATIONS --- */
        .logo-group { animation: breatheUp 0.8s cubic-bezier(0.25,1,0.5,1) forwards; }
        .td-window { animation: breatheUp 0.8s cubic-bezier(0.25,1,0.5,1) 0.2s forwards; opacity: 0; transform: translateY(40px); }
        .back-btn-top { animation: slideDownFromTop 0.6s cubic-bezier(0.25,1,0.5,1) 0.5s forwards; opacity: 0; transform: translateY(-20px); }

        body.is-exiting .back-btn-top { animation: slideUpToTop 0.4s cubic-bezier(0.25,1,0.5,1) forwards; }
        body.is-exiting .td-window { animation: breatheDown 0.5s cubic-bezier(0.25,1,0.5,1) 0.2s forwards; }
        body.is-exiting .logo-group { animation: breatheDown 0.6s cubic-bezier(0.25,1,0.5,1) 0.4s forwards; }

        @keyframes breatheUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes breatheDown { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(40px); } }
        @keyframes slideDownFromTop { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpToTop { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }


        /* --- HEADER SECTION --- */
        .brand-header {
            background-color: #ffffff; padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center;
            position: relative; flex-shrink: 0;
        }

        .back-btn-top {
            position: absolute; left: 30px; top: 30px;
            color: #000; text-decoration: none; font-weight: 800; 
            text-transform: uppercase; font-size: 12px; letter-spacing: 1px;
            border: 2px solid #000; padding: 8px 16px; border-radius: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .back-btn-top:hover { background-color: #000; color: #fff; }

        .logo-group { display: flex; align-items: flex-end; justify-content: center; margin-top: 10px; }
        
        h1 { 
            font-size: clamp(4rem, 12vw, 12rem); font-weight: 950; 
            text-transform: uppercase; letter-spacing: -6px; 
            margin: 0; color: #000; line-height: 0.8; 
        }

        .td-text { 
            font-size: clamp(1.5rem, 5vw, 4rem); font-weight: 400; 
            text-transform: lowercase; margin-left: 5px; color: #000; letter-spacing: -2px; 
        }

        /* --- TOUCHDESIGNER WINDOW --- */
        .td-window {
            flex-grow: 1; margin: 0 30px 30px 30px;
            border-radius: 12px; background-color: #1a1a1a; color: #d0d0d0;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid #333;
        }

        .top-bar {
            background-color: #2b2b2b; height: 28px; display: flex; align-items: center;
            padding: 0 15px; font-size: 12px; border-bottom: 1px solid #111; z-index: 20;
        }
        .menu-items span { margin-right: 15px; cursor: pointer; }
        .menu-items span:hover { color: #fff; }

        .path-bar {
            background-color: #333333; height: 30px; display: flex; align-items: center;
            padding: 0 15px; font-size: 12px; border-bottom: 1px solid #111; color: #aaa; z-index: 20;
        }

        /* The Grid Editor Background */
        .network-editor {
            flex-grow: 1; position: relative; background-color: #222222;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px; cursor: crosshair;
            overflow: hidden; touch-action: none;
        }

        /* The Canvas that actually moves when you pan/zoom */
        #network-canvas {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            transform-origin: 0 0; 
        }

        #wire-layer {
            position: absolute; top: 0; left: 0; width: 2000px; height: 2000px;
            pointer-events: none; z-index: 1; overflow: visible;
        }

        /* The Nodes */
        .td-node {
            position: absolute; background-color: #1e1e1e; border: 1px solid #000;
            border-radius: 2px; box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            cursor: pointer; z-index: 5;
        }

        .td-node:hover { border-color: #999; }
        .td-node:active { transform: scale(0.98); }

        /* Centered Node Placement using Viewport Math! */
        #project-node { width: 160px; left: calc(50vw - 150px); top: calc(50vh - 100px); }
        #download-node { width: 120px; left: calc(50vw + 50px); top: calc(50vh + 80px); }

        .node-header-top { background-color: #7b4b8a; color: white; padding: 3px 6px; font-size: 11px; font-weight: 600; display: flex; justify-content: space-between; }
        .node-header-comp { background-color: #555555; color: white; padding: 3px 6px; font-size: 10px; font-weight: 600; display: flex; justify-content: space-between; }

        #project-node .node-viewer { height: 90px; }
        #download-node .node-viewer { height: 60px; font-size: 20px;}

        .node-viewer { background-color: #000; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; font-size: 24px; color: #555; }
        .node-footer { padding: 4px; font-size: 10px; color: #888; background: #2a2a2a; text-align: center; line-height: 1.3; }
        
        #download-node .node-footer { font-size: 8px; }
        .format-text { color: #555; font-size: 9px; }

        .plug { position: absolute; width: 8px; height: 4px; background-color: #888; }
        .plug-out { top: 50%; right: -8px; transform: translateY(-50%); border-radius: 0 2px 2px 0; }
        .plug-in { top: 50%; left: -8px; transform: translateY(-50%); border-radius: 2px 0 0 2px; }

        .timeline {
            height: 35px; background-color: #2b2b2b; border-top: 1px solid #111;
            display: flex; align-items: center; padding: 0 15px; font-size: 11px; font-family: monospace; color: #888; z-index: 20;
        }
        .timeline span { margin-right: 20px; }
        .play-btn { color: #d0d0d0; font-size: 16px; cursor: pointer; }

        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .video-modal.active { opacity: 1; pointer-events: auto; }

        .video-container { 
            position: relative; 
            max-height: 85vh;
            aspect-ratio: 9/16; 
            width: auto; max-width: 90vw;
        }
        
        .close-hint { position: absolute; top: -30px; width: 100%; text-align: center; color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        a { text-decoration: none; color: inherit; }

        @media (max-width: 768px) {
            h1 { font-size: 4.5rem; letter-spacing: -4px; }
            .td-window { margin: 0 10px 10px 10px; }
            .back-btn-top { left: 15px; top: 15px; padding: 6px 12px; font-size: 10px; border-width: 1.5px;}
        }
    </style>
</head>
<body>

    <div id="page-transition-overlay"></div>

    <div class="brand-header">
        <a href="/" class="back-btn-top internal-link">← Home</a>
        <div class="logo-group">
            <h1>CUCEU</h1>
            <span class="td-text">.td</span>
        </div>
    </div>

    <div class="td-window" id="td-window">
        <div class="top-bar">
            <div class="menu-items">
                <span>File</span><span>Edit</span><span>Dialogs</span><span>View</span><span>Window</span><span>Help</span>
            </div>
        </div>
        <div class="path-bar">
            CUCEU/Projects/TouchDesigner
        </div>

        <div class="network-editor" id="network-editor">
            
            <div id="network-canvas">
                
                <svg id="wire-layer">
                    <path id="wire-path" stroke="#a0a0a0" stroke-width="2" fill="none" opacity="0.6"/>
                </svg>

                <div class="td-node" id="project-node" title="Click to view project video">
                    <div class="node-header-top"><span>0517.td</span><span>✖</span></div>
                    <div class="node-viewer">▶</div>
                    <div class="node-footer">
                        1080 x 1920<br><span class="format-text">MOV / H.264</span>
                    </div>
                    <div class="plug plug-out" id="plug1"></div>
                </div>

                <a href="0517.toe" download>
                    <div class="td-node" id="download-node" title="Click to download .toe file">
                        <div class="node-header-comp"><span>0517.toe</span><span>↓</span></div>
                        <div class="node-viewer" style="color: #666;">⬇</div>
                        <div class="node-footer">
                            Download<br><span class="format-text">.TOE FILE</span>
                        </div>
                        <div class="plug plug-in" id="plug2"></div>
                    </div>
                </a>

            </div>
        </div>

        <div class="timeline">
            <span>Start: 1</span><span>End: 600</span><span class="play-btn">▶</span>
            <span>FPS: 60</span><span style="color: #4a90e2;">00:00:00:00</span>
        </div>
    </div>

    <div class="video-modal" id="video-overlay">
        <div class="video-container">
            <div class="close-hint">Click anywhere outside to close</div>
            <iframe id="vimeo-iframe" src="https://player.vimeo.com/video/1192984118?title=0&byline=0&portrait=0" style="width:100%; height:100%; border:none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: 4px;" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // --- PAGE TRANSITION LOGIC ---
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('page-transition-overlay');
            requestAnimationFrame(() => overlay.classList.add('loaded'));

            document.querySelectorAll('.internal-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.body.classList.add('is-exiting'); // Triggers smooth reverse animations
                    
                    setTimeout(() => {
                        overlay.classList.remove('loaded');
                        overlay.classList.add('leaving');
                    }, 600); 
                    setTimeout(() => window.location.href = link.href, 1000); 
                });
            });
        });

        window.addEventListener('pageshow', (e) => { 
            if (e.persisted) {
                document.body.classList.remove('is-exiting');
                document.getElementById('page-transition-overlay').classList.add('loaded');
                document.getElementById('page-transition-overlay').classList.remove('leaving');
            }
        });

        // --- Video Player Logic ---
        const videoNode = document.getElementById('project-node');
        const overlay = document.getElementById('video-overlay');
        const iframe = document.getElementById('vimeo-iframe');
        const videoSrc = iframe.src;

        videoNode.addEventListener('click', () => {
            overlay.classList.add('active');
            iframe.src = videoSrc + "&autoplay=1"; 
        });

        overlay.addEventListener('click', (e) => {
            if (e.target.closest('.video-container')) return; 
            overlay.classList.remove('active');
            iframe.src = videoSrc; 
        });

        // --- Network Panning & Zooming Logic ---
        const editor = document.getElementById('network-editor');
        const canvas = document.getElementById('network-canvas');
        
        let panX = 0, panY = 0, scale = 1;
        let isDragging = false, startX, startY;

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            editor.style.backgroundPosition = `${panX}px ${panY}px`;
            editor.style.backgroundSize = `${40 * scale}px ${40 * scale}px`;
        }

        editor.addEventListener('mousedown', (e) => {
            if(e.target.closest('.td-node')) return; 
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            editor.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            editor.style.cursor = 'crosshair';
        });

        editor.addEventListener('touchstart', (e) => {
            if(e.target.closest('.td-node')) return;
            if(e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if(isDragging && e.touches.length === 1) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        editor.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            const zoomSensitivity = -0.002;
            const delta = e.deltaY * zoomSensitivity;
            
            let newScale = scale * Math.exp(delta);
            newScale = Math.max(0.3, Math.min(newScale, 3)); 
            
            scale = newScale;
            updateTransform();
        }, {passive: false});

        function drawWire() {
            const pNode = document.getElementById('project-node');
            const dNode = document.getElementById('download-node');
            const wirePath = document.getElementById('wire-path');

            const startX = pNode.offsetLeft + pNode.offsetWidth;
            const startY = pNode.offsetTop + (pNode.offsetHeight / 2);
            
            const endX = dNode.offsetLeft;
            const endY = dNode.offsetTop + (dNode.offsetHeight / 2);

            const cp1X = startX + 60;
            const cp1Y = startY;
            const cp2X = endX - 60;
            const cp2Y = endY;

            wirePath.setAttribute('d', `M ${startX} ${startY} C ${cp1X} ${cp1Y}, ${cp2X} ${cp2Y}, ${endX} ${endY}`);
        }

        // Draw line on load and when window resizes
        drawWire();
        window.addEventListener('resize', drawWire);

    </script>
</body>
</html>
