<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
        }

        /* The container that holds everything */
        #app-container {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            background-color: #111;
            transform-origin: 70% 100%; 
            transition: all 0.6s cubic-bezier(0.5, 0, 0.1, 1);
            
            /* Explicitly define the open state */
            transform: scale(1) translateY(0);
            opacity: 1;
            border-radius: 0;
        }

        /* The Genie State (used for both opening and closing) */
        .genie-state {
            transform: scale(0.05) translateY(50vh) !important;
            opacity: 0 !important;
            border-radius: 100px !important;
        }

        /* The fake macOS app window bar */
        .mac-titlebar {
            height: 40px; background: #e5e5e5; display: flex; align-items: center; padding: 0 15px;
            border-bottom: 1px solid #ccc; position: relative; z-index: 9999;
        }

        /* The close button */
        .close-btn {
            width: 13px; height: 13px; background-color: #ff5f56; border-radius: 50%;
            display: inline-block; cursor: pointer; border: 1px solid #e0443e;
            transition: opacity 0.2s; position: relative; z-index: 99999;
        }
        .close-btn:hover { opacity: 0.7; }
        
        .window-title { flex-grow: 1; text-align: center; font-weight: 600; font-size: 13px; color: #333; margin-left: -13px; pointer-events: none; }

        /* Camera wrapper */
        .app-content { 
            height: calc(100% - 40px); width: 100%; position: relative; 
            display: flex; justify-content: center; align-items: center;
            z-index: 1;
        }

        /* The video feed */
        video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1);
        }

        /* Message if they deny camera access */
        #error-msg {
            display: none; text-align: center; font-size: 1.2rem;
            position: absolute; z-index: 5; max-width: 80%;
        }
    </style>
</head>
<body>

    <div id="app-container" class="genie-state">
        
        <div class="mac-titlebar">
            <div onclick="closeApp()" class="close-btn" title="Close App"></div>
            <div class="window-title">Trash</div>
        </div>

        <div class="app-content">
            <video id="camera-feed" autoplay playsinline muted></video>
            
            <div id="error-msg">
                Oops! To see the trash, you need to allow camera access. 📷🗑️
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const errorMsg = document.getElementById('error-msg');

        // --- THE GENIE ENTRANCE ANIMATION ---
        document.addEventListener("DOMContentLoaded", () => {
            // A tiny delay gives the browser time to draw the tiny window first, 
            // then we remove the class so it animates up to full size!
            setTimeout(() => {
                document.getElementById('app-container').classList.remove('genie-state');
            }, 50);
        });

        // --- THE GENIE EXIT ANIMATION ---
        function closeApp() {
            // Add the class back so it sucks down into the dock
            document.getElementById('app-container').classList.add('genie-state');
            
            setTimeout(() => {
                window.location.href = '/';
            }, 550);
        }

        // Request front camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                video.play().catch(err => console.error("Video play error:", err));
            })
            .catch(err => {
                console.error("Camera access denied or failed:", err);
                errorMsg.style.display = 'block';
            });
    </script>
</body>
</html>
