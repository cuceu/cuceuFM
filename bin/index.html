<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin Schedule</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* The fake macOS app window bar */
        .mac-titlebar {
            height: 40px; background: #e5e5e5; display: flex; align-items: center; padding: 0 15px;
            border-bottom: 1px solid #ccc;
        }

        /* The close button to go back to the main site */
        .close-btn {
            width: 13px; height: 13px; background-color: #ff5f56; border-radius: 50%;
            display: inline-block; cursor: pointer; border: 1px solid #e0443e;
            transition: opacity 0.2s;
        }
        .close-btn:hover { opacity: 0.7; }
        
        .window-title { flex-grow: 1; text-align: center; font-weight: 600; font-size: 13px; color: #333; margin-left: -13px; }

        /* The iframe wrapper */
        .app-content { height: calc(100% - 40px); width: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Top Window Bar -->
    <div class="mac-titlebar">
        <a href="/" class="close-btn" title="Close App"></a>
        <div class="window-title">Croydon Bin Schedule</div>
    </div>

    <!-- The Actual Website Embedded inside your App -->
    <div class="app-content">
        <iframe src="https://www.croydon.gov.uk/rubbish-and-recycling/bins/check-your-bin-collection-days"></iframe>
    </div>

</body>
</html>
