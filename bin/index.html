<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#000; --ink:#f2f0eb; --dim:#6b6b6b; --line:#262626; --acid:#ff4d00;
            --ease-snappy:cubic-bezier(.5,0,.1,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
            --mono:'Space Mono', ui-monospace, monospace; --disp:'Archivo', system-ui, sans-serif;
        }
        body:not(.dark-mode){ --bg:#f4f2ec; --ink:#14110d; --dim:#8a857a; --line:#d8d4ca; --acid:#f23c00; }
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
        }

        /* The container that holds everything */
        #app-container {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            background-color: var(--bg); color: var(--ink); font-family: var(--disp);
            transform-origin: 70% 100%;
            transition: all 0.6s var(--ease-snappy);
            transform: scale(1) translateY(0);
            opacity: 1;
            border-radius: 0;
        }

        /* The Genie State (used for both opening and closing) */
        .genie-state {
            transform: scale(0.05) translateY(50vh) !important;
            opacity: 0 !important;
            border-radius: 100px !important;
        }

        /* Aero glass app window bar */
        .mac-titlebar {
            height: 42px; background: var(--bg);
            display: flex; align-items: center; gap: 12px; padding: 0 14px;
            border-bottom: 1px solid var(--line);
            position: relative; z-index: 9999;
        }

        /* The close orb — recognizable red, with an Aero specular dot */
        .close-btn {
            width: 24px; height: 24px; border: 1px solid var(--line);
            background: transparent; color: var(--ink); cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--mono); font-size: 12px; z-index: 99999;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .close-btn::before { content: '\2715'; }
        .close-btn:hover { background: var(--acid); color: #000; border-color: var(--acid); }

        .window-title {
            flex-grow: 1; text-align: center; margin-left: -36px; pointer-events: none;
            font-family: var(--mono); font-weight: 700; font-size: 12px;
            letter-spacing: 3px; text-transform: uppercase; color: var(--ink);
        }

        /* Camera wrapper — glass vignette frame around the feed */
        .app-content {
            height: calc(100% - 40px); width: 100%; position: relative;
            display: flex; justify-content: center; align-items: center;
            z-index: 1;
            background: #000;
        }
        .app-content::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        /* The video feed */
        video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1);
        }

        /* Message if they deny camera access */
        #error-msg {
            display: none; text-align: center; font-size: 1.2rem;
            color: var(--ink); font-family: var(--mono);
            position: absolute; z-index: 5; max-width: 80%;
        }
    </style>
</head>
<body>

    <div id="app-container" class="genie-state">

        <div class="mac-titlebar">
            <button id="close-btn" class="close-btn" title="Close App" aria-label="Close App"></button>
            <div class="window-title">Trash</div>
        </div>

        <div class="app-content">
            <video id="camera-feed" autoplay playsinline muted></video>

            <div id="error-msg">
                Oops! To see the trash, you need to allow camera access. 📷🗑️
            </div>
        </div>

    </div>

    <script src="../shared.js"></script>
    <script>
        // Redirect to wrapper if loaded directly
        if (window === window.parent) {
            window.location.replace('/?path=' + window.location.pathname);
        }

        const video = document.getElementById('camera-feed');
        const errorMsg = document.getElementById('error-msg');

        // Store stream to stop it on exit
        let currentStream = null;

        // --- THE GENIE ENTRANCE ANIMATION ---
        document.addEventListener("DOMContentLoaded", () => {
            CuceuTheme.apply();
            // A tiny delay gives the browser time to draw the tiny window first,
            // then we remove the class so it animates up to full size!
            setTimeout(() => {
                document.getElementById('app-container').classList.remove('genie-state');
            }, 50);
        });

        // --- THE GENIE EXIT ANIMATION ---
        function closeApp() {
            // Add the class back so it sucks down into the dock
            document.getElementById('app-container').classList.add('genie-state');

            // Stop camera to release the light indicator
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            setTimeout(() => {
                window.location.href = '/';
            }, 550);
        }
        document.getElementById('close-btn').addEventListener('click', closeApp);

        // Request front camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                currentStream = stream;
                video.srcObject = stream;
                video.play().catch(err => console.error("Video play error:", err));
            })
            .catch(err => {
                console.error("Camera access denied or failed:", err);
                errorMsg.style.display = 'block';
            });
    </script>
</body>
</html>
