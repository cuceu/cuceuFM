<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
        }

        /* The fake macOS app window bar */
        .mac-titlebar {
            height: 40px; background: #e5e5e5; display: flex; align-items: center; padding: 0 15px;
            border-bottom: 1px solid #ccc; position: relative; z-index: 10;
        }

        /* The close button to go back to the main site */
        .close-btn {
            width: 13px; height: 13px; background-color: #ff5f56; border-radius: 50%;
            display: inline-block; cursor: pointer; border: 1px solid #e0443e;
            transition: opacity 0.2s;
        }
        .close-btn:hover { opacity: 0.7; }
        
        .window-title { flex-grow: 1; text-align: center; font-weight: 600; font-size: 13px; color: #333; margin-left: -13px; }

        /* Camera wrapper */
        .app-content { 
            height: calc(100% - 40px); width: 100%; position: relative; 
            display: flex; justify-content: center; align-items: center;
        }

        /* The video feed */
        video {
            width: 100%; height: 100%; object-fit: cover;
            /* Flip the camera horizontally so it behaves like a mirror */
            transform: scaleX(-1);
        }

        /* Message if they deny camera access */
        #error-msg {
            display: none; text-align: center; font-size: 1.2rem;
            position: absolute; z-index: 5; max-width: 80%;
        }
    </style>
</head>
<body>

    <div class="mac-titlebar">
        <a href="/" class="close-btn" title="Close App"></a>
        <div class="window-title">Trash</div>
    </div>

    <div class="app-content">
        <video id="camera-feed" autoplay playsinline muted></video>
        
        <div id="error-msg">
            Oops! To see the trash, you need to allow camera access. 📷🗑️
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const errorMsg = document.getElementById('error-msg');

        // Request front camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Camera access denied or failed:", err);
                errorMsg.style.display = 'block';
            });
    </script>
</body>
</html>
