<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <meta name="description" content="cuceu.fm — Live internet radio. Music, visuals, creative experiments.">
    <meta property="og:title" content="cuceu.fm">
    <meta property="og:description" content="Live internet radio stream with real-time audio visualizer.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/4.0.0/simplex-noise.min.js"></script>
    <style>
        html, body {
            height: 100dvh; overflow: hidden;
        }

        /* ── FULL-BLEED CONTAINER ────────────────────── */
        #app-container {
            width: 100vw; height: 100dvh;
            position: relative; overflow: hidden;
            /* transparent so the body aurora wash shows through */
            background-color: transparent;
            transition: background-color var(--dur-slow) ease;
        }
        /* Visualizers always run on strict black, both themes */
        #app-container.viz-mode { background-color: #000; }
        #viz-canvas { z-index: 2; }

        /* ── TICKERS ─────────────────────────────────── */
        .ticker-tape {
            position: absolute; left: 0; right: 0;
            height: 54px; z-index: 60;
            background: linear-gradient(180deg, rgba(255,252,246,0.88), rgba(255,252,246,0.72));
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            color: var(--c-text);
            overflow: hidden; display: flex; align-items: center;
            transition: background var(--dur-slow) ease, color var(--dur-slow) ease;
        }
        body.dark-mode .ticker-tape,
        body.viz-active .ticker-tape {
            background: linear-gradient(180deg, rgba(8,5,2,0.82), rgba(8,5,2,0.68));
            color: #f4ede3;
        }
        /* Amber accent hairline on the inner edge */
        .ticker-tape::after {
            content: ''; position: absolute; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--c-amber-bright), var(--c-amber-hot), var(--c-amber-bright), transparent);
            opacity: 0.8;
        }
        .ticker-top::after    { bottom: 0; }
        .ticker-bottom::after { top: 0; }
        /* Periodic gloss sweep */
        .ticker-tape::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: var(--g-shine); background-size: 50% 100%; background-repeat: no-repeat;
            animation: aero-shine 14s linear infinite;
            opacity: 0.5; z-index: 1;
        }
        .ticker-top    { top: 0; }
        .ticker-bottom { bottom: 0; }
        .ticker-top    { transform: translateY(-100%); animation: stIn 0.55s var(--ease-smooth) 0.2s forwards; }
        .ticker-bottom { transform: translateY( 100%); animation: sbIn 0.55s var(--ease-smooth) 0.2s forwards; }
        body.is-exiting .ticker-top    { animation: stOut 0.3s var(--ease-smooth) forwards; }
        body.is-exiting .ticker-bottom { animation: sbOut 0.3s var(--ease-smooth) forwards; }
        @keyframes stIn  { to{transform:translateY(0)} }
        @keyframes sbIn  { to{transform:translateY(0)} }
        @keyframes stOut { to{transform:translateY(-100%)} }
        @keyframes sbOut { to{transform:translateY( 100%)} }
        .marquee-wrapper { display:flex; white-space:nowrap; align-items:center; width:fit-content; animation:tickerScroll linear infinite; transition: opacity 0.4s ease; }
        @keyframes tickerScroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
        .ticker-item  { display:inline-flex; align-items:center; }
        .ticker-art   {
            height:40px; width:40px; object-fit:cover; margin:0 20px; border-radius:8px; opacity:0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: opacity 0.4s ease, width 0.5s var(--ease-spring), margin 0.5s var(--ease-spring);
        }
        .ticker-art.has-art { opacity:1; }
        body.is-dvd .ticker-art { opacity: 0; width: 0; margin: 0; }
        .song-display { font-size:1.5rem; font-weight:900; text-transform:uppercase; letter-spacing:4px; padding:0 10px; }

        /* ── NAV ─────────────────────────────────────── */
        .top-nav-bar {
            position: absolute; top: 62px; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; z-index: 50;
            transition: opacity 1.2s var(--ease-smooth);
        }
        body.viz-active .cuceu-clock { color: #f4ede3; text-shadow: 0 0 8px rgba(0,0,0,0.5), 0 0 14px var(--c-amber-soft); }
        body.viz-active .theme-toggle { color: #f4ede3; }
        .nav-right { display: flex; align-items: center; gap: 12px; position: relative; }

        /* ── MAIN CLUSTER ──────────────────────────── */
        #main-cluster {
            position: absolute; top: 50%; left: 50%; z-index: 10;
            transform: translate(-50%, -50%);
            width: min(420px, calc(100vw - 40px));
            transition: opacity 1.2s ease;
        }
        .cluster-inner {
            display: flex; flex-direction: column; align-items: center; gap: 28px;
            width: 100%;
        }

        #bg-logo-layer {
            display: flex; flex-direction: column; align-items: center;
            user-select: none; pointer-events: none;
            transition: opacity 1.6s ease, transform 0.6s var(--ease-spring);
        }
        .logo-row { display:flex; align-items:flex-end; gap:0; }
        .cuceu-logo-img {
            height: clamp(4.5rem,16vw,8.5rem); width: auto;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
            transition: filter 1.8s ease;
        }
        body.dark-mode .cuceu-logo-img,
        body.viz-active .cuceu-logo-img { filter: drop-shadow(0 4px 16px rgba(255,176,102,0.25)); }
        .fm-text {
            font-size: clamp(1.6rem,5.5vw,3.2rem); font-weight: 900; letter-spacing: -2px; color: var(--c-text);
            padding-bottom: clamp(0.2rem,0.7vw,0.5rem); margin-left: -16px;
            transition: color 1.2s ease;
        }
        body.viz-active .fm-text { color: #fff; text-shadow: 0 2px 8px rgba(255,255,255,0.2); }

        /* ── PLAYER DECK ───────────────────────────── */
        #player-deck {
            width: 100%;
            border-radius: 28px;
            padding: 18px;
            display: flex; flex-direction: column; gap: 16px;
            transition: background var(--dur-slow) ease, box-shadow var(--dur-slow) ease;
        }
        body.viz-active #player-deck {
            background: rgba(18, 12, 6, 0.55);
            border-color: rgba(255, 176, 102, 0.22);
        }

        .deck-top { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .deck-art-wrap {
            position: relative; width: 76px; height: 76px; flex-shrink: 0;
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: box-shadow 0.8s ease;
        }
        .deck-art-wrap.playing {
            box-shadow: 0 0 0 2px var(--c-amber-bright), 0 0 22px var(--c-amber-glow),
                        0 4px 14px rgba(0,0,0,0.25);
        }
        #deck-art { width: 100%; height: 100%; object-fit: cover; display: block; }
        .deck-art-wrap::after {
            content: ''; position: absolute; inset: 0 0 50% 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.02));
            pointer-events: none;
        }

        .deck-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
        .deck-status {
            display: flex; align-items: center; gap: 7px;
            font-size: 0.6rem; font-weight: 800; letter-spacing: 2.5px;
            color: var(--c-text-muted); text-transform: uppercase;
        }
        body.viz-active .deck-status { color: #9a8d7c; }
        .deck-status .aero-dot { width: 8px; height: 8px; animation: aero-pulse 1.6s ease-in-out infinite; }
        .deck-status .aero-dot.buffering { animation: aero-blink 0.8s infinite alternate; }
        .deck-title {
            font-size: 0.92rem; font-weight: 800; letter-spacing: 0.5px;
            color: var(--c-text); text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        body.viz-active .deck-title { color: #f4ede3; }
        .deck-artist {
            font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px;
            color: var(--c-text-muted); text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .deck-controls { display: flex; align-items: center; gap: 14px; }
        .deck-play {
            width: 54px; height: 54px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .deck-play svg { width: 22px; height: 22px; fill: #fff; position: relative; z-index: 1; }
        .deck-play.playing { box-shadow: var(--sh-gloss), var(--sh-glow); }
        .deck-volume { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .deck-volume svg { flex-shrink: 0; color: var(--c-text-muted); }
        .deck-volume .aero-slider { flex: 1; min-width: 0; }
        .deck-history-btn {
            background: transparent; border: none; padding: 8px; cursor: pointer;
            color: var(--c-text-muted); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.3s, transform 0.4s var(--ease-spring);
        }
        .deck-history-btn:hover { color: var(--c-amber); }
        #player-deck.expanded .deck-history-btn { color: var(--c-amber); transform: rotate(180deg); }

        .deck-drawer-wrap {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.6s var(--ease-spring);
        }
        #player-deck.expanded .deck-drawer-wrap { grid-template-rows: 1fr; }
        .deck-drawer { min-height: 0; overflow: hidden; }
        .deck-drawer-head {
            font-size: 0.55rem; font-weight: 800; letter-spacing: 2.5px;
            color: var(--c-text-muted); text-transform: uppercase;
            padding: 4px 4px 8px;
            border-bottom: 1px solid var(--c-glass-edge);
        }
        #history-list { list-style: none; padding: 6px 0 0; margin: 0; display: flex; flex-direction: column; }
        .history-item {
            display: flex; align-items: baseline; gap: 10px;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
            color: var(--c-text-muted);
            padding: 7px 4px;
            border-bottom: 1px solid var(--c-glass-edge);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: color 0.3s, background 0.3s;
            border-radius: 6px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item:hover { color: var(--c-amber-bright); background: var(--c-amber-soft); }
        .history-num { font-size: 0.58rem; font-weight: 900; color: var(--c-amber); flex-shrink: 0; }
        body.viz-active .history-item { color: #9a8d7c; }
        body.viz-active .deck-title, body.viz-active .history-item:hover { color: var(--c-amber-hot); }

        /* ── BACKGROUND MODES (DVD) ──────────────────── */
        #bg-layer {
            position: absolute; inset: 0; z-index: 1;
            pointer-events: none; overflow: hidden;
        }
        #dvd-box {
            position: absolute; top: 0; left: 0;
            width: clamp(120px, 22vw, 220px);
            opacity: 0;
            transition: opacity 0.8s ease;
            will-change: transform;
            border-radius: 8px;
        }
        #bg-layer.mode-dvd #dvd-box { opacity: 1; }
        #dvd-artwork { display: block; width: 100%; height: auto; border-radius: 8px; }
        .dvd-tint {
            position: absolute; inset: 0; border-radius: 8px;
            mix-blend-mode: color; opacity: 0.45;
            pointer-events: none;
            transition: background 0.15s ease;
        }
        #dvd-box::after {
            content: ''; position: absolute; inset: 0 0 55% 0; border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.02));
            pointer-events: none;
        }
        #dvd-box.corner-pop { animation: dvdPop 0.7s var(--ease-spring); }
        @keyframes dvdPop {
            0% { scale: 1; } 35% { scale: 1.18; } 100% { scale: 1; }
        }
        .dvd-burst {
            position: absolute; inset: -30%;
            border: 3px solid var(--c-amber-hot); border-radius: 50%;
            opacity: 0; pointer-events: none;
            transform: scale(0.4);
        }
        .dvd-burst.go { animation: dvdBurst 0.7s var(--ease-smooth) forwards; }
        @keyframes dvdBurst {
            0%   { opacity: 0.9; transform: scale(0.4); }
            100% { opacity: 0;   transform: scale(1.6); }
        }
        .dvd-badge {
            position: absolute; top: -10px; right: -10px;
            min-width: 22px; height: 22px; padding: 0 6px;
            border-radius: 11px; background: var(--g-gel);
            color: #fff; font-size: 11px; font-weight: 900;
            display: none; align-items: center; justify-content: center;
            box-shadow: var(--sh-gloss), 0 2px 8px rgba(0,0,0,0.3);
        }
        .dvd-badge.show { display: flex; }

        /* ── MODE DOCK ──────────────────────────────── */
        .mode-dock-wrap {
            position: absolute; bottom: 70px; left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            max-width: calc(100vw - 32px);
            transition: opacity 1.2s var(--ease-smooth);
        }
        .mode-toggle {
            display: flex; gap: 0;
            border-radius: var(--r-pill); padding: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            max-width: 100%;
            flex-wrap: nowrap;
        }
        .mode-toggle::-webkit-scrollbar { display: none; }
        body.viz-active .mode-toggle {
            background: rgba(18, 12, 6, 0.6);
            border-color: rgba(255, 176, 102, 0.22);
        }
        .mode-btn {
            position: relative;
            background: transparent; border: none;
            padding: 7px 14px; font-size: 9px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--c-text-muted); cursor: pointer;
            border-radius: var(--r-pill); white-space: nowrap;
            flex-shrink: 0; overflow: hidden;
            transition: color 0.3s, background 0.3s var(--ease-spring), transform 0.3s var(--ease-spring);
        }
        .mode-btn:hover { color: var(--c-text); transform: scale(1.05); }
        body.viz-active .mode-btn { color: #9a8d7c; }
        body.viz-active .mode-btn:hover { color: #f4ede3; }
        .mode-btn.active { background: var(--g-gel); color: #fff; box-shadow: var(--sh-gloss), 0 2px 10px rgba(143,74,20,0.35); }
        .mode-btn.active::before {
            content: ''; position: absolute; inset: 1px 1px 55% 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.06));
            border-radius: inherit; pointer-events: none;
        }

        .viz-settings-btn {
            background: transparent; border: none; color: var(--c-text-muted);
            cursor: pointer;
            border-radius: 50%; opacity: 0; pointer-events: none;
            width: 0; padding: 0; transition: width 0.3s, opacity 0.3s, padding 0.3s, color 0.3s;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        body.viz-active .viz-settings-btn {
            width: 30px; padding: 4px; opacity: 1; pointer-events: auto; margin-left: 2px;
            color: #9a8d7c;
        }
        .viz-settings-btn:hover { color: var(--c-amber-bright); background: var(--c-amber-soft); }

        .viz-settings-popup {
            position: absolute; bottom: calc(100% + 12px); right: 0;
            border-radius: var(--r-lg);
            padding: 16px; display: flex; flex-direction: column; gap: 6px;
            opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.95);
            transition: opacity 0.3s var(--ease-spring), transform 0.3s var(--ease-spring);
            width: 210px; transform-origin: bottom right;
            max-height: min(420px, calc(100dvh - 220px)); overflow-y: auto;
            background: rgba(18, 12, 6, 0.85);
            border-color: rgba(255, 176, 102, 0.22);
        }
        .viz-settings-popup.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        .viz-set-section {
            color: var(--c-amber-hot); font-size: 9px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,176,102,0.15);
            padding: 8px 0 6px; margin-bottom: 4px;
        }
        .viz-set-section:first-child { padding-top: 0; }
        .viz-set-row {
            display: flex; flex-direction: column; gap: 6px; padding: 4px 0;
            color: rgba(244, 237, 227, 0.65);
            font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
        }
        .viz-set-range { width: 100%; height: 4px; }
        .viz-set-select {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,176,102,0.25);
            color: #f4ede3; padding: 5px; border-radius: 6px; outline: none;
            font-size: 8px; font-weight: 800; text-transform: uppercase;
            cursor: pointer; font-family: var(--font-primary);
        }
        .viz-set-select option { background: #1a120a; color: #f4ede3; }
        .viz-set-reset {
            margin-top: 8px; padding: 6px;
            background: rgba(255,176,102,0.1); border: 1px solid rgba(255,176,102,0.25);
            border-radius: var(--r-pill); color: var(--c-amber-hot);
            font-size: 8px; font-weight: 900; letter-spacing: 2px; cursor: pointer;
            font-family: var(--font-primary);
            transition: background 0.3s, color 0.3s;
        }
        .viz-set-reset:hover { background: var(--c-amber); color: #fff; }

        /* ── IDLE FADE (viz modes) ───────────────────── */
        body.viz-active.ui-idle .top-nav-bar,
        body.viz-active.ui-idle #main-cluster,
        body.viz-active.ui-idle .mode-dock-wrap {
            opacity: 0; pointer-events: none;
        }

        /* ── MOBILE ──────────────────────────────────── */
        @media (max-width: 600px) {
            .top-nav-bar  { top:50px; padding:10px 16px; }
            .ticker-tape  { height:48px; }
            .song-display { font-size:1.2rem; letter-spacing:3px; }
            .ticker-art   { height:34px; width:34px; }
            #player-deck  { padding: 14px; gap: 12px; border-radius: 24px; }
            .deck-art-wrap { width: 60px; height: 60px; }
            .deck-play    { width: 48px; height: 48px; }
            .cluster-inner { gap: 20px; }
            .fm-text { margin-left:-12px; }
            .mode-dock-wrap { bottom: 60px; }
            .mode-btn     { padding: 6px 9px; font-size: 7.5px; letter-spacing: 1.5px; }
            #dvd-box      { width: clamp(100px, 30vw, 160px); }
        }
    </style>
</head>
<body>

    <div id="app-container" class="a-pop">
        <div class="ticker-tape ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>

        <div class="top-nav-bar a-drop" style="--d:.2s">
            <a href="/" class="back-pill internal-link">Home</a>
            <div class="nav-right">
                <div class="cuceu-clock"><span class="cuceu-clock-text">MONDAY | 00:00 AM</span></div>
                <button class="theme-toggle" id="direct-theme-toggle" aria-label="Toggle Theme">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>

        <!-- FOREGROUND: LOGO + PLAYER DECK -->
        <div id="main-cluster">
            <div class="cluster-inner a-rise" style="--d:.35s">
                <div id="bg-logo-layer">
                    <div class="logo-row">
                        <img src="cuceugrta.png" alt="CUCEU" class="cuceu-logo-img">
                        <span class="fm-text">.fm</span>
                    </div>
                </div>

                <div id="player-deck" class="aero-panel">
                    <div class="deck-top">
                        <div class="deck-art-wrap" id="deck-art-wrap">
                            <img id="deck-art" src="cuceugrta.png" alt="Album artwork">
                        </div>
                        <div class="deck-meta">
                            <div class="deck-status">
                                <div class="aero-dot" id="deck-dot" style="--dot-c:#9a9a9a"></div>
                                <span id="deck-status-text">CHECKING...</span>
                            </div>
                            <div class="deck-title" id="deck-title">CUCEU.FM</div>
                            <div class="deck-artist" id="deck-artist">INTERNET RADIO</div>
                        </div>
                    </div>

                    <div class="deck-controls">
                        <button id="btn" class="deck-play aero-gel" aria-label="Play/Pause">
                            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <svg class="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <div class="deck-volume">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                            <input type="range" id="volume-slider" class="aero-slider" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
                        </div>
                        <button id="history-toggle" class="deck-history-btn" aria-label="Toggle recently played">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                    </div>

                    <div class="deck-drawer-wrap">
                        <div class="deck-drawer">
                            <div class="deck-drawer-head">Recently Played</div>
                            <ul id="history-list"><li class="history-item">Loading...</li></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Background mode layers -->
        <div id="bg-layer">
            <div id="dvd-box">
                <img id="dvd-artwork" src="" alt="">
                <div class="dvd-tint"></div>
                <div class="dvd-burst" id="dvd-burst"></div>
                <span class="dvd-badge" id="dvd-badge">0</span>
            </div>
        </div>

        <!-- Mode dock -->
        <div class="mode-dock-wrap" id="mode-dock-wrap">
            <div class="mode-toggle aero-panel a-slideup" style="--d:.45s" id="mode-toggle">
                <button class="mode-btn active" data-mode="clean">Clean</button>
                <button class="mode-btn" data-mode="dvd">DVD</button>
                <button class="mode-btn" data-mode="starlight">Starlight</button>
                <button class="mode-btn" data-mode="halo">Halo</button>
                <button class="mode-btn" data-mode="aurora">Aurora</button>
                <button class="mode-btn" data-mode="nebula">Nebula</button>
                <button class="mode-btn" data-mode="prism">Prism</button>
                <button class="viz-settings-btn" id="viz-settings-btn" aria-label="Visualizer Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
            <div class="viz-settings-popup aero-panel" id="viz-settings-popup">
                <div id="viz-settings-mount"></div>
            </div>
        </div>

        <div class="ticker-tape ticker-bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>
        <audio id="radioPlayer" preload="none" crossorigin="anonymous"></audio>
    </div>

<script src="../shared.js"></script>
<script src="viz-core.js"></script>
<script src="visualizers.js"></script>
<script>
// Redirect to wrapper if loaded directly
if (window === window.parent) {
    window.location.replace('/?path=' + window.location.pathname);
}

// ── THEME TOGGLE (shared.js; visualizers run on black in both themes) ──
CuceuTheme.bindToggle(document.getElementById('direct-theme-toggle'));

// ── STREAM ────────────────────────────────────────────────────
const STREAM_BASE    = "https://stream.cuceu.co.uk";
const btn            = document.getElementById('btn');
// Use the global wrapper player if available, else fall back to the local element
const isWrapper      = window !== window.parent && window.parent.CuceuGlobalPlayer;
const player         = isWrapper ? window.parent.CuceuGlobalPlayer.getAudioElement() : document.getElementById('radioPlayer');

// FM page has its own controls — hide the wrapper mini player here
if (isWrapper) {
    window.parent.CuceuGlobalPlayer.hideMiniPlayer();
}

const deckStatusText = document.getElementById('deck-status-text');
const deckDot        = document.getElementById('deck-dot');
const deckTitle      = document.getElementById('deck-title');
const deckArtist     = document.getElementById('deck-artist');
const deckArt        = document.getElementById('deck-art');
const deckArtWrap    = document.getElementById('deck-art-wrap');
const playerDeck     = document.getElementById('player-deck');
const historyList    = document.getElementById('history-list');
const historyToggle  = document.getElementById('history-toggle');
const topMarquee     = document.getElementById('top-marquee');
const bottomMarquee  = document.getElementById('bottom-marquee');
let playing = false, isOnline = false, currentTitle = '', currentArtUrl = '', currentTickerBase = '';

const DOT_COLORS = {
    live: '#4ade80', buffering: '#ffcc00', 'on-air': '#f0913c',
    offline: '#777777', checking: '#9a9a9a'
};
function setStatus(text, kind) {
    deckStatusText.textContent = text;
    deckDot.style.setProperty('--dot-c', DOT_COLORS[kind] || DOT_COLORS.checking);
    deckDot.classList.toggle('buffering', kind === 'buffering');
}

function setDeckSong(title) {
    // Titles usually arrive as "Artist - Track"
    const sep = title.indexOf(' - ');
    if (sep > 0) {
        deckArtist.textContent = title.slice(0, sep);
        deckTitle.textContent = title.slice(sep + 3);
    } else {
        deckArtist.textContent = 'CUCEU.FM';
        deckTitle.textContent = title;
    }
    deckTitle.title = title;
}

function updateTicker(base) {
    const art = currentArtUrl ? `<img class="ticker-art has-art" src="${currentArtUrl}" alt="">` : `<span style="display:inline-block;width:10px"></span>`;
    const item = `<div class="ticker-item"><span class="song-display">${base}</span>${art}</div>`;
    const content = Array(14).fill(item).join('');
    const dur = Math.max(22, base.length * 1.6);
    topMarquee.style.opacity = '0'; bottomMarquee.style.opacity = '0';
    setTimeout(() => {
        topMarquee.innerHTML = content + content;
        topMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.innerHTML = content + content;
        bottomMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s`;
        topMarquee.style.opacity = '1'; bottomMarquee.style.opacity = '1';
    }, 400);
}

historyToggle.addEventListener('click', () => playerDeck.classList.toggle('expanded'));

async function fetchGlobalHistory() {
    try {
        const d = await fetch(`${STREAM_BASE}/history.json?t=` + Date.now()).then(r => r.json());
        if (d) historyList.innerHTML = d.filter(Boolean).map((t, i) =>
            `<li class="history-item"><span class="history-num">${String(i + 1).padStart(2, '0')}</span>${t}</li>`).join('');
    } catch(_) {}
}
async function fetchArtwork() {
    try {
        const u = (await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now()).then(r => r.text())).trim();
        if (u && u.startsWith('http')) currentArtUrl = u;
    } catch(_) { currentArtUrl = ''; }
    deckArt.src = currentArtUrl || 'cuceugrta.png';
    if (currentMode === 'dvd') setDvdArt(currentArtUrl || 'cuceugrta.png');
}
async function fetchSongData() {
    try {
        const data = await fetch(`${STREAM_BASE}/status-json.xsl?t=` + Date.now()).then(r => r.json());
        const s = data.icestats.source; if (!s) throw new Error();
        isOnline = true;
        const t = Array.isArray(s) ? (s[0].title || 'ON AIR') : (s.title || 'ON AIR');
        if (!playing) setStatus('LIVE', 'live');
        if (t !== currentTitle) {
            currentTitle = t; fetchGlobalHistory(); await fetchArtwork();
            setDeckSong(t);
            currentTickerBase = `NOW PLAYING: ${t}`;
            updateTicker(currentTickerBase);
        }
    } catch(_) {
        isOnline = false;
        if (!playing) {
            setStatus('OFFLINE', 'offline');
            if (currentTickerBase !== 'STANDBY') { currentTickerBase = 'STANDBY'; updateTicker('STANDBY'); }
        }
    }
}
player.onwaiting = () => { if (playing) setStatus('BUFFERING...', 'buffering'); };
player.onplaying = () => { if (playing) setStatus('ON AIR', 'on-air'); };
player.onpause   = () => { if (isOnline) setStatus('LIVE', 'live'); };

const playIcon = btn.querySelector('.play-icon');
const pauseIcon = btn.querySelector('.pause-icon');
btn.addEventListener('click', () => {
    if (!playing) {
        player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`;
        player.play().catch(() => {});
        playIcon.style.display = 'none'; pauseIcon.style.display = 'block';
        btn.classList.add('playing');
        deckArtWrap.classList.add('playing');
        setStatus('BUFFERING', 'buffering');
        resumeAudioGraph();
    } else {
        player.pause(); player.src = '';
        playIcon.style.display = 'block'; pauseIcon.style.display = 'none';
        btn.classList.remove('playing');
        deckArtWrap.classList.remove('playing');
        setStatus(isOnline ? 'LIVE' : 'OFFLINE', isOnline ? 'live' : 'offline');
    }
    playing = !playing;
});

// Volume — persisted across visits
const volumeSlider = document.getElementById('volume-slider');
const savedVolume = CuceuStore.get('cuceu-volume', 0.5);
volumeSlider.value = savedVolume;
player.volume = savedVolume;
volumeSlider.addEventListener('input', (e) => {
    player.volume = e.target.value;
    CuceuStore.set('cuceu-volume', parseFloat(e.target.value));
});

updateTicker('STANDBY'); fetchSongData(); fetchGlobalHistory();
let fetchInterval = setInterval(fetchSongData, 4000);
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        fetchSongData();
        clearInterval(fetchInterval);
        fetchInterval = setInterval(fetchSongData, 4000);
        if (currentMode === 'dvd') resumeDvd();
    } else {
        clearInterval(fetchInterval);
    }
});

// ── AUDIO GRAPH (analyser lives in the wrapper when framed) ──
let localCtx = null, localAnalyser = null;
function ensureLocalAudio() {
    if (localCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    localCtx = new AC();
    localAnalyser = localCtx.createAnalyser();
    localAnalyser.fftSize = 1024;
    localAnalyser.smoothingTimeConstant = 0.8;
    const src = localCtx.createMediaElementSource(player);
    src.connect(localAnalyser);
    localAnalyser.connect(localCtx.destination);
}
function resumeAudioGraph() {
    if (isWrapper) {
        window.parent.CuceuGlobalPlayer.resumeAudioContext();
    } else {
        ensureLocalAudio();
        if (localCtx.state === 'suspended') localCtx.resume();
    }
}

const audioProvider = isWrapper ? {
    getFrequencyData: (a) => window.parent.CuceuGlobalPlayer.getFrequencyData(a),
    getSampleRate: () => window.parent.CuceuGlobalPlayer.getSampleRate(),
    getFrequencyBinCount: () => window.parent.CuceuGlobalPlayer.getFrequencyBinCount()
} : {
    getFrequencyData: (a) => { if (localAnalyser) localAnalyser.getByteFrequencyData(a); },
    getSampleRate: () => localCtx ? localCtx.sampleRate : 44100,
    getFrequencyBinCount: () => localAnalyser ? localAnalyser.frequencyBinCount : 512
};

// ══════════════════════════════════════════════════════════════
// MODE SYSTEM (Clean / DVD / 5 visualizers)
// ══════════════════════════════════════════════════════════════
const bgLayer    = document.getElementById('bg-layer');
const container  = document.getElementById('app-container');
const modeToggle = document.getElementById('mode-toggle');
const modeBtns   = modeToggle.querySelectorAll('.mode-btn');
const VIZ_MODES  = ['starlight', 'halo', 'aurora', 'nebula', 'prism'];
let currentMode = 'clean';

CuceuViz.setup({ container, provider: audioProvider });

const vizSettingsBtn = document.getElementById('viz-settings-btn');
const vizSettingsPopup = document.getElementById('viz-settings-popup');
const vizSettingsMount = document.getElementById('viz-settings-mount');

function setMode(mode) {
    if (mode === currentMode) return;
    stopDvd();
    CuceuViz.stop();

    bgLayer.className = '';
    container.classList.remove('viz-mode');
    currentMode = mode;
    document.body.classList.toggle('is-dvd', mode === 'dvd');
    document.body.classList.toggle('viz-active', VIZ_MODES.includes(mode));
    document.body.dataset.activeMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    vizSettingsPopup.classList.remove('visible');
    CuceuStore.set('cuceu-fm-mode', mode);

    if (mode === 'dvd') {
        bgLayer.classList.add('mode-dvd');
        startDvd();
    } else if (VIZ_MODES.includes(mode)) {
        container.classList.add('viz-mode');
        resumeAudioGraph();
        CuceuViz.start(mode);
        CuceuViz.buildSettingsPanel(mode, vizSettingsMount);
    }
    resetIdleTimer();
}

modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

vizSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    vizSettingsPopup.classList.toggle('visible');
});
document.addEventListener('click', (e) => {
    if (!vizSettingsPopup.contains(e.target) && !vizSettingsBtn.contains(e.target)) {
        vizSettingsPopup.classList.remove('visible');
    }
});

// ── IDLE FADE (chrome fades after 4s in viz modes) ──────────
let idleTimer = null;
function resetIdleTimer() {
    document.body.classList.remove('ui-idle');
    if (idleTimer) clearTimeout(idleTimer);
    if (!VIZ_MODES.includes(currentMode)) return;
    idleTimer = setTimeout(() => {
        if (!vizSettingsPopup.classList.contains('visible')) {
            document.body.classList.add('ui-idle');
        }
    }, 4000);
}
['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev =>
    document.addEventListener(ev, resetIdleTimer, { passive: true }));

// ══════════════════════════════════════════════════════════════
// DVD MODE — authentic constant-speed diagonal bounce
// ══════════════════════════════════════════════════════════════
const dvdBox   = document.getElementById('dvd-box');
const dvdArt   = document.getElementById('dvd-artwork');
const dvdTint  = dvdBox.querySelector('.dvd-tint');
const dvdBurst = document.getElementById('dvd-burst');
const dvdBadge = document.getElementById('dvd-badge');
const tickerTopEl = document.querySelector('.ticker-top');
const tickerBottomEl = document.querySelector('.ticker-bottom');

const DVD_TINTS = ['#ffffff', '#ffb066', '#f0913c', '#ffd23f', '#ff5c5c', '#7ce0a3', '#6fb7ff', '#c792ff'];
let dvdAnimId = null, dvdX = 100, dvdY = 100, dvdVx = 0, dvdVy = 0;
let dvdLastT = 0, dvdTintIdx = 0;
let dvdCorners = parseInt(sessionStorage.getItem('cuceu-dvd-corners') || '0', 10);

function dvdBounds() {
    return {
        top: tickerTopEl.offsetHeight,
        bottom: container.clientHeight - tickerBottomEl.offsetHeight,
        left: 0,
        right: container.clientWidth
    };
}

function setDvdArt(url) { dvdArt.src = url; }

function applyDvdTint() {
    dvdTintIdx = (dvdTintIdx + 1) % DVD_TINTS.length;
    const c = DVD_TINTS[dvdTintIdx];
    dvdTint.style.background = c;
    dvdBox.style.filter = `drop-shadow(0 0 16px ${c}80)`;
}

function celebrateCorner() {
    dvdCorners++;
    sessionStorage.setItem('cuceu-dvd-corners', String(dvdCorners));
    dvdBadge.textContent = dvdCorners;
    dvdBadge.classList.add('show');
    dvdBox.classList.remove('corner-pop');
    dvdBurst.classList.remove('go');
    // restart the one-shot animations
    void dvdBox.offsetWidth;
    dvdBox.classList.add('corner-pop');
    dvdBurst.classList.add('go');
}

function initDvdPosition() {
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180;
    const h = dvdBox.offsetHeight || 180;
    dvdX = b.left + Math.random() * Math.max(1, b.right - b.left - w);
    dvdY = b.top + Math.random() * Math.max(1, b.bottom - b.top - h);
    // OG DVD logo: constant speed, perfect 45° diagonals (|vx| = |vy|)
    const speed = (window.innerWidth < 600 ? 120 : 170) / Math.SQRT2;
    dvdVx = (Math.random() < 0.5 ? -1 : 1) * speed;
    dvdVy = (Math.random() < 0.5 ? -1 : 1) * speed;
}

function dvdFrame(now) {
    if (currentMode !== 'dvd') return;
    const dt = Math.min((now - dvdLastT) / 1000, 0.05);
    dvdLastT = now;

    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180;
    const h = dvdBox.offsetHeight || 180;
    dvdX += dvdVx * dt;
    dvdY += dvdVy * dt;

    let hitX = false, hitY = false;
    if (dvdX <= b.left)          { dvdX = b.left;        dvdVx = Math.abs(dvdVx);  hitX = true; }
    if (dvdX + w >= b.right)     { dvdX = b.right - w;   dvdVx = -Math.abs(dvdVx); hitX = true; }
    if (dvdY <= b.top)           { dvdY = b.top;         dvdVy = Math.abs(dvdVy);  hitY = true; }
    if (dvdY + h >= b.bottom)    { dvdY = b.bottom - h;  dvdVy = -Math.abs(dvdVy); hitY = true; }

    if (hitX || hitY) applyDvdTint();
    if (hitX && hitY) celebrateCorner();

    dvdBox.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    dvdAnimId = requestAnimationFrame(dvdFrame);
}

function startDvd() {
    setDvdArt(currentArtUrl || 'cuceugrta.png');
    if (dvdCorners > 0) { dvdBadge.textContent = dvdCorners; dvdBadge.classList.add('show'); }
    const begin = () => { initDvdPosition(); dvdLastT = performance.now(); dvdAnimId = requestAnimationFrame(dvdFrame); };
    if (dvdArt.complete && dvdArt.naturalWidth > 0) begin();
    else dvdArt.onload = begin;
}
function resumeDvd() {
    if (dvdAnimId) cancelAnimationFrame(dvdAnimId);
    dvdLastT = performance.now();
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function stopDvd() {
    if (dvdAnimId) { cancelAnimationFrame(dvdAnimId); dvdAnimId = null; }
}

// Keep the box inside the bounds when the window resizes
new ResizeObserver(() => {
    if (currentMode !== 'dvd') return;
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180;
    const h = dvdBox.offsetHeight || 180;
    dvdX = Math.min(Math.max(dvdX, b.left), b.right - w);
    dvdY = Math.min(Math.max(dvdY, b.top), b.bottom - h);
}).observe(container);

// ── RESTORE LAST MODE ────────────────────────────────────────
const savedMode = CuceuStore.get('cuceu-fm-mode', 'clean');
if (savedMode !== 'clean' && (savedMode === 'dvd' || VIZ_MODES.includes(savedMode))) {
    setMode(savedMode);
}
</script>
</body>
</html>
