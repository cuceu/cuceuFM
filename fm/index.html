<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <meta name="description" content="cuceu.fm — Live internet radio. Music, visuals, creative experiments.">
    <meta property="og:title" content="cuceu.fm">
    <meta property="og:description" content="Live internet radio, broadcasting from London.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper:#f7f6f4; --ink:#141414; --dim:#8b877e; --line:#d9d6cd;
            --accent:#dc772b; --amber:#e0a11f;
            --mono:'Space Mono', ui-monospace, monospace;
            --disp:'Archivo', system-ui, sans-serif;
            --spring:cubic-bezier(.34,1.4,.5,1);
        }
        * { box-sizing:border-box; margin:0; }
        html, body { height:100dvh; overflow:hidden; }
        body { background:var(--paper); color:var(--ink); font-family:var(--disp);
            display:flex; flex-direction:column; }

        /* ── TICKERS — black tape, top + bottom ──────── */
        .tick { flex-shrink:0; height:44px; background:#0b0b0b; color:#fff;
            display:flex; align-items:center; overflow:hidden; z-index:6; position:relative; }
        .tick.top { animation:dropIn .55s ease .85s both; }
        .tick.bottom { animation:riseIn .55s ease .85s both; }
        .marquee-wrapper { display:flex; white-space:nowrap; align-items:center; width:fit-content;
            animation:tickerScroll linear infinite; }
        @keyframes tickerScroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
        @keyframes trackRoll { 0%{opacity:.4} 100%{opacity:1} }
        .ticker-item { display:inline-flex; align-items:center; }
        .song-display { font-family:var(--disp); font-weight:800; font-size:13px;
            letter-spacing:2.5px; text-transform:uppercase; padding:0 16px; }
        .ticker-art { height:28px; width:28px; object-fit:cover; margin:0 16px;
            border:1px solid #2e2e2e; animation:pop .4s var(--spring) both; }

        /* ── STAGE — the wall ────────────────────────── */
        #stage { position:relative; flex:1; min-height:0; overflow:hidden; }
        #wall { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover;
            user-select:none; -webkit-user-drag:none; pointer-events:none;
            animation:wallIn .8s ease both; }
        /* Photo bleed — when the shot is scaled down to leave room for the
           controls it stops covering the stage sideways. These stretch its
           outermost sliver of wall into the gap so it never ends on a hard
           edge. Same vertical scale + offset as the shot, so the seam lines
           up exactly; only the thin edge strip is stretched. */
        /* live wallpaper — sits under everything, replaces the shot */
        #viz { position:absolute; inset:0; width:100%; height:100%; z-index:0;
            display:none; pointer-events:none; }
        body.viz-on #viz { display:block; }
        body.viz-on #wall { display:none; }

        .bleed { position:absolute; z-index:0; display:none; pointer-events:none;
            background-image:url(IMG_1148.webp); background-repeat:no-repeat;
            animation:wallIn .8s ease both; }

        /* chrome pinned to the wall corners */
        .back { position:absolute; top:18px; left:20px; z-index:5;
            font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:1px;
            text-transform:uppercase; border:1px solid var(--ink); padding:7px 13px;
            color:var(--ink); background:var(--paper); text-decoration:none;
            transition:background .2s, color .2s;
            animation:fadeIn .5s ease .45s both; }
        .back:hover { background:var(--ink); color:var(--paper); }
        #clock { position:absolute; top:24px; right:22px; z-index:5;
            font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px;
            text-transform:uppercase; color:var(--ink);
            animation:fadeIn .5s ease .45s both; }

        /* ── WINDOW-ANCHORED OVERLAY (logo + live) ───── */
        /* Position comes from CSS vars set by layout() — immune to reload timing. */
        #overlay { position:absolute; z-index:3;
            left:calc(var(--win-x, 30%) + var(--win-w, 40%) / 2);
            top:calc(var(--win-y, 25%) + var(--win-h, 30%) * .44);
            transform:translate(-50%, -50%);
            display:flex; flex-direction:column; align-items:center;
            gap:calc(var(--win-h, 200px) * .07);
            animation:rise .6s var(--spring) .55s both; }
        .mark { display:flex; align-items:flex-end; }
        #logo { width:clamp(120px, calc(var(--win-w, 500px) * .52), 560px); display:block;
            filter:drop-shadow(0 2px 6px rgba(0,0,0,.28)); }
        .fm-suffix { font-family:var(--disp); font-weight:900; color:#101010;
            font-size:clamp(17px, calc(var(--win-w, 500px) * .072), 58px);
            line-height:1; margin-left:calc(var(--win-w, 500px) * -0.018); margin-bottom:2%;
            text-shadow:0 1px 3px rgba(255,255,255,.5); }
        #live { display:flex; align-items:center; gap:8px;
            font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:5px;
            text-transform:uppercase; color:#0d0d0d;
            background:var(--paper); padding:5px 13px 5px 15px;
            box-shadow:2px 2px 0 rgba(0,0,0,.14); }
        #live i { width:9px; height:9px; border-radius:50%; background:var(--accent);
            animation:blink 1s steps(2) infinite alternate; }
        @keyframes blink { from{opacity:1} to{opacity:.25} }
        #live.buffering { color:var(--amber); letter-spacing:3px; }
        #live.buffering i { background:var(--amber); animation-duration:.5s; }
        #live.offair { color:var(--dim); letter-spacing:3px; }
        #live.offair i { background:var(--dim); animation:none; opacity:.6; }

        /* ── UNDER THE WINDOW — listen + recently played ── */
        #under { position:absolute; z-index:4; left:50%; transform:translateX(-50%);
            top:calc(var(--win-y, 25%) + var(--win-h, 30%) + clamp(20px, 4.2vh, 46px));
            display:flex; flex-direction:column; align-items:center; gap:13px;
            animation:rise .6s var(--spring) .72s both; }

        .listen-row { display:flex; flex-direction:column; align-items:center; }
        .listen { display:inline-flex; align-items:center; gap:11px; border:none; cursor:pointer;
            background:#0b0b0b; color:#fff; padding:13px 30px;
            font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:3px;
            text-transform:uppercase; transition:background .2s, transform .15s;
            box-shadow:2px 3px 0 rgba(0,0,0,.18); }
        .listen:hover { background:var(--accent); }
        .listen:active { transform:translateY(1px); box-shadow:1px 2px 0 rgba(0,0,0,.18); }
        .listen .pic { font-size:12px; line-height:1; }
        /* only listen when live — offline hides the whole row (unless already playing) */
        body.offline:not(.playing) .listen-row { display:none; }

        /* tucked-away volume — appears only while playing */
        #vol { display:flex; gap:3px; cursor:pointer; opacity:0; pointer-events:none;
            height:0; margin-top:0; overflow:hidden; transform:translateY(-8px);
            transition:opacity .3s ease, transform .4s var(--spring),
                       height .4s var(--spring), margin-top .4s var(--spring); }
        body.playing #vol { opacity:1; height:17px; margin-top:14px;
            transform:translateY(0); pointer-events:auto; }
        #vol i { width:5px; height:17px; background:var(--line); transition:background .1s; }
        #vol i.on { background:var(--ink); }

        .recent-toggle { background:none; border:none; cursor:pointer; padding:4px 8px;
            font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:2.5px;
            text-transform:uppercase; color:var(--ink); }
        .recent-toggle .arrow { display:inline-block; transition:transform .3s ease; margin-left:6px; }
        body.recent-open .recent-toggle .arrow { transform:rotate(180deg); }
        .recent-toggle:hover { color:var(--accent); }

        /* drops from the centre downward */
        #recent-panel { width:min(430px, 86vw); background:var(--paper); border:1px solid var(--ink);
            max-height:0; opacity:0; overflow:hidden; transform:translateY(-8px);
            transition:max-height .45s ease, opacity .35s ease, transform .45s ease; }
        body.recent-open #recent-panel { max-height:min(300px, var(--recent-max, 34vh)); opacity:1; transform:translateY(0); overflow-y:auto; }
        #history-list { list-style:none; padding:0; margin:0; }
        .history-item { display:flex; align-items:baseline; gap:12px;
            font-family:var(--mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase;
            padding:10px 16px; border-bottom:1px solid var(--line); color:var(--ink);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .history-item:last-child { border-bottom:none; }
        .history-num { color:var(--accent); font-weight:700; flex-shrink:0; }

        /* ── DVD MODE — loose art bounces on the wall ── */
        #dvd-art { position:absolute; z-index:2; left:0; top:0; width:clamp(110px, 15vw, 190px);
            aspect-ratio:1; object-fit:cover; border:2px solid var(--ink);
            box-shadow:3px 4px 0 rgba(0,0,0,.16); background:var(--paper);
            opacity:0; transition:opacity .5s ease; pointer-events:none; will-change:transform; }
        #dvd-art.fallback { object-fit:contain; padding:12px; }
        body[data-active-mode="dvd"] #dvd-art { opacity:1; }

        /* ── MODE SWITCH — quiet, bottom-right ───────── */
        #modes { position:absolute; bottom:12px; right:16px; z-index:5;
            display:flex; flex-direction:column; align-items:flex-end; gap:9px;
            animation:fadeIn .5s ease 1.1s both; }
        .mode-row { display:flex; gap:14px; }
        .wall-row { display:flex; gap:10px; align-items:center; }
        .wall-btn, .viz-gear { background:none; border:none; cursor:pointer; padding:0;
            color:var(--dim); line-height:0; transition:color .2s; }
        .wall-btn:hover, .viz-gear:hover { color:var(--ink); }
        .wall-btn[aria-pressed="true"] { color:var(--accent); }
        .viz-gear[hidden] { display:none; }
        body.viz-open .viz-gear { color:var(--ink); }

        /* user-facing viz controls — the lab keeps the rest */
        #viz-panel { position:absolute; bottom:0; right:100%; margin-right:12px; width:196px;
            background:var(--paper); border:1px solid var(--ink); padding:11px 12px 12px;
            opacity:0; transform:translateY(6px); pointer-events:none;
            transition:opacity .25s ease, transform .25s ease; }
        body.viz-open #viz-panel { opacity:1; transform:none; pointer-events:auto; }
        #viz-panel h4 { margin:0 0 8px; font-family:var(--mono); font-size:8.5px; font-weight:700;
            letter-spacing:2px; text-transform:uppercase; color:var(--dim); }
        .vz-pal { display:flex; gap:5px; margin-bottom:10px; }
        .vz-pal button { flex:1; cursor:pointer; padding:5px 2px; background:none;
            border:1px solid var(--line); color:var(--ink);
            font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:1.4px;
            text-transform:uppercase; transition:background .15s, border-color .15s; }
        .vz-pal button.on { background:var(--accent); border-color:var(--accent); color:var(--paper); }
        .vz-row { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
        .vz-row label { flex:0 0 62px; font-family:var(--mono); font-size:8px;
            letter-spacing:1px; text-transform:uppercase; color:var(--dim); }
        .vz-row input { flex:1; min-width:0; height:2px; -webkit-appearance:none; appearance:none;
            background:var(--line); outline:none; }
        .vz-row input::-webkit-slider-thumb { -webkit-appearance:none; width:8px; height:12px;
            background:var(--accent); cursor:pointer; }
        #vz-reset { width:100%; margin-top:7px; cursor:pointer; padding:5px; background:none;
            border:1px solid var(--line); color:var(--dim);
            font-family:var(--mono); font-size:8px; letter-spacing:1.4px; text-transform:uppercase; }
        #vz-reset:hover { color:var(--ink); border-color:var(--ink); }
        .mode-btn { background:none; border:none; cursor:pointer; padding:2px 0;
            font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:2px;
            text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent;
            transition:color .2s, border-color .2s; }
        .mode-btn:hover { color:var(--ink); }
        .mode-btn.active { color:var(--ink); border-bottom-color:var(--accent); }

        /* ── LOAD CHOREOGRAPHY ───────────────────────── */
        @keyframes wallIn { from{opacity:0; transform:scale(1.02)} to{opacity:1; transform:scale(1)} }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        @keyframes rise { from{opacity:0; transform:translate(-50%,-50%) translateY(10px)} to{opacity:1; transform:translate(-50%,-50%) translateY(0)} }
        #under { animation-name:riseX; }
        @keyframes riseX { from{opacity:0; transform:translateX(-50%) translateY(10px)} to{opacity:1; transform:translateX(-50%) translateY(0)} }
        @keyframes dropIn { from{transform:translateY(-100%)} to{transform:translateY(0)} }
        @keyframes riseIn { from{transform:translateY(100%)} to{transform:translateY(0)} }
        @keyframes pop { from{opacity:0; transform:scale(.2)} to{opacity:1; transform:scale(1)} }
        @media (prefers-reduced-motion: reduce) {
            *, .tick.top, .tick.bottom { animation-duration:.01s !important; animation-delay:0s !important; }
        }

        /* ── MOBILE — photo sits in flow, wall tone continues ── */
        @media (max-width:760px) {
            #wall { position:relative; inset:auto; width:100%; height:auto; object-fit:unset;
                margin-top:64px; }
            .back { top:14px; left:14px; }
            #clock { top:20px; right:16px; letter-spacing:1px; }
            #live { font-size:11px; letter-spacing:4px; }
            .listen { padding:12px 26px; font-size:11px; }
            #modes { bottom:10px; right:12px; }
        }
    </style>
</head>
<body class="offline">

    <div class="tick top"><div class="marquee-wrapper" id="top-marquee"></div></div>

    <main id="stage">
        <canvas id="viz"></canvas>
        <div class="bleed" id="bleed-l"></div>
        <div class="bleed" id="bleed-r"></div>
        <img id="wall" src="IMG_1148.webp" alt="">

        <a class="back" href="/">← Back</a>
        <span id="clock">THURSDAY | 0:00 AM</span>

        <div id="overlay">
            <div class="mark">
                <img id="logo" src="cuceugrta.png" alt="CUCEU">
                <span class="fm-suffix">.fm</span>
            </div>
            <div id="live" class="offair"><i></i><span id="live-text">Checking</span></div>
        </div>

        <div id="under">
            <div class="listen-row">
                <button class="listen" id="play-btn"><span class="pic">▶</span><span id="listen-lab">Listen</span></button>
                <div id="vol" role="slider" aria-label="Volume"></div>
            </div>
            <button class="recent-toggle" id="recent-toggle" aria-expanded="false">Recently played<span class="arrow">▾</span></button>
            <div id="recent-panel"><ul id="history-list"><li class="history-item">Nothing yet</li></ul></div>
        </div>

        <img id="dvd-art" src="" alt="">

        <div id="modes">
            <div class="wall-row">
                <button class="wall-btn" id="wall-btn" aria-pressed="false" aria-label="Live wallpaper" title="Live wallpaper">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="3" y="4" width="18" height="16" rx="1"/>
                        <path id="wall-ico" d="M3 15l4.5-4.5L12 15l3.5-3.5L21 17"/>
                        <circle cx="8.5" cy="8.5" r="1.4"/>
                    </svg>
                </button>
                <button class="viz-gear" id="viz-gear" hidden aria-label="Wallpaper settings" title="Wallpaper settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="3.2"/>
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
                    </svg>
                </button>
            </div>
            <div class="mode-row">
                <button class="mode-btn active" data-mode="clean">Clean</button>
                <button class="mode-btn" data-mode="dvd">DVD</button>
            </div>

            <div id="viz-panel">
                <h4>Wallpaper</h4>
                <div class="vz-pal">
                    <button data-vpal="paper" class="on">Paper</button>
                    <button data-vpal="mono">Mono</button>
                </div>
                <div class="vz-row"><label>Flow</label><input type="range" data-vp="flow" min="0" max="4" step=".01"></div>
                <div class="vz-row"><label>Swirl</label><input type="range" data-vp="swirl" min="0" max="2" step=".01"></div>
                <div class="vz-row"><label>React</label><input type="range" data-vp="react" min="0" max="3" step=".01"></div>
                <div class="vz-row"><label>Smooth</label><input type="range" data-vp="smooth" min="0" max=".95" step=".01"></div>
                <div class="vz-row"><label>Kick</label><input type="range" data-vp="kick" min="0" max="2" step=".01"></div>
                <div class="vz-row"><label>Random</label><input type="range" data-vp="random" min="0" max="1" step=".01"></div>
                <button id="vz-reset">Reset</button>
            </div>
        </div>
    </main>

    <div class="tick bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>
    <audio id="radioPlayer" preload="none" crossorigin="anonymous"></audio>
    <script src="viz.js"></script>

<script>
'use strict';

/* ── tiny store (page is standalone — no shared.js) ─────────── */
const Store = {
    get(k, fb = null) { try { const r = localStorage.getItem(k); return r === null ? fb : JSON.parse(r); } catch { return fb; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ── clock — "THURSDAY | 2:11 PM" ───────────────────────────── */
(function clock() {
    const DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
    const el = document.getElementById('clock');
    function tick() {
        const n = new Date();
        let h = n.getHours() % 12; if (h === 0) h = 12;
        const t = `${h}:${String(n.getMinutes()).padStart(2,'0')} ${n.getHours() < 12 ? 'AM' : 'PM'}`;
        el.textContent = window.innerWidth < 760 ? t : `${DAYS[n.getDay()]} | ${t}`;
    }
    tick(); setInterval(tick, 1000);
})();

/* ── WINDOW GEOMETRY ────────────────────────────────────────── */
/* The shutter window's position inside IMG_1148.webp, as fractions of the
   image. Everything (logo, live, listen) anchors to these — recomputed on
   every load/resize/bfcache-restore, so nothing can drift off-centre. */
const WIN = { x: 0.216, y: 0.203, w: 0.588, h: 0.329 };
let vizOn = false;      // hoisted: layout() reads this before the wallpaper block runs
const stage = document.getElementById('stage');
const wall = document.getElementById('wall');
const bleedL = document.getElementById('bleed-l');
const bleedR = document.getElementById('bleed-r');
const SLICE = 0.06;   // how much of the shot's width is taken as the edge strip

/* Stretch the shot's edge strip across a `gap`-wide band beside it. The
   background is blown up horizontally so that SLICE of the image spans the
   gap, and anchored to that edge; vertical scale/offset match the shot
   exactly, so nothing shifts across the seam. */
function setBleed(el, side, gap, wt, wh, wr, stH) {
    if (gap <= 0.5) { el.style.display = 'none'; return; }
    const left = side === 'left';
    el.style.display = 'block';
    el.style.left = left ? '0px' : wr + 'px';
    el.style.width = gap + 'px';
    el.style.top = '0px';
    el.style.height = stH + 'px';
    el.style.backgroundSize = `${gap / SLICE}px ${wh}px`;
    el.style.backgroundPosition = `${left ? '0%' : '100%'} ${wt}px`;
}
function hideBleeds() { bleedL.style.display = bleedR.style.display = 'none'; }

/* On-screen aspect of the shutter window inside the shot. */
const WIN_ASPECT = (WIN.w * 4032) / (WIN.h * 3695);

function layout() {
    const st = stage.getBoundingClientRect();
    let x, y, w, h;
    if (vizOn) {
        // no photo to measure — lay out a window of matching proportions so the
        // logo, badge and controls sit exactly where they do in clean mode
        hideBleeds();
        const RESERVE = 256;
        w = Math.max(240, Math.min(st.width * 0.66, 680));
        h = w / WIN_ASPECT;
        if (h > st.height - RESERVE) {
            h = Math.max(90, st.height - RESERVE);
            w = h * WIN_ASPECT;
        }
        x = (st.width - w) / 2;
        y = Math.max(12, Math.min(st.height * 0.38 - h / 2,
                                  st.height - h - (RESERVE - 26)));
    } else if (window.innerWidth < 760) {
        wall.style.left = wall.style.top = wall.style.width = wall.style.height = '';
        hideBleeds();
        const r = wall.getBoundingClientRect();
        x = (r.left - st.left) + WIN.x * r.width;
        y = (r.top - st.top) + WIN.y * r.height;
        w = WIN.w * r.width;
        h = WIN.h * r.height;
    } else {
        const nw = wall.naturalWidth || 4032, nh = wall.naturalHeight || 3695;
        // start at cover scale, then shrink until the window leaves room below
        // for the controls + dropdown (short viewports); never below the scale
        // that still covers the stage vertically
        const RESERVE = 256;                       // gap + listen/toggle + min dropdown
        let s = Math.max(st.width / nw, st.height / nh);
        const maxWinH = st.height - RESERVE;
        if (WIN.h * nh * s > maxWinH) s = Math.max(maxWinH / (WIN.h * nh), st.height / nh);
        const ox = (st.width - nw * s) / 2;
        // bias vertically so the window centre lands at ~38% of the stage…
        const winCy = (WIN.y + WIN.h / 2) * nh * s;
        let oy = st.height * 0.38 - winCy;
        oy = Math.min(0, Math.max(st.height - nh * s, oy));
        // …but never so low that the dropdown loses its room — slide up if needed
        const winTop = oy + WIN.y * nh * s;
        const winTopMax = st.height - WIN.h * nh * s - (RESERVE - 26);
        if (winTop > winTopMax) oy -= winTop - Math.max(12, winTopMax);
        // …and never so far that the shot lifts off the bottom of the stage —
        // a blank band reads as broken, while --recent-max below just adapts
        oy = Math.max(st.height - nh * s, Math.min(0, oy));
        wall.style.left = ox + 'px';
        wall.style.top = oy + 'px';
        wall.style.width = nw * s + 'px';
        wall.style.height = nh * s + 'px';
        setBleed(bleedL, 'left',  ox, oy, nh * s, ox + nw * s, st.height);
        setBleed(bleedR, 'right', st.width - (ox + nw * s), oy, nh * s, ox + nw * s, st.height);
        x = ox + WIN.x * nw * s;
        y = oy + WIN.y * nh * s;
        w = WIN.w * nw * s;
        h = WIN.h * nh * s;
    }
    const cs = stage.style;
    cs.setProperty('--win-x', x + 'px');
    cs.setProperty('--win-y', y + 'px');
    cs.setProperty('--win-w', w + 'px');
    cs.setProperty('--win-h', h + 'px');
    // room left under the controls before the bottom ticker — caps the dropdown
    const gap = Math.min(46, Math.max(20, window.innerHeight * 0.042));
    const recentMax = Math.max(70, st.height - (y + h + gap) - 100 - 10);
    cs.setProperty('--recent-max', recentMax + 'px');
}
if (wall.complete) layout(); else wall.addEventListener('load', layout);
window.addEventListener('resize', layout);
window.addEventListener('pageshow', () => { layout(); });  // bfcache restore — kills the off-centre bug
new ResizeObserver(layout).observe(stage);

/* ── STREAM ─────────────────────────────────────────────────── */
const STREAM_BASE = "https://stream.cuceu.co.uk";
const player = document.getElementById('radioPlayer');
const liveEl = document.getElementById('live');
const liveText = document.getElementById('live-text');
const playBtn = document.getElementById('play-btn');
const listenLab = document.getElementById('listen-lab');
const topMarquee = document.getElementById('top-marquee');
const bottomMarquee = document.getElementById('bottom-marquee');
const historyList = document.getElementById('history-list');
let playing = false, isOnline = false, currentTitle = '', currentArtUrl = '', currentTickerBase = '';
let booting = true;
setTimeout(() => { booting = false; }, 2000);

function setLive(state) {   // 'live' | 'buffering' | 'offair'
    liveEl.className = state === 'live' ? '' : state;
    liveText.textContent = state === 'live' ? 'Live' : state === 'buffering' ? 'Buffering' : 'Off air';
}

function renderPlayState() {
    playBtn.querySelector('.pic').textContent = playing ? '❚❚' : '▶';
    listenLab.textContent = playing ? 'Pause' : 'Listen';
    document.body.classList.toggle('playing', playing);
}

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function updateTicker(base) {
    const delay = booting ? '1.35s' : '.05s';
    const art = currentArtUrl
        ? `<img class="ticker-art" src="${currentArtUrl}" style="animation-delay:${delay}" alt="">`
        : `<span style="display:inline-block;width:12px"></span>`;
    const item = `<div class="ticker-item"><span class="song-display">${esc(base)}</span>${art}</div>`;
    const content = Array(14).fill(item).join('');
    const dur = Math.max(24, base.length * 1.5);
    for (const m of [topMarquee, bottomMarquee]) {
        m.innerHTML = content + content;
        m.style.animation = `tickerScroll ${dur}s linear infinite, trackRoll .6s ease`;
    }
    bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s, 0s`;
    setTimeout(() => {
        topMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s`;
    }, 700);
}

async function fetchGlobalHistory() {
    try {
        const d = await fetch(`${STREAM_BASE}/history.json?t=` + Date.now()).then(r => r.json());
        if (Array.isArray(d) && d.length) {
            historyList.innerHTML = d.filter(Boolean).map((t, i) =>
                `<li class="history-item"><span class="history-num">${String(i + 1).padStart(2, '0')}</span>${esc(t)}</li>`).join('');
        }
    } catch (_) {}
}

async function fetchArtwork() {
    try {
        const u = (await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now()).then(r => r.text())).trim();
        currentArtUrl = (u && u.startsWith('http')) ? u : '';
    } catch (_) { currentArtUrl = ''; }
    if (currentMode === 'dvd') dvdArt.src = currentArtUrl || 'cuceugrta.png';
}

async function fetchSongData() {
    try {
        const data = await fetch(`${STREAM_BASE}/status-json.xsl?t=` + Date.now()).then(r => r.json());
        const s = data.icestats.source; if (!s) throw new Error();
        isOnline = true;
        document.body.classList.remove('offline');
        if (!playing) setLive('live');
        const t = Array.isArray(s) ? (s[0].title || 'ON AIR') : (s.title || 'ON AIR');
        if (t !== currentTitle) {
            currentTitle = t;
            fetchGlobalHistory();
            await fetchArtwork();
            currentTickerBase = `NOW PLAYING: ${t}`;
            updateTicker(currentTickerBase);
        }
    } catch (_) {
        isOnline = false;
        document.body.classList.add('offline');
        if (!playing) {
            setLive('offair');
            if (currentTickerBase !== 'CUCEU.FM — STANDBY') {
                currentTickerBase = 'CUCEU.FM — STANDBY';
                updateTicker(currentTickerBase);
            }
        }
    }
}

player.onwaiting = () => { if (playing) setLive('buffering'); };
player.onplaying = () => { if (playing) setLive('live'); };
player.onpause   = () => { setLive(isOnline ? 'live' : 'offair'); };

function togglePlay() {
    if (!playing && !isOnline) return;
    if (!playing) {
        // must happen inside the gesture, and only ever once per element
        if (vizReady) CuceuViz.attachAudio(player);
        player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`;
        player.play().catch(() => {});
        setLive('buffering');
    } else {
        player.pause(); player.src = '';
        setLive(isOnline ? 'live' : 'offair');
    }
    playing = !playing;
    if (vizReady) CuceuViz.setSource(playing ? 'live' : 'idle');
    renderPlayState();
}
playBtn.addEventListener('click', togglePlay);

/* ── VOLUME — tucked beside listen, only while playing ──────── */
const VOL_SEGMENTS = 12;
const volMeter = document.getElementById('vol');
player.volume = Math.min(1, Math.max(0, Store.get('cuceu-volume', 0.5)));
for (let i = 0; i < VOL_SEGMENTS; i++) volMeter.appendChild(document.createElement('i'));
function renderVol() {
    const filled = Math.round(player.volume * VOL_SEGMENTS);
    [...volMeter.children].forEach((s, i) => s.classList.toggle('on', i < filled));
}
volMeter.addEventListener('click', (e) => {
    const rect = volMeter.getBoundingClientRect();
    const v = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    player.volume = v; Store.set('cuceu-volume', v); renderVol();
});
renderVol();

/* ── RECENTLY PLAYED ────────────────────────────────────────── */
const recentToggle = document.getElementById('recent-toggle');
recentToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = document.body.classList.toggle('recent-open');
    recentToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => {
    if (document.body.classList.contains('recent-open') &&
        !e.target.closest('#recent-panel') && !e.target.closest('#recent-toggle')) {
        document.body.classList.remove('recent-open');
    }
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.body.classList.remove('recent-open');
});

/* ── LIVE WALLPAPER ─────────────────────────────────────────────
   Orthogonal to clean/dvd: it swaps what the wall *is*, so DVD can still
   bounce artwork over a running visualiser. */
const vizCanvas = document.getElementById('viz');
const wallBtn   = document.getElementById('wall-btn');
const vizGear   = document.getElementById('viz-gear');
const vizPanel  = document.getElementById('viz-panel');
const wallIco   = document.getElementById('wall-ico');
const VIZ_OK    = !!(window.CuceuViz && CuceuViz.supported());
vizOn = VIZ_OK && Store.get('cuceu-fm-viz', false);
let vizReady = false;

if (!VIZ_OK) { wallBtn.hidden = true; vizOn = false; }

function vizTheme() { return document.body.classList.contains('dark-mode') ? 'night' : 'day'; }

function applyViz(on, persist) {
    vizOn = on && VIZ_OK;
    document.body.classList.toggle('viz-on', vizOn);
    wallBtn.setAttribute('aria-pressed', vizOn ? 'true' : 'false');
    vizGear.hidden = !vizOn;
    // the icon gains motion lines once the wall is alive
    wallIco.setAttribute('d', vizOn ? 'M3 16c3-5 5.5 2 8.5-2.5S17 9 21 13' : 'M3 15l4.5-4.5L12 15l3.5-3.5L21 17');
    if (!vizOn) { document.body.classList.remove('viz-open'); if (vizReady) CuceuViz.stop(); }
    else {
        if (!vizReady) vizReady = CuceuViz.init(vizCanvas);
        if (vizReady) {
            CuceuViz.setPalette(Store.get('cuceu-fm-viz-pal', 'paper'), vizTheme());
            CuceuViz.setParams(Store.get('cuceu-fm-viz-params', {}));
            CuceuViz.setSource(playing ? 'live' : 'idle');
            CuceuViz.start();
            syncVizInputs();   // engine only exists now — sliders were at range midpoints
        } else { wallBtn.hidden = true; vizOn = false; document.body.classList.remove('viz-on'); }
    }
    if (persist) Store.set('cuceu-fm-viz', vizOn);
    layout();
}
wallBtn.addEventListener('click', () => applyViz(!vizOn, true));
vizGear.addEventListener('click', e => { e.stopPropagation(); document.body.classList.toggle('viz-open'); });
document.addEventListener('click', e => {
    if (document.body.classList.contains('viz-open') &&
        !e.target.closest('#viz-panel') && !e.target.closest('#viz-gear')) {
        document.body.classList.remove('viz-open');
    }
});

/* user knobs — the full set stays in the lab */
const vzInputs = [...document.querySelectorAll('[data-vp]')];
function syncVizInputs() {
    const p = vizReady ? CuceuViz.params() : {};
    const saved = Store.get('cuceu-fm-viz-params', {});
    vzInputs.forEach(i => {
        const k = i.dataset.vp;
        const v = (k in saved) ? saved[k] : p[k];
        if (v !== undefined) i.value = v;
    });
}
vzInputs.forEach(i => i.addEventListener('input', () => {
    const k = i.dataset.vp, v = +i.value;
    if (vizReady) CuceuViz.setParams({ [k]: v });
    const saved = Store.get('cuceu-fm-viz-params', {});
    saved[k] = v; Store.set('cuceu-fm-viz-params', saved);
}));
document.querySelectorAll('[data-vpal]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-vpal]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    Store.set('cuceu-fm-viz-pal', b.dataset.vpal);
    if (vizReady) CuceuViz.setPalette(b.dataset.vpal, vizTheme());
}));
document.getElementById('vz-reset').addEventListener('click', () => {
    Store.set('cuceu-fm-viz-params', {});
    if (vizReady) { CuceuViz.setParams(CuceuViz.defaults()); syncVizInputs(); }
});

/* ── MODES — clean / dvd ────────────────────────────────────── */
const dvdArt = document.getElementById('dvd-art');
const modeBtns = document.querySelectorAll('.mode-btn');
let currentMode = 'clean';
let dvdAnimId = null, bx = 0, by = 0, vx = 0, vy = 0, lastT = 0;

function setMode(mode) {
    if (mode === currentMode) return;
    currentMode = mode;
    document.body.dataset.activeMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    Store.set('cuceu-fm-mode', mode);
    if (mode === 'dvd') startBounce(); else stopBounce();
}
modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

function startBounce() {
    dvdArt.src = currentArtUrl || 'cuceugrta.png';
    dvdArt.classList.toggle('fallback', !currentArtUrl);
    const st = stage.getBoundingClientRect();
    bx = st.width / 2 - dvdArt.offsetWidth / 2;
    by = st.height / 2 - dvdArt.offsetHeight / 2;
    const speed = (window.innerWidth < 600 ? 110 : 155) / Math.SQRT2;
    vx = (Math.random() < .5 ? -1 : 1) * speed;
    vy = (Math.random() < .5 ? -1 : 1) * speed;
    lastT = performance.now();
    cancelAnimationFrame(dvdAnimId);
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function dvdFrame(now) {
    if (currentMode !== 'dvd') return;
    const dt = Math.min((now - lastT) / 1000, .05); lastT = now;
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const aw = dvdArt.offsetWidth, ah = dvdArt.offsetHeight;
    bx += vx * dt; by += vy * dt;
    if (bx <= 0)       { bx = 0;       vx =  Math.abs(vx); }
    if (bx + aw >= sw) { bx = sw - aw; vx = -Math.abs(vx); }
    if (by <= 0)       { by = 0;       vy =  Math.abs(vy); }
    if (by + ah >= sh) { by = sh - ah; vy = -Math.abs(vy); }
    dvdArt.style.transform = `translate(${bx}px, ${by}px)`;
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function stopBounce() { cancelAnimationFrame(dvdAnimId); dvdAnimId = null; }

/* ── POLLING ────────────────────────────────────────────────── */
updateTicker('CUCEU.FM — STANDBY');
currentTickerBase = 'CUCEU.FM — STANDBY';
fetchSongData(); fetchGlobalHistory();
let fetchInterval = setInterval(fetchSongData, 4000);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        fetchSongData();
        clearInterval(fetchInterval);
        fetchInterval = setInterval(fetchSongData, 4000);
        if (currentMode === 'dvd') { lastT = performance.now(); dvdAnimId = requestAnimationFrame(dvdFrame); }
    } else {
        clearInterval(fetchInterval);
        cancelAnimationFrame(dvdAnimId);
    }
});

/* restore last mode (aurora retired → clean) */
const savedMode = Store.get('cuceu-fm-mode', 'clean');
if (savedMode === 'dvd') setMode('dvd');

/* ── boot the wallpaper from storage ── */
(function initViz() {
    if (!VIZ_OK) return;
    const savedPal = Store.get('cuceu-fm-viz-pal', 'paper');
    document.querySelectorAll('[data-vpal]').forEach(b =>
        b.classList.toggle('on', b.dataset.vpal === savedPal));
    applyViz(vizOn, false);
    syncVizInputs();
})();
renderPlayState();
setLive('offair'); liveText.textContent = 'Checking';
</script>
</body>
</html>
