<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c.fm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22>C</text></svg>">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        /* Bouncing art stays behind at 90% opacity */
        #bouncing-container { position: absolute; width: 180px; height: 180px; z-index: 1; top: 0; left: 0; will-change: transform; }
        @media (min-width: 768px) { #bouncing-container { width: 320px; height: 320px; } }
        .art-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .art-layer.active { opacity: 0.9; }

        #app-wrapper { width: 100%; height: 100%; position: relative; z-index: 10; animation: continuityGlide 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; pointer-events: none; }
        .main-container, .status-area { pointer-events: auto; }

        @keyframes continuityGlide { 0% { opacity: 0; transform: translateY(-5vh); } 100% { opacity: 1; transform: translateY(0); } }

        .status-area { position: absolute; top: 75px; right: 30px; display: flex; align-items: center; font-size: 16px; font-weight: 800; text-transform: uppercase; color: #000; }
        .ticker-tape { position: absolute; width: 100%; background: #000; color: #fff; overflow: hidden; padding: 12px 0; border-top: 4px solid #000; border-bottom: 4px solid #000; display: flex; z-index: 20; }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        .marquee-wrapper { display: flex; white-space: nowrap; animation: marquee linear infinite; width: fit-content; }
        .song-display { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; padding-right: 80px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        
        .main-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        /* --- THE LOGO: Massively Bold & Tight --- */
        .logo-container { margin-bottom: 20px; user-select: none; }
        
        h1 { 
            font-size: clamp(6rem, 24vw, 30rem); 
            font-weight: 950; 
            text-transform: uppercase; 
            letter-spacing: -12px; 
            margin: 0; 
            color: #000; 
            line-height: 0.8; 
            display: inline-block;
        }

        .fm-text { 
            font-size: 0.3em; /* Smaller but attached to the main name */
            font-weight: 400; 
            text-transform: lowercase; 
            letter-spacing: -2px; 
            margin-left: -15px; /* Pulls it closer so it looks like part of the name */
        }
        
        .live-status { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; margin-bottom: 30px; display: inline-flex; align-items: center; gap: 10px; }
        .pulse-dot { height: 10px; width: 10px; background-color: #777; border-radius: 50%; }
        .pulse-dot.live { background-color: #34c759; }
        .pulse-dot.on-air { background-color: #ff3b30; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { transform: scale(0.9); opacity: 0.7; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }
        
        #btn { background-color: #000; color: #fff; border: 4px solid #000; padding: 20px 45px; font-size: 1.2rem; text-transform: uppercase; font-weight: 800; letter-spacing: 3px; cursor: pointer; box-shadow: 8px 8px 0 #d3d3d3; transition: all 0.2s ease; margin-bottom: 30px; }
        #btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #d3d3d3; }

        .history-wrapper { width: 100%; max-width: 360px; }
        #history-toggle { background: none; border: none; color: #000; font-size: 0.9rem; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; }
        #history-list { width: 100%; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); margin: 10px 0 0 0; list-style: none; padding: 0; max-height: 0; opacity: 0; overflow: hidden; border-radius: 12px; transition: all 0.5s ease; }
        #history-list.open { max-height: 300px; opacity: 1; padding: 12px; border: 1px solid rgba(0,0,0,0.05); }
        .history-item { padding: 12px; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,0.03); }

        @media (max-width: 600px) { h1 { font-size: 5rem; letter-spacing: -4px; } .fm-text { margin-left: -5px; } }
    </style>
</head>
