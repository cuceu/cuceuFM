<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* PLAIN WHITE BRUTALIST BACKGROUND */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        #app-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            animation: continuityGlide 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes continuityGlide {
            0% { opacity: 0; transform: translateY(-5vh); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        /* --- FLOATING STATUS AREA --- */
        .status-area {
            position: absolute;
            top: 75px; 
            right: 30px;
            display: flex;
            align-items: center;
            font-size: 16px; 
            font-weight: 800; 
            text-transform: uppercase;
            color: #000000;
            z-index: 100;
            letter-spacing: 1px;
        }

        /* --- SEAMLESS INFINITE TICKER TAPE --- */
        .ticker-tape {
            position: absolute;
            width: 100%;
            background: #000;
            color: #ffffff;
            overflow: hidden;
            padding: 12px 0;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            z-index: 10;
            box-sizing: border-box;
            display: flex;
        }

        .ticker-top { top: 0; }
        .ticker-bottom { bottom: 0; }

        .marquee-wrapper {
            display: flex;
            white-space: nowrap;
            animation: marquee 60s linear infinite;
            width: fit-content;
        }

        .song-display {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding-right: 20px; 
            transition: opacity 0.75s ease-in-out; 
            opacity: 1;
        }

        .song-display.fade-out {
            opacity: 0;
        }

        /* Mobile specific ticker size */
        @media (max-width: 600px) {
            .song-display {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
            .status-area {
                top: 65px;
                right: 15px;
                font-size: 12px;
            }
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- MAIN BRUTALIST UI --- */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(4rem, 16vw, 18rem); 
            white-space: nowrap; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px; 
            margin: 0;
            color: #000; 
            -webkit-text-stroke: 4px #000; 
        }

        .fm-text {
            font-size: 0.5em; 
            text-transform: lowercase;
            letter-spacing: -2px;
            -webkit-text-stroke: 0px; 
        }

        .live-status {
            font-size: clamp(1rem, 3vw, 1.5rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            margin-top: 15px;
            margin-bottom: 40px;
            color: #000; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 90%;
            white-space: nowrap;
        }

        .pulse-dot {
            height: 12px;
            width: 12px;
            background-color: #777; /* Offline Grey */
            border-radius: 50%;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        /* LIVE state (Signal found, not listening) */
        .pulse-dot.live {
            background-color: #34c759; /* Green */
        }

        /* ON AIR state (Actually playing) */
        .pulse-dot.on-air {
            background-color: #ff3b30; /* Red */
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        button {
            background-color: #000; 
            color: #fff; 
            border: 4px solid #000; 
            padding: 20px 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 8px 8px 0 #d3d3d3; 
            transition: all 0.2s ease;
        }
        button:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0 #d3d3d3; }
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0 #d3d3d3; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="ticker-tape ticker-top">
            <div class="marquee-wrapper">
                <span class="song-display"></span>
                <span class="song-display"></span>
            </div>
        </div>

        <div class="status-area">
            <span id="mac-clock">Sat 12:40 AM</span>
        </div>

        <div class="main-container">
            <h1>CUCEU<span class="fm-text">.fm</span></h1>
            
            <div class="live-status">
                <div class="pulse-dot" id="pulse-indicator"></div> <span id="center-status">CHECKING...</span>
            </div>
            <button id="btn">▶ Listen</button>
        </div>

        <div class="ticker-tape ticker-bottom">
            <div class="marquee-wrapper">
                <span class="song-display"></span>
                <span class="song-display"></span>
            </div>
        </div>
    </div>

    <audio id="radioPlayer" src="https://stream.cuceu.co.uk/stream.mp3" preload="none"></audio>

    <script>
        // --- Clock Script ---
        function updateClock() {
            const now = new Date();
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            let hours = now.getHours() % 12 || 12; 
            let minutes = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
            document.getElementById('mac-clock').innerText = `${days[now.getDay()]} ${hours}:${minutes} ${ampm}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // --- DOM Elements & Variables ---
        const btn = document.getElementById("btn");
        const player = document.getElementById("radioPlayer");
        const centerStatus = document.getElementById("center-status");
        const pulseIndicator = document.getElementById("pulse-indicator");
        const tapes = document.querySelectorAll('.song-display');
        
        let playing = false;
        let isOnline = false;
        let currentTrackText = "";
        let errorCount = 0;
        let fetchInterval = null; 

        // --- Speed-Locked & Cinematic Ticker Engine ---
        function updateTicker(baseString, instant = false) {
            // Removed "+++" crosses from the strings
            const newText = Array(15).fill(baseString + " ").join('');
            
            if (currentTrackText !== newText) {
                if (instant) {
                    tapes.forEach(el => el.innerText = newText);
                    currentTrackText = newText;
                    const perfectSpeed = newText.length * 0.333;
                    document.querySelectorAll('.marquee-wrapper').forEach(wrapper => {
                        wrapper.style.animationDuration = `${perfectSpeed}s`;
                    });
                    return;
                }

                tapes.forEach(el => el.classList.add('fade-out'));
                
                setTimeout(() => {
                    tapes.forEach(el => el.innerText = newText);
                    currentTrackText = newText;
                    const perfectSpeed = newText.length * 0.333;
                    document.querySelectorAll('.marquee-wrapper').forEach(wrapper => {
                        wrapper.style.animationDuration = `${perfectSpeed}s`;
                    });
                    tapes.forEach(el => el.classList.remove('fade-out'));
                }, 750); 
            }
        }
        
        // --- Instant Handshake Logic ---
        const cachedStatus = sessionStorage.getItem('cuceu_fm_status');
        const cachedTitle = sessionStorage.getItem('cuceu_fm_title');

        if (cachedStatus === 'online') {
            isOnline = true;
            centerStatus.innerText = "LIVE";
            pulseIndicator.className = "pulse-dot live"; // Set to Green
            updateTicker(`NOW PLAYING: ${cachedTitle || "ON AIR"}`, true);
        } else {
            centerStatus.innerText = "OFFLINE";
            pulseIndicator.className = "pulse-dot"; // Grey
            updateTicker("STANDBY", true);
        }

        // --- AUDIO SYNC EVENTS ---
        player.addEventListener('playing', () => {
            if (playing) {
                centerStatus.innerText = "ON AIR";
                pulseIndicator.className = "pulse-dot on-air"; // Pulsing Red
            }
        });

        player.addEventListener('waiting', () => {
            if (playing) {
                centerStatus.innerText = "BUFFERING...";
            }
        });

        // --- Play/Pause Logic ---
        btn.onclick = () => {
            if (!playing) {
                player.src = "https://stream.cuceu.co.uk/stream.mp3";
                player.play();
                btn.innerText = "⏸ Disconnect";
                centerStatus.innerText = "CONNECTING..."; 
                updateTicker("Retrieving song information...");
                
                fetchSongData();
                fetchInterval = setInterval(fetchSongData, 12000); 

            } else {
                player.pause();
                player.src = ""; 
                btn.innerText = "▶ Listen";
                centerStatus.innerText = isOnline ? "LIVE" : "OFFLINE"; 
                pulseIndicator.className = isOnline ? "pulse-dot live" : "pulse-dot";
                
                clearInterval(fetchInterval);
                updateTicker("STANDBY");
            }
            playing = !playing;
        };

        // --- TRIPLE-CASCADE METADATA ENGINE ---
        function processData(data) {
            let source = data.icestats ? data.icestats.source : null;
            if (!source) return; 
            
            errorCount = 0;
            isOnline = true;
            if (!playing) {
                centerStatus.innerText = "LIVE";
                pulseIndicator.className = "pulse-dot live";
            }
            let title = Array.isArray(source) ? (source[0].title || "ON AIR") : (source.title || "ON AIR");
            updateTicker(`NOW PLAYING: ${title}`);
        }

        function handleFetchError() {
            errorCount++;
            if (errorCount >= 3) {
                isOnline = false;
                if (!playing) {
                    centerStatus.innerText = "OFFLINE";
                    pulseIndicator.className = "pulse-dot";
                }
                updateTicker("STANDBY");
            }
        }

        function fetchSongData() {
            const targetUrl = "https://stream.cuceu.co.uk/status-json.xsl?nocache=" + new Date().getTime();
            
            fetch(targetUrl, { cache: "no-store" })
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.json();
                })
                .then(processData)
                .catch(() => {
                    const proxyUrl1 = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl);
                    fetch(proxyUrl1, { cache: "no-store" })
                        .then(res => res.json())
                        .then(processData)
                        .catch(() => {
                            const proxyUrl2 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
                            fetch(proxyUrl2, { cache: "no-store" })
                                .then(res => res.json())
                                .then(processData)
                                .catch(handleFetchError);
                        });
                });
        }

        // Keep the background check running every 15s to keep the signal status fresh
        setInterval(fetchSongData, 15000);
    </script>
</body>
</html>
