<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <style>
        html, body { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; 
        }

        /* ── THE BACKGROUND CONTAINER ────────────────────────────────────────── */
        #app-container {
            width: 100vw; height: 100dvh; 
            display: flex; flex-direction: column;
            background-color: #ffffff;
            position: relative; overflow: hidden;
            transform-origin: center center;
            animation: bgExpand 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        body.is-exiting #app-container { animation: bgShrink 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.4s forwards; }

        @keyframes bgExpand { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bgShrink { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0; filter: blur(5px); } }

        /* ── TOP NAV BAR (Standardized) ──────────────────────────────────────── */
        .top-nav-bar {
            position: absolute; top: 30px; left: 30px; right: 30px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        .back-btn-top {
            color: #000; text-decoration: none; font-weight: 800; 
            text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
            border: 2px solid #000; padding: 6px 14px; background: #fff;
            transition: all 0.2s ease;
        }
        .back-btn-top:hover { background-color: #000; color: #fff; }

        .date-time-display {
            font-size: clamp(11px, 1.3vw, 15px); font-weight: 900;
            text-transform: uppercase; letter-spacing: 1.5px; color: #000;
        }

        /* ── MARQUEE TICKER TAPE (CSS Looping) ───────────────────────────────── */
        .ticker-tape { 
            position: absolute; width: 100%; background: #000; color: #fff; overflow: hidden; 
            height: 52px; /* Increased size */
            display: flex; align-items: center; z-index: 60; 
            border-top: 3px solid #000; border-bottom: 3px solid #000;
        }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        
        .marquee-wrapper { 
            display: flex; white-space: nowrap; align-items: center; 
            will-change: transform;
        }
        
        .ticker-top .marquee-wrapper { animation: scrollMarquee 15s linear infinite; }
        .ticker-bottom .marquee-wrapper { animation: scrollMarquee 15s linear infinite reverse; animation-delay: -7.5s; } /* Out of sync offset */

        .ticker-item { display: inline-flex; align-items: center; margin-right: 30px; }
        .ticker-art { height: 26px; width: 26px; margin: 0 15px; object-fit: cover; display: none; border-radius: 0; border: 1.5px solid #fff; }
        .ticker-art.has-art { display: block; }
        
        .song-display { 
            font-size: 1.3rem; line-height: 1;
            font-weight: 900; text-transform: uppercase; letter-spacing: 2px; 
            display: inline-block; transform: translateY(1px); 
        }
        
        @keyframes scrollMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .ticker-top { transform: translateY(-100%); animation: slideTopIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.6s forwards; }
        .ticker-bottom { transform: translateY(100%); animation: slideBottomIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.6s forwards; }
        body.is-exiting .ticker-top { animation: slideTopOut 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards; }
        body.is-exiting .ticker-bottom { animation: slideBottomOut 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards; }

        @keyframes slideTopIn { to { transform: translateY(0); } } @keyframes slideBottomIn { to { transform: translateY(0); } }
        @keyframes slideTopOut { to { transform: translateY(-100%); } } @keyframes slideBottomOut { to { transform: translateY(100%); } }

        /* ── WINDOW CONCEPT & CENTER LAYOUT ──────────────────────────────────── */
        #center-block {
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            width: 100%; flex: 1; z-index: 20; padding: 20px; box-sizing: border-box;
            opacity: 0; animation: contentJumpUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }
        body.is-exiting #center-block { animation: contentJumpDown 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0s forwards; }
        
        @keyframes contentJumpUp { 0% { opacity: 0; transform: translateY(40px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes contentJumpDown { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(40px) scale(0.95); } }

        #window-container {
            width: 100%; max-width: 700px; aspect-ratio: 16 / 7;
            background-image: url('./IMG_1148.webp'); background-size: cover; background-position: center;
            border: 3px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 25px; position: relative;
        }

        .logo-wrapper-img { display: flex; align-items: flex-end; justify-content: center; gap: 0; z-index: 2;}
        .cuceu-logo-img { height: clamp(3.5rem, 12vw, 6.5rem); width: auto; user-select: none; -webkit-user-drag: none; }
        .fm-text { 
            font-size: clamp(1.3rem, 4vw, 2.2rem); 
            font-weight: 900; letter-spacing: -2px; 
            padding-bottom: 0.3rem; margin-left: -5px; 
            color: #000;
        }
        
        .live-status { 
            font-size: 1.3rem; text-transform: uppercase; letter-spacing: 4px; font-weight: 900; 
            margin-bottom: 5px; display: inline-flex; align-items: center; gap: 10px; color: #000;
            z-index: 2; text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        
        .pulse-dot { height: 12px; width: 12px; background-color: #777; border-radius: 50%; }
        .pulse-dot.live { background-color: #34c759; box-shadow: 0 0 10px #34c759; }
        .pulse-dot.buffering { background-color: #ffcc00; box-shadow: 0 0 12px #ffcc00; animation: pulse-yellow 1s infinite; }
        .pulse-dot.on-air { background-color: #ff3b30; box-shadow: 0 0 12px #ff3b30; animation: pulse-red 1.2s infinite; }
        
        @keyframes pulse-yellow { 0%, 100% { transform: scale(0.85); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } }
        @keyframes pulse-red { 0%, 100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } }

        /* ── BUTTON & HISTORY AREA ───────────────────────────────────────────── */
        #btn { 
            background-color: #000; color: #fff; border: 2px solid #000;
            width: 180px; height: 56px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.1rem; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; 
            cursor: pointer; transition: all 0.2s ease; margin-bottom: 25px; padding: 0;
        }
        #btn:hover { background-color: #333; }
        #btn:active { transform: scale(0.96); }

        .history-wrapper { display: flex; flex-direction: column; width: 320px; position: relative; }
        #history-toggle { 
            background: none; border: none; padding: 5px; color: #000; font-size: 0.9rem; 
            font-weight: 900; text-transform: uppercase; cursor: pointer; margin: 0 auto; letter-spacing: 1px;
        }
        
        #history-list { 
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: 100%;
            list-style: none; padding: 0; margin-top: 15px; border-radius: 0;
            max-height: 0; opacity: 0; overflow: hidden; box-sizing: border-box; 
            transform-origin: top center; background: #fff;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, padding 0.4s ease; 
            z-index: 50; text-align: center;
        }
        #history-list.open { 
            max-height: 250px; opacity: 1; padding: 10px 0; overflow-y: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid #000;
        }
        
        /* Overhauled Clean List Items */
        .history-item { 
            padding: 8px 10px; font-size: 0.8rem; font-weight: 800; 
            text-transform: uppercase; border-bottom: none; 
            color: #333; opacity: 0.85; transition: opacity 0.2s;
        }
        .history-item:hover { opacity: 1; color: #000; }

        /* ── MOBILE LAYOUT OPTIMIZATIONS ─────────────────────────────────────── */
        @media (max-width: 600px) {
            .top-nav-bar { top: 20px; left: 20px; right: 20px; }
            .back-btn-top { padding: 5px 10px; font-size: 11px; }
            .date-time-display { font-size: 11px; letter-spacing: 0.8px; }
            .live-status { font-size: 1.1rem; letter-spacing: 2px; }
            
            #window-container { width: 95%; aspect-ratio: 16/10; margin-bottom: 20px; }
            .ticker-tape { height: 42px; }
            .ticker-art { height: 20px; width: 20px; margin: 0 10px; }
            .song-display { font-size: 1rem; letter-spacing: 1px; }
            
            #btn { width: 160px; height: 50px; font-size: 1rem; }
            .history-wrapper { width: min(85vw, 290px); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="ticker-tape ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>
        
        <div class="top-nav-bar">
            <a href="/" class="back-btn-top internal-link">← BACK</a>
            <div class="date-time-display">
                <span id="live-single-line">MONDAY | 12:00 AM</span>
            </div>
        </div>
        
        <div id="center-block">
            <div id="window-container">
                <div class="live-status">
                    <div class="pulse-dot" id="pulse-indicator"></div> 
                    <span id="center-status">CHECKING...</span>
                </div>
                <div class="logo-wrapper-img">
                    <img src="cuceugrta.png" alt="CUCEU" class="cuceu-logo-img">
                    <span class="fm-text">.fm</span>
                </div>
            </div>

            <button id="btn">LISTEN NOW</button>
            <div class="history-wrapper">
                <button id="history-toggle">Recently Played ▼</button>
                <ul id="history-list"><li class="history-item">Loading...</li></ul>
            </div>
        </div>

        <div class="ticker-tape ticker-bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>
        
        <audio id="radioPlayer" preload="none"></audio>
    </div>

<script>
    // Sequenced Exit Logic
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('.internal-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.body.classList.add('is-exiting'); 
                setTimeout(() => window.location.assign(link.href), 750); 
            });
        });
    });

    const STREAM_BASE = "https://stream.cuceu.co.uk";
    
    // Single Line Clock
    function updateDateTime() {
        const now = new Date();
        const days = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
        const day = days[now.getDay()];
        let h = now.getHours() % 12 || 12;
        let m = now.getMinutes().toString().padStart(2, '0');
        let ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        document.getElementById('live-single-line').innerText = `${day} | ${h}:${m} ${ampm}`;
    }
    setInterval(updateDateTime, 1000); updateDateTime();

    const btn = document.getElementById("btn"), player = document.getElementById("radioPlayer"),
          centerStatus = document.getElementById("center-status"), pulseIndicator = document.getElementById("pulse-indicator"),
          historyList = document.getElementById("history-list"), historyToggle = document.getElementById("history-toggle"),
          topMarquee = document.getElementById("top-marquee"), bottomMarquee = document.getElementById("bottom-marquee");

    let playing = false, isOnline = false, currentTrackText = "", currentTitle = "", currentArtUrl = "", lastTickerState = ""; 

    async function fetchArtwork() {
        try {
            const res = await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now());
            const cleanUrl = (await res.text()).trim();
            if (cleanUrl && cleanUrl.startsWith('http')) currentArtUrl = cleanUrl;
        } catch(e) { currentArtUrl = ""; }
    }

    historyToggle.onclick = () => { 
        historyList.classList.toggle("open"); 
        historyToggle.innerText = historyList.classList.contains("open") ? "Recently Played ▲" : "Recently Played ▼"; 
    };

    async function directFetch(url) { const res = await fetch(url + "?t=" + Date.now()); return await res.json(); }
    
    async function fetchGlobalHistory() { 
        try { 
            const data = await directFetch(`${STREAM_BASE}/history.json`); 
            if (data) historyList.innerHTML = data.filter(t => t).map(track => `<li class="history-item">${track}</li>`).join(''); 
        } catch(e) {} 
    }

    // Pure CSS Marquee population
    function updateTicker(base) {
        const artHtml = currentArtUrl ? `<img class="ticker-art has-art" src="${currentArtUrl}">` : `<div style="width:26px; height:26px; margin:0 15px;"></div>`;
        const tickerState = `${base}|${currentArtUrl || ""}`;
        if (tickerState === lastTickerState) return;
        lastTickerState = tickerState;
        
        const itemHtml = `<div class="ticker-item"><span class="song-display">${base}</span>${artHtml}</div>`;
        // Load enough to easily overflow screen width times two for infinite CSS scroll trick
        const content = Array(20).fill(itemHtml).join(''); 
        
        topMarquee.innerHTML = content + content;
        bottomMarquee.innerHTML = content + content;
    }

    function setStatus(text, dotClass) { 
        centerStatus.innerText = text; 
        pulseIndicator.className = "pulse-dot " + dotClass; 
    }

    async function fetchSongData() {
        try {
            const data = await directFetch(`${STREAM_BASE}/status-json.xsl`);
            let s = data.icestats.source; if (!s) throw new Error();
            isOnline = true; 
            let t = Array.isArray(s) ? (s[0].title || "ON AIR") : (s.title || "ON AIR");
            
            if (!playing) setStatus("LIVE", "live");
            
            if (t !== currentTitle) {
                currentTitle = t;
                fetchGlobalHistory(); 
                currentArtUrl = "";
                await fetchArtwork();
            } else if (!currentArtUrl) {
                await fetchArtwork();
            }
            updateTicker(`NOW PLAYING: ${t}`);
        } catch (e) { 
            isOnline = false; 
            if (!playing) { setStatus("OFFLINE", ""); updateTicker("STANDBY"); } 
        }
    }

    player.onwaiting = () => { if (playing) setStatus("BUFFERING...", "buffering"); };
    player.onplaying = () => { if (playing) setStatus("ON AIR", "on-air"); };
    player.onpause = () => { if (isOnline) setStatus("LIVE", "live"); };

    btn.onclick = () => {
        if (!playing) { 
            player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`; 
            player.play(); 
            btn.innerText = "⏸ Disconnect"; 
            setStatus("BUFFERING...", "buffering");
        } else { 
            player.pause(); 
            player.src = ""; 
            btn.innerText = "LISTEN NOW"; 
            setStatus(isOnline ? "LIVE" : "OFFLINE", isOnline ? "live" : "");
        }
        playing = !playing;
    };

    setInterval(fetchSongData, 4000);
    fetchGlobalHistory(); fetchArtwork(); updateTicker("STANDBY"); fetchSongData();
</script>
</body>
</html>
