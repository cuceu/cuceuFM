<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* PLAIN WHITE BRUTALIST BACKGROUND */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* --- SEAMLESS INFINITE TICKER TAPE CSS --- */
        .ticker-tape {
            position: absolute;
            width: 100%;
            background: #000;
            color: #ffffff;
            overflow: hidden;
            padding: 12px 0;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            z-index: 10;
            box-sizing: border-box;
            display: flex;
        }

        .ticker-top { top: 0; }
        .ticker-bottom { bottom: 0; }

        /* The wrapper that holds the duplicating text for a gapless loop */
        .marquee-wrapper {
            display: flex;
            white-space: nowrap;
            /* SLOWED DOWN: Changed from 30s to 50s for a chill glide */
            animation: marquee 90s linear infinite;
            width: fit-content;
        }

        .song-display {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding-right: 20px; 
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- MAIN BRUTALIST UI --- */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* THICKER, BOLDER LOGO */
        h1 {
            font-size: clamp(4rem, 16vw, 18rem); 
            white-space: nowrap; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px; 
            margin: 0;
            color: #000; 
            -webkit-text-stroke: 4px #000; 
        }

        .fm-text {
            font-size: 0.5em; 
            text-transform: lowercase;
            letter-spacing: -2px;
            -webkit-text-stroke: 0px; 
        }

        /* Center Status Box */
        .live-status {
            font-size: clamp(1rem, 3vw, 1.5rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            margin-top: -5px;
            margin-bottom: 40px;
            color: #000; 
            background: #fff; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 20px;
            border: 3px solid #000;
            max-width: 90%;
            white-space: nowrap;
        }

        .pulse-dot {
            height: 15px;
            width: 15px;
            background-color: #ff0000; 
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        /* BIG BLOCKY BUTTON */
        button {
            background-color: #000; 
            color: #fff; 
            border: 4px solid #000; 
            padding: 20px 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 0; 
            box-shadow: 8px 8px 0 #d3d3d3; 
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translate(-4px, -4px); 
            box-shadow: 12px 12px 0 #d3d3d3; 
        }

        button:active {
            transform: translate(4px, 4px); 
            box-shadow: 0px 0px 0 #d3d3d3; 
        }
    </style>
</head>
<body>

    <div class="ticker-tape ticker-top">
        <div class="marquee-wrapper">
            <span class="song-display">WAITING FOR SATELLITE UPLINK... </span>
            <span class="song-display">WAITING FOR SATELLITE UPLINK... </span>
        </div>
    </div>

    <div class="main-container">
        <h1>CUCEU<span class="fm-text">.fm</span></h1>
        
        <div class="live-status">
            <div class="pulse-dot"></div> <span id="center-status">LOADING...</span>
        </div>
        <button id="btn">▶ Listen</button>
    </div>

    <div class="ticker-tape ticker-bottom">
        <div class="marquee-wrapper">
            <span class="song-display">WAITING FOR SATELLITE UPLINK... </span>
            <span class="song-display">WAITING FOR SATELLITE UPLINK... </span>
        </div>
    </div>

    <audio id="radioPlayer" src="https://stream.cuceu.co.uk/stream.mp3" preload="none"></audio>

    <script>
        const btn = document.getElementById("btn");
        const player = document.getElementById("radioPlayer");
        const centerStatus = document.getElementById("center-status");
        
        let playing = false;
        let dataLoaded = false;

        btn.onclick = () => {
            if (!playing) {
                player.src = "https://stream.cuceu.co.uk/stream.mp3";
                player.play();
                btn.innerText = "⏸ Pause";
                centerStatus.innerText = "ON AIR"; 
            } else {
                player.pause();
                player.src = ""; 
                btn.innerText = "▶ Listen";
                centerStatus.innerText = dataLoaded ? "READY" : "LOADING..."; 
            }
            playing = !playing;
        };

        function fetchSongData() {
            const targetUrl = encodeURIComponent("https://stream.cuceu.co.uk/status-json.xsl?t=" + new Date().getTime());
            const proxyUrl = "https://api.allorigins.win/raw?url=" + targetUrl + "&nocache=" + new Date().getTime();
            
            fetch(proxyUrl, { cache: "no-store" })
                .then(response => response.json())
                .then(data => {
                    dataLoaded = true;
                    
                    if (!playing) {
                        centerStatus.innerText = "READY"; 
                    }

                    let title = "ON AIR"; 
                    let source = data.icestats.source;
                    if (source) {
                        title = Array.isArray(source) ? (source[0].title || "ON AIR") : (source.title || "ON AIR");
                    }
                    
                    const massiveTextBlock = Array(15).fill(`+++ NOW PLAYING: ${title} `).join('');

                    const tapes = document.querySelectorAll('.song-display');
                    tapes.forEach(el => {
                        el.innerText = massiveTextBlock;
                    });
                })
                .catch(err => {
                    console.log("Sneaking past the bouncer...");
                });
        }

        fetchSongData();
        setInterval(fetchSongData, 5000);
    </script>
</body>
</html>
