<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <style>
        html, body { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; 
        }

        /* --- THE BACKGROUND CONTAINER --- */
        #app-container {
            width: 100vw; height: 100dvh; 
            display: flex; flex-direction: column;
            background-color: #ffffff;
            background-image: url('./IMG_1148.webp'); 
            background-position: center 45%; 
            background-repeat: no-repeat;
            background-size: contain;
            position: relative;
            overflow: hidden;
            
            transform-origin: center center;
            animation: bgExpand 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        body.is-exiting #app-container {
            animation: bgShrink 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.4s forwards;
        }

        @keyframes bgExpand {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes bgShrink {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0; filter: blur(5px); }
        }

        /* --- TOP NAV --- */
        .top-nav-bar {
            position: absolute; top: 80px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 30px; box-sizing: border-box; z-index: 100;
        }
        .back-btn-top {
            color: #000; text-decoration: none; font-weight: 800; 
            text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
            border: 2px solid #000; padding: 8px 16px;
            transition: background-color 0.2s ease, color 0.2s ease; background: white;
        }
        .back-btn-top:hover { background-color: #000; color: #fff; }

        .date-time-display {
            text-align: right; font-weight: 900; text-transform: uppercase;
            font-size: 15px; letter-spacing: 1px; white-space: nowrap;
        }

        /* --- TICKER TAPE --- */
        .ticker-tape { 
            position: absolute; width: 100%; background: #000; color: #fff; overflow: hidden; 
            padding: 8px 0; border-top: 2px solid #000; border-bottom: 2px solid #000; 
            display: flex; z-index: 60; 
        }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        .marquee-wrapper { display: flex; white-space: nowrap; animation: marquee linear infinite; width: fit-content; align-items: center; transition: opacity 0.18s ease, transform 0.18s ease; will-change: opacity, transform; }
        .marquee-wrapper.refreshing { opacity: 0; transform: translateY(-6px); }
        
        .ticker-item { display: inline-flex; align-items: center; }
        .ticker-art { height: 32px; width: 32px; margin: 0 20px; object-fit: cover; display: none; }
        .ticker-art.has-art { display: block; }
        .song-display { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Sequenced Ticker Animations */
        .ticker-top { transform: translateY(-100%); animation: slideTopIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.6s forwards; }
        .ticker-bottom { transform: translateY(100%); animation: slideBottomIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) 0.6s forwards; }
        
        body.is-exiting .ticker-top { animation: slideTopOut 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards; animation-fill-mode: forwards; }
        body.is-exiting .ticker-bottom { animation: slideBottomOut 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards; animation-fill-mode: forwards; }

        @keyframes slideTopIn { to { transform: translateY(0); } }
        @keyframes slideBottomIn { to { transform: translateY(0); } }
        @keyframes slideTopOut { to { transform: translateY(-100%); } }
        @keyframes slideBottomOut { to { transform: translateY(100%); } }

        /* --- LOGO AREA (Inside Window) --- */
        #logo-cluster {
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: absolute; top: 34%; left: 50%; width: 100%; pointer-events: none; z-index: 20;
            opacity: 0; animation: logoJumpUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            will-change: transform, opacity;
        }
        body.is-exiting #logo-cluster { animation: logoJumpDown 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards; animation-fill-mode: forwards; }

        .logo-wrapper-img { display: flex; align-items: flex-end; justify-content: center; gap: 0; }
        .cuceu-logo-img { height: clamp(4rem, 15vw, 7rem); width: auto; user-select: none; -webkit-user-drag: none; }
        .fm-text { 
            font-size: clamp(1.5rem, 5vw, 2.5rem); 
            font-weight: 900; letter-spacing: -2px; 
            padding-bottom: 0.5rem; margin-left: -5px; 
        }
        
        .live-status { 
            font-size: 1.5rem; text-transform: uppercase; letter-spacing: 4px; font-weight: 900; 
            margin-top: 15px; display: inline-flex; align-items: center; gap: 10px;
        }
        
        /* Audio Status Dots */
        .pulse-dot { height: 14px; width: 14px; background-color: #777; border-radius: 50%; }
        .pulse-dot.live { background-color: #34c759; box-shadow: 0 0 10px #34c759; }
        .pulse-dot.buffering { background-color: #ffcc00; box-shadow: 0 0 12px #ffcc00; animation: pulse-yellow 1s infinite; }
        .pulse-dot.on-air { background-color: #ff3b30; box-shadow: 0 0 12px #ff3b30; animation: pulse-red 1.2s infinite; }
        
        @keyframes pulse-yellow { 0% { transform: scale(0.85); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.85); opacity: 0.8; } }
        @keyframes pulse-red { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }

        @keyframes logoJumpUp {
            0% { opacity: 0; transform: translate(-50%, calc(-50% + 60px)) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
        }
        @keyframes logoJumpDown {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, calc(-50% + 60px)) scale(0.9); }
        }

        /* --- CONTROLS AREA (Under Window) --- */
        #controls-area {
            position: absolute; top: 58%; left: 50%;
            display: flex; flex-direction: column; align-items: center; z-index: 30;
            opacity: 0; animation: controlsJumpUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
            will-change: transform, opacity;
        }
        body.is-exiting #controls-area { animation: controlsJumpDown 0.4s cubic-bezier(0.25, 1, 0.5, 1) 0.05s forwards; animation-fill-mode: forwards; }

        @keyframes controlsJumpUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(60px) scale(0.9); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }
        @keyframes controlsJumpDown {
            0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            100% { opacity: 0; transform: translateX(-50%) translateY(60px) scale(0.9); }
        }

        #btn { 
            background-color: #000; color: #fff; border: 4px solid #000;
            width: 170px; height: 64px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.1rem; text-transform: uppercase; 
            font-weight: 900; letter-spacing: 2px; cursor: pointer; 
            box-shadow: 6px 6px 0 #d3d3d3; transition: all 0.2s ease; margin-bottom: 20px;
            padding: 0;
        }
        #btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #d3d3d3; }

        /* --- HISTORY --- */
        .history-wrapper { display: flex; flex-direction: column; width: 320px; position: relative; }
        #history-toggle { 
            background: none; border: none; padding: 5px; color: #000; font-size: 0.85rem; 
            font-weight: 900; text-transform: uppercase; cursor: pointer; margin: 0 auto;
        }
        #history-list { 
            position: absolute; top: 100%; left: 0; width: 100%; list-style: none; padding: 0; max-height: 0; opacity: 0; overflow: hidden; 
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s ease; border: 0px solid #000; z-index: 50;
        }
        #history-list.open { max-height: 220px; opacity: 1; padding: 10px; border: 2px solid #000; }
        .history-item { padding: 10px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,0.1); text-align: center; }

        @media (max-width: 600px) {
            #logo-cluster { transform: translate(-50%, -50%) scale(0.7); top: 35%; }
            #controls-area { top: 55%; }
            .top-nav-bar { top: 60px; padding: 0 15px; }
            @keyframes logoJumpUp { 0% { opacity: 0; transform: translate(-50%, calc(-50% + 60px)) scale(0.6); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); } }
            @keyframes logoJumpDown { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); } 100% { opacity: 0; transform: translate(-50%, calc(-50% + 60px)) scale(0.6); } }
            .ticker-tape { padding: 6px 0; }
            .ticker-art { height: 28px; width: 28px; margin: 0 12px; }
            .song-display { font-size: 1rem; letter-spacing: 1px; }
            #btn { width: 150px; height: 54px; font-size: 1rem; }
            .history-wrapper { width: min(90vw, 280px); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="ticker-tape ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>
        <div class="ticker-tape ticker-bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>
        
        <div class="top-nav-bar">
            <a href="/" class="back-btn-top internal-link">← Back</a>
            <div class="date-time-display">
                <span id="live-single-line">MONDAY | 00:00 AM</span>
            </div>
        </div>
        
        <div id="logo-cluster">
            <div class="logo-wrapper-img">
                <img src="cuceugrta.png" alt="CUCEU" class="cuceu-logo-img">
                <span class="fm-text">.fm</span>
            </div>
            <div class="live-status">
                <div class="pulse-dot" id="pulse-indicator"></div> 
                <span id="center-status">CHECKING...</span>
            </div>
        </div>

        <div id="controls-area">
            <button id="btn">LISTEN NOW</button>
            <div class="history-wrapper">
                <div id="history-toggle">Recently Played ▼</div>
                <ul id="history-list"><li class="history-item" style="border:none;">Loading...</li></ul>
            </div>
        </div>

        <audio id="radioPlayer" preload="none"></audio>
    </div>

<script>
    // Sequenced Exit Logic
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('.internal-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.body.classList.add('is-exiting'); 
                setTimeout(() => window.location.assign(link.href), 1000); 
            });
        });
    });

    const STREAM_BASE = "https://stream.cuceu.co.uk";
    
    // Single Line Clock
    function updateDateTime() {
        const now = new Date();
        const day = now.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
        let h = now.getHours() % 12 || 12;
        let m = now.getMinutes().toString().padStart(2, '0');
        let ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        document.getElementById('live-single-line').innerText = `${day} | ${h}:${m} ${ampm}`;
    }
    setInterval(updateDateTime, 1000); updateDateTime();

    const btn = document.getElementById("btn"), player = document.getElementById("radioPlayer"),
          centerStatus = document.getElementById("center-status"), pulseIndicator = document.getElementById("pulse-indicator"),
          historyList = document.getElementById("history-list"), historyToggle = document.getElementById("history-toggle"),
          topMarquee = document.getElementById("top-marquee"), bottomMarquee = document.getElementById("bottom-marquee");

    let playing = false, isOnline = false, currentTrackText = "", currentTitle = "", currentArtUrl = "", lastTickerState = ""; 

    async function fetchArtwork() {
        try {
            const res = await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now());
            const cleanUrl = (await res.text()).trim();
            if (cleanUrl && cleanUrl.startsWith('http')) currentArtUrl = cleanUrl;
        } catch(e) { currentArtUrl = ""; }
    }

    historyToggle.onclick = () => { 
        historyList.classList.toggle("open"); 
        historyToggle.innerText = historyList.classList.contains("open") ? "Recently Played ▲" : "Recently Played ▼"; 
    };

    async function directFetch(url) { const res = await fetch(url + "?t=" + Date.now()); return await res.json(); }
    
    async function fetchGlobalHistory() { 
        try { 
            const data = await directFetch(`${STREAM_BASE}/history.json`); 
            if (data) historyList.innerHTML = data.filter(t => t).map(track => `<li class="history-item">${track}</li>`).join(''); 
        } catch(e) {} 
    }

    function updateTicker(base) {
        const artHtml = currentArtUrl ? `<img class="ticker-art has-art" src="${currentArtUrl}">` : `<div style="width:32px"></div>`;
        const tickerState = `${base}|${currentArtUrl || ""}`;
        if (tickerState === lastTickerState) return;
        lastTickerState = tickerState;
        currentTrackText = base;
        const itemHtml = `<div class="ticker-item"><span class="song-display">${base}</span>${artHtml}</div>`;
        const content = Array(12).fill(itemHtml).join('');
        [topMarquee, bottomMarquee].forEach(m => m.classList.add('refreshing'));
        setTimeout(() => {
            [topMarquee, bottomMarquee].forEach(m => {
                m.innerHTML = content + content;
                m.style.animationDuration = `${(base.length + 20) * 2}s`;
                m.classList.remove('refreshing');
            });
        }, 180);
    }

    // Dynamic Status Control
    function setStatus(text, dotClass) { 
        centerStatus.innerText = text; 
        pulseIndicator.className = "pulse-dot " + dotClass; 
    }

    async function fetchSongData() {
        try {
            const data = await directFetch(`${STREAM_BASE}/status-json.xsl`);
            let s = data.icestats.source; if (!s) throw new Error();
            isOnline = true; 
            let t = Array.isArray(s) ? (s[0].title || "ON AIR") : (s.title || "ON AIR");
            
            // Only update to standard LIVE if we aren't currently playing/buffering
            if (!playing) setStatus("LIVE", "live");
            
            if (t !== currentTitle) {
                currentTitle = t;
                fetchGlobalHistory(); 
                currentArtUrl = "";
                await fetchArtwork();
            } else if (!currentArtUrl) {
                await fetchArtwork();
            }
            updateTicker(`NOW PLAYING: ${t}`);
        } catch (e) { 
            isOnline = false; 
            if (!playing) { setStatus("OFFLINE", ""); updateTicker("STANDBY"); } 
        }
    }

    // Audio Event Listeners for precise UI feedback
    player.onwaiting = () => { if (playing) setStatus("BUFFERING...", "buffering"); };
    player.onplaying = () => { if (playing) setStatus("ON AIR", "on-air"); };
    player.onpause = () => { if (isOnline) setStatus("LIVE", "live"); };

    btn.onclick = () => {
        if (!playing) { 
            player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`; 
            player.play(); 
            btn.innerText = "⏸ Disconnect"; 
            setStatus("BUFFERING...", "buffering"); // Trigger yellow immediately on click
        } else { 
            player.pause(); 
            player.src = ""; 
            btn.innerText = "LISTEN NOW"; 
            setStatus(isOnline ? "LIVE" : "OFFLINE", isOnline ? "live" : "");
        }
        playing = !playing;
    };

    setInterval(fetchSongData, 4000);
    fetchGlobalHistory(); fetchArtwork(); updateTicker("STANDBY"); fetchSongData();
</script>
</body>
</html>
