<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* PLAIN WHITE BRUTALIST BACKGROUND */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; /* Clean, stark white */
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* --- TICKER TAPE CSS --- */
        .ticker-tape {
            position: absolute;
            width: 100%;
            background: #000;
            color: #8aff00; /* Neon Brat Green pops against the black tape */
            overflow: hidden;
            white-space: nowrap;
            padding: 12px 0;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            z-index: 10;
            box-sizing: border-box;
        }

        .ticker-top { top: 0; }
        .ticker-bottom { bottom: 0; }

        .ticker-text {
            display: inline-block;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding-left: 100%;
            animation: marquee 20s linear infinite; 
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* --- MAIN BRUTALIST UI --- */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* EVEN BIGGER LOGO WITH CUSTOM .fm */
        h1 {
            font-size: clamp(4rem, 16vw, 18rem); /* Scaled up massively */
            white-space: nowrap; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px; 
            margin: 0;
            color: #000; 
            /* Removed the white text-shadow since the background is white now */
        }

        /* The smaller, lowercase .fm */
        .fm-text {
            font-size: 0.5em; /* Makes it half the size of CUCEU */
            text-transform: lowercase;
            letter-spacing: -2px;
        }

        /* Center Live Status Box */
        .live-status {
            font-size: clamp(1rem, 3vw, 1.5rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            margin-top: -5px;
            margin-bottom: 40px;
            color: #000; 
            background: #fff; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 20px;
            border: 3px solid #000;
            max-width: 90%;
            white-space: nowrap;
        }

        .pulse-dot {
            height: 15px;
            width: 15px;
            background-color: #ff0000; 
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        /* BIG BLOCKY BUTTON */
        button {
            background-color: #000; 
            color: #fff; 
            border: 4px solid #000; 
            padding: 20px 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 0; 
            box-shadow: 8px 8px 0 #8aff00; /* Neon green shadow for the white background */
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translate(-4px, -4px); 
            box-shadow: 12px 12px 0 #8aff00; 
        }

        button:active {
            transform: translate(4px, 4px); 
            box-shadow: 0px 0px 0 #8aff00; 
        }
    </style>
</head>
<body>

    <div class="ticker-tape ticker-top">
        <div class="ticker-text">WAITING FOR SATELLITE UPLINK...</div>
    </div>

    <div class="main-container">
        <h1>CUCEU<span class="fm-text">.fm</span></h1>
        
        <div class="live-status">
            <div class="pulse-dot"></div> <span id="center-status">LOADING...</span>
        </div>
        <button id="btn">▶ Listen</button>
    </div>

    <div class="ticker-tape ticker-bottom">
        <div class="ticker-text">WAITING FOR SATELLITE UPLINK...</div>
    </div>

    <audio id="radioPlayer" src="https://stream.cuceu.co.uk/stream.mp3" preload="none"></audio>

    <script>
        const btn = document.getElementById("btn");
        const player = document.getElementById("radioPlayer");
        const centerStatus = document.getElementById("center-status");
        
        let playing = false;
        let dataLoaded = false;

        // Button Click Logic
        btn.onclick = () => {
            if (!playing) {
                player.src = "https://stream.cuceu.co.uk/stream.mp3";
                player.play();
                btn.innerText = "⏸ Pause";
                centerStatus.innerText = "LIVE ON AIR"; // Boom.
            } else {
                player.pause();
                player.src = ""; 
                btn.innerText = "▶ Listen";
                centerStatus.innerText = dataLoaded ? "READY" : "LOADING..."; 
            }
            playing = !playing;
        };

        // --- THE DIRECT CONNECTION ---
        function fetchSongData() {
            // No more proxy! Going straight to your server with a time-stamp to force a fresh pull every time
            fetch("https://stream.cuceu.co.uk/status-json.xsl?t=" + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    dataLoaded = true;
                    
                    if (!playing) {
                        centerStatus.innerText = "READY"; 
                    }

                    let title = "LIVE ON AIR"; 
                    let source = data.icestats.source;
                    if (source) {
                        title = Array.isArray(source) ? (source[0].title || "LIVE ON AIR") : (source.title || "LIVE ON AIR");
                    }
                    
                    const tapes = document.querySelectorAll('.ticker-text');
                    tapes.forEach(el => {
                        el.innerText = `+++ NOW PLAYING: ${title} +++ NOW PLAYING: ${title} +++ NOW PLAYING: ${title} +++`;
                    });
                })
                .catch(err => {
                    console.log("Waiting for the beat drop...");
                });
        }

        fetchSongData();
        setInterval(fetchSongData, 10000);
    </script>
</body>
</html>
