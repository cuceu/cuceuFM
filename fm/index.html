<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <style>
        html, body { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; 
        }

        /* --- BACKGROUND --- */
        #app-container {
            width: 100vw; height: 100dvh; 
            display: flex; flex-direction: column;
            background-color: #ffffff;
            background-image: url('./IMG_1148.webp'); 
            background-position: center 45%; 
            background-repeat: no-repeat;
            background-size: contain;
            position: relative;
            overflow: hidden;
        }

        /* --- TOP NAV (Clock Only) --- */
        .top-nav-bar {
            position: absolute;
            top: 65px;
            width: 100%;
            display: flex;
            justify-content: flex-end; /* Pushed to the right */
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 100;
        }
        .date-time-display {
            text-align: right;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        /* --- TICKER TAPE --- */
        .ticker-tape { 
            position: absolute; width: 100%; background: #000; color: #fff; overflow: hidden; 
            padding: 12px 0; border-top: 4px solid #000; border-bottom: 4px solid #000; 
            display: flex; z-index: 60; 
        }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        .marquee-wrapper { display: flex; white-space: nowrap; animation: marquee linear infinite; width: fit-content; align-items: center;}
        
        .ticker-item {
            display: inline-flex;
            align-items: center;
        }
        .ticker-art {
            height: 40px; width: 40px;
            margin: 0 30px; /* Space between text and image */
            object-fit: cover;
            display: none;
        }
        .ticker-art.has-art { display: block; }
        .song-display { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- LOGO AREA (Inside Window) --- */
        #logo-cluster {
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            position: absolute; 
            top: 36%; /* Moved higher up inside the window */
            left: 50%;
            transform: translate(-50%, -50%) scale(1.2);
            width: 100%;
            pointer-events: none;
            z-index: 20;
        }
        h1 { font-size: 8rem; font-weight: 950; text-transform: uppercase; letter-spacing: -8px; margin: 0; line-height: 0.8; }
        .fm-text { font-size: 2.5rem; font-weight: 400; letter-spacing: -2px; }
        .live-status { 
            font-size: 1.2rem; text-transform: uppercase; letter-spacing: 4px; font-weight: 900; 
            margin-top: 15px; display: inline-flex; align-items: center; gap: 10px;
        }
        .pulse-dot { height: 12px; width: 12px; background-color: #777; border-radius: 50%; }
        .pulse-dot.live { background-color: #34c759; box-shadow: 0 0 10px #34c759; }

        /* --- CONTROLS (Under Window) --- */
        #controls-area {
            position: absolute;
            top: 54%; /* Positioned right under the window ledge */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 30;
        }
        #btn { 
            background-color: #000; color: #fff; border: 4px solid #000; 
            padding: 12px 35px; font-size: 1.1rem; text-transform: uppercase; 
            font-weight: 900; letter-spacing: 3px; cursor: pointer; 
            box-shadow: 6px 6px 0 #d3d3d3; transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        #btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #d3d3d3; }

        /* --- HISTORY --- */
        .history-wrapper { 
            display: flex;
            flex-direction: column-reverse;
            width: 300px;
        }
        #history-toggle { 
            background: rgba(255,255,255,0.9); border: 2px solid #000; 
            padding: 8px 20px; color: #000; font-size: 0.75rem; 
            font-weight: 900; text-transform: uppercase; cursor: pointer; 
            border-radius: 30px; margin: 0 auto;
        }
        #history-list { 
            list-style: none; padding: 0; max-height: 0; opacity: 0; overflow: hidden; 
            background: white; border-radius: 12px; transition: all 0.4s ease; 
            margin-bottom: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #history-list.open { max-height: 200px; opacity: 1; padding: 10px; border: 2px solid #000; }
        .history-item { padding: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid #eee; text-align: center; }

        @media (max-width: 600px) {
            #logo-cluster { transform: translate(-50%, -50%) scale(0.7); top: 35%; }
            #controls-area { top: 52%; }
            h1 { font-size: 5rem; }
            .top-nav-bar { top: 50px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="ticker-tape ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>
        <div class="ticker-tape ticker-bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>
        
        <div class="top-nav-bar">
            <div class="date-time-display">
                <div id="live-date">MONDAY, MAY 18</div>
                <div id="live-clock">02:50 AM</div>
            </div>
        </div>
        
        <div id="logo-cluster">
            <h1>CUCEU<span class="fm-text">.fm</span></h1>
            <div class="live-status">
                <div class="pulse-dot" id="pulse-indicator"></div> 
                <span id="center-status">CHECKING...</span>
            </div>
        </div>

        <div id="controls-area">
            <button id="btn">▶ Listen</button>
            <div class="history-wrapper">
                <div id="history-toggle">Recently Played ▼</div>
                <ul id="history-list"><li class="history-item" style="border:none;">Loading...</li></ul>
            </div>
        </div>

        <audio id="radioPlayer" preload="none"></audio>
    </div>

<script>
    const STREAM_BASE = "https://stream.cuceu.co.uk";
    
    // Clock
    function updateDateTime() {
        const now = new Date();
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
        let h = now.getHours() % 12 || 12;
        let m = now.getMinutes().toString().padStart(2, '0');
        let ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        document.getElementById('live-clock').innerText = `${h}:${m} ${ampm}`;
    }
    setInterval(updateDateTime, 1000); updateDateTime();

    const btn = document.getElementById("btn"), player = document.getElementById("radioPlayer"),
          centerStatus = document.getElementById("center-status"), pulseIndicator = document.getElementById("pulse-indicator"),
          historyList = document.getElementById("history-list"), historyToggle = document.getElementById("history-toggle"),
          topMarquee = document.getElementById("top-marquee"), bottomMarquee = document.getElementById("bottom-marquee");

    let playing = false, isOnline = false, currentTrackText = "", currentTitle = "", currentArtUrl = ""; 

    async function fetchArtwork() {
        try {
            const res = await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now());
            const cleanUrl = (await res.text()).trim();
            if (cleanUrl && cleanUrl.startsWith('http')) {
                currentArtUrl = cleanUrl;
            }
        } catch(e) { currentArtUrl = ""; }
    }

    historyToggle.onclick = () => { 
        historyList.classList.toggle("open"); 
        historyToggle.innerText = historyList.classList.contains("open") ? "Recently Played ▲" : "Recently Played ▼"; 
    };

    async function directFetch(url) { const res = await fetch(url + "?t=" + Date.now()); return await res.json(); }
    
    async function fetchGlobalHistory() { 
        try { 
            const data = await directFetch(`${STREAM_BASE}/history.json`); 
            if (data) historyList.innerHTML = data.filter(t => t).map(track => `<li class="history-item">${track}</li>`).join(''); 
        } catch(e) {} 
    }

    function updateTicker(base) {
        if (currentTrackText === base && currentArtUrl) return; 
        currentTrackText = base;
        
        // This puts the art BETWEEN every text item
        const artHtml = currentArtUrl ? `<img class="ticker-art has-art" src="${currentArtUrl}">` : `<div style="width:40px"></div>`;
        const itemHtml = `<div class="ticker-item"><span class="song-display">${base}</span>${artHtml}</div>`;
        
        const content = Array(12).fill(itemHtml).join('');
        [topMarquee, bottomMarquee].forEach(m => { 
            m.innerHTML = content + content; 
            m.style.animationDuration = `${(base.length + 20) * 2}s`; 
        });
    }

    async function fetchSongData() {
        try {
            const data = await directFetch(`${STREAM_BASE}/status-json.xsl`);
            let s = data.icestats.source; if (!s) throw new Error();
            isOnline = true; 
            let t = Array.isArray(s) ? (s[0].title || "ON AIR") : (s.title || "ON AIR");
            if (!playing) {
                centerStatus.innerText = "LIVE";
                pulseIndicator.className = "pulse-dot live";
            }
            if (t !== currentTitle) { 
                currentTitle = t; 
                fetchGlobalHistory(); 
                await fetchArtwork(); 
            }
            updateTicker(`NOW PLAYING: ${t}`);
        } catch (e) { 
            isOnline = false; 
            if (!playing) { centerStatus.innerText = "OFFLINE"; pulseIndicator.className = "pulse-dot"; updateTicker("STANDBY"); } 
        }
    }

    btn.onclick = () => {
        if (!playing) { 
            player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`; 
            player.play(); 
            btn.innerText = "⏸ Disconnect"; 
        } else { 
            player.pause(); 
            player.src = ""; 
            btn.innerText = "▶ Listen"; 
        }
        playing = !playing;
    };

    setInterval(fetchSongData, 4000);
    fetchGlobalHistory(); fetchArtwork(); updateTicker("STANDBY"); fetchSongData();
</script>
</body>
</html>
