<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <style>
        html, body { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; 
        }

        /* --- SMOOTH PAGE TRANSITIONS --- */
        #page-transition-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; z-index: 99999;
            pointer-events: none; opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #page-transition-overlay.loaded { opacity: 0; }

        /* --- THE GENIE CONTAINER --- */
        #app-container {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            background-color: #ffffff;
            transform-origin: 60% 100%; /* Sucks down into the 3rd dock slot */
            transition: all 0.6s cubic-bezier(0.5, 0, 0.1, 1);
            transform: scale(1) translateY(0);
            opacity: 1;
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }

        .genie-state {
            transform: scale(0.05) translateY(50vh) !important;
            opacity: 0 !important;
            border-radius: 100px !important;
        }
        
        /* --- BACKGROUND ART (LAYER 1) --- */
        #bouncing-container { 
            position: absolute; width: 160px; height: 160px; 
            z-index: 1; top: 0; left: 0; will-change: transform; 
            cursor: grab; touch-action: none; 
            user-select: none; -webkit-user-select: none;
        }
        #bouncing-container:active { cursor: grabbing; }
        
        @media (min-width: 768px) { #bouncing-container { width: 260px; height: 260px; } }
        
        .art-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; 
            pointer-events: none; -webkit-user-drag: none; 
        }
        .art-layer.active { opacity: 1; }

        /* --- UI SEQUENCED ANIMATIONS --- */
        .main-container { animation: breatheUp 0.8s cubic-bezier(0.25,1,0.5,1) forwards; }
        .ticker-top { animation: slideTopIn 0.6s cubic-bezier(0.25,1,0.5,1) 0.4s forwards; transform: translateY(-100%); }
        .ticker-bottom { animation: slideBottomIn 0.6s cubic-bezier(0.25,1,0.5,1) 0.4s forwards; transform: translateY(100%); }
        .back-btn-top, .status-area { animation: slideDownFromBanner 0.6s cubic-bezier(0.25,1,0.5,1) 0.8s forwards; opacity: 0; transform: translateY(-20px); }

        body.is-exiting .back-btn-top, body.is-exiting .status-area { animation: slideUpToBanner 0.3s cubic-bezier(0.25,1,0.5,1) forwards; }
        body.is-exiting .ticker-top { animation: slideTopOut 0.3s cubic-bezier(0.25,1,0.5,1) forwards; }
        body.is-exiting .ticker-bottom { animation: slideBottomOut 0.3s cubic-bezier(0.25,1,0.5,1) forwards; }
        body.is-exiting .main-container { animation: breatheDown 0.3s cubic-bezier(0.25,1,0.5,1) forwards; }

        @keyframes breatheUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes breatheDown { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(40px); } }
        @keyframes slideTopIn { 0% { transform: translateY(-100%); } 100% { transform: translateY(0); } }
        @keyframes slideTopOut { 0% { transform: translateY(0); } 100% { transform: translateY(-100%); } }
        @keyframes slideBottomIn { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }
        @keyframes slideBottomOut { 0% { transform: translateY(0); } 100% { transform: translateY(100%); } }
        @keyframes slideDownFromBanner { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpToBanner { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }

        /* --- ALIGNED CONTROLS --- */
        .back-btn-top {
            position: absolute; left: 30px; top: 75px; 
            color: #000; text-decoration: none; font-weight: 800; 
            text-transform: uppercase; font-size: 12px; letter-spacing: 1px;
            border: 2px solid #000; padding: 8px 16px; border-radius: 20px;
            transition: background-color 0.2s ease, color 0.2s ease; z-index: 30; 
            background-color: rgba(255,255,255,0.7); backdrop-filter: blur(5px);
        }
        .back-btn-top:hover { background-color: #000; color: #fff; }

        .status-area { 
            position: absolute; right: 30px; top: 75px; display: flex; align-items: center; 
            font-size: 16px; font-weight: 800; text-transform: uppercase; color: #000; z-index: 30; 
            text-shadow: 0 0 15px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.9); 
        }
        
        .ticker-tape { 
            position: absolute; width: 100%; background: #000; color: #fff; overflow: hidden; 
            padding: 12px 0; border-top: 4px solid #000; border-bottom: 4px solid #000; 
            display: flex; z-index: 60; 
        }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        .marquee-wrapper { 
            display: flex; white-space: nowrap; animation: marquee linear infinite; 
            width: fit-content; transition: opacity 0.5s ease-in-out; 
        }
        .song-display { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; padding-right: 80px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        
        .main-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            text-align: center; padding: 0 20px; box-sizing: border-box;
            pointer-events: auto; z-index: 10;
        }
        
        /* --- THE LOGO --- */
        .logo-group { 
            display: flex; align-items: flex-end; justify-content: center; 
            margin-bottom: 10px; pointer-events: none;
        }
        
        h1 { 
            font-size: clamp(5rem, 20vw, 25rem); 
            font-weight: 950; text-transform: uppercase; 
            letter-spacing: -10px; margin: 0; color: #000; line-height: 0.8; 
            text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 40px rgba(255,255,255,0.8); 
        }

        .fm-text { 
            font-size: clamp(2rem, 8vw, 6rem); 
            font-weight: 400; text-transform: lowercase; 
            margin-left: 5px; color: #000; letter-spacing: -2px;
            text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 40px rgba(255,255,255,0.8); 
        }
        
        .live-status { 
            font-size: 1.1rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; 
            margin-top: 20px; margin-bottom: 25px; 
            display: inline-flex; align-items: center; gap: 10px; position: relative; z-index: 40; 
            text-shadow: 0 0 10px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.9); 
        }
        .pulse-dot { height: 10px; width: 10px; background-color: #777; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,1); }
        .pulse-dot.live { background-color: #34c759; }
        .pulse-dot.on-air { background-color: #ff3b30; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { transform: scale(0.9); opacity: 0.7; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }
        
        #btn { 
            background-color: #000; color: #fff; border: 4px solid #000; 
            padding: 18px 40px; font-size: 1.1rem; text-transform: uppercase; 
            font-weight: 800; letter-spacing: 3px; cursor: pointer; 
            box-shadow: 6px 6px 0 #d3d3d3; transition: all 0.2s ease; 
            position: relative; z-index: 40; pointer-events: auto;
        }

        .history-wrapper { 
            width: 100%; max-width: 360px; 
            margin: 25px auto 0; 
            position: relative; z-index: 40; 
        }
        #history-toggle { 
            background: none; border: none; color: #000; font-size: 0.8rem; 
            font-weight: 900; text-transform: uppercase; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; 
            text-shadow: 0 0 10px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.9); 
        }
        #history-list { 
            width: 100%; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            margin: 8px 0 0 0; list-style: none; padding: 0; max-height: 0; opacity: 0; overflow: hidden; 
            border-radius: 12px; transition: all 0.5s ease; box-sizing: border-box;
        }
        #history-list.open { max-height: 300px; opacity: 1; padding: 10px; border: 1px solid rgba(0,0,0,0.05); }
        .history-item { 
            padding: 10px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; 
            border-bottom: 1px solid rgba(0,0,0,0.03); 
            text-align: center; 
        }

        /* --- MOBILE PHONE ADJUSTMENTS --- */
        @media (max-width: 600px) { 
            h1 { font-size: 5rem; letter-spacing: -4px; } 
            .fm-text { font-size: 2rem; } 
            .ticker-tape { padding: 6px 0; border-top-width: 3px; border-bottom-width: 3px; }
            .song-display { font-size: 1.2rem; letter-spacing: 2px; padding-right: 40px; }
            
            .back-btn-top { left: 20px; top: 60px; padding: 6px 12px; font-size: 10px; border-width: 1.5px;}
            .status-area { right: 20px; top: 60px; font-size: 13px; }
        }
    </style>
</head>
<body>
    
    <div id="page-transition-overlay"></div>

    <div id="app-container" class="genie-state">
        <div id="bouncing-container">
            <img id="art-layer-1" class="art-layer" src="" alt="" draggable="false">
            <img id="art-layer-2" class="art-layer" src="" alt="" draggable="false">
        </div>

        <div class="ticker-tape ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>
        
        <a href="/" class="back-btn-top internal-link">← Home</a>
        <div class="status-area"><span id="mac-clock">00:00 AM</span></div>
        
        <div class="main-container">
            <div class="logo-group">
                <h1>CUCEU</h1>
                <span class="fm-text">.fm</span>
            </div>
            <div class="live-status">
                <div class="pulse-dot" id="pulse-indicator"></div> 
                <span id="center-status">CHECKING...</span>
            </div>
            <button id="btn">▶ Listen</button>
            <div class="history-wrapper">
                <div id="history-toggle">Recently Played <span id="arrow">▼</span></div>
                <ul id="history-list"><li class="history-item" style="border:none;">Loading...</li></ul>
            </div>
        </div>

        <div class="ticker-tape ticker-bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>

        <audio id="radioPlayer" preload="none"></audio>
    </div>

<script>
    // --- COMBINED GENIE & REVERSE EXIT ANIMATION LOGIC ---
    document.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById('page-transition-overlay');
        requestAnimationFrame(() => overlay.classList.add('loaded'));

        // Trigger entrance genie immediately
        setTimeout(() => {
            document.getElementById('app-container').classList.remove('genie-state');
        }, 50);

        document.querySelectorAll('.internal-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                // Phase 1: Internal UI elements fade/slide out quickly
                document.body.classList.add('is-exiting'); 
                
                // Phase 2: The entire container sucks down into the dock
                setTimeout(() => {
                    document.getElementById('app-container').classList.add('genie-state');
                }, 350); 
                
                // Phase 3: Redirect to the desktop
                setTimeout(() => window.location.assign('/'), 850); 
            });
        });
    });

    window.addEventListener('pageshow', (e) => { 
        if (e.persisted) {
            document.body.classList.remove('is-exiting');
            document.getElementById('page-transition-overlay').classList.add('loaded');
            document.getElementById('app-container').classList.remove('genie-state');
        }
    });

    const STREAM_BASE = "https://stream.cuceu.co.uk";
    function updateClock() {
        const now = new Date();
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        let h = now.getHours() % 12 || 12; 
        let m = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
        document.getElementById('mac-clock').innerText = `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][now.getDay()]} ${h}:${m} ${ampm}`;
    }
    updateClock(); setInterval(updateClock, 1000);

    const btn = document.getElementById("btn"), player = document.getElementById("radioPlayer"),
          centerStatus = document.getElementById("center-status"), pulseIndicator = document.getElementById("pulse-indicator"),
          historyList = document.getElementById("history-list"), historyToggle = document.getElementById("history-toggle"),
          topMarquee = document.getElementById("top-marquee"), bottomMarquee = document.getElementById("bottom-marquee"),
          bouncingContainer = document.getElementById("bouncing-container");

    let playing = false, isOnline = false, currentTrackText = "", currentTitle = ""; 
    let artX = 50, artY = 150, artDX = 1.8, artDY = 1.8, isBouncing = false;
    const baseSpeed = 1.8;

    // --- DRAG LOGIC ---
    let isDragging = false, lastX = 0, lastY = 0, lastTime = 0;

    function startDrag(e) {
        if(e.type === 'touchstart') e.preventDefault(); 
        isDragging = true;
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        lastX = clientX; lastY = clientY; lastTime = performance.now();
        artDX = 0; artDY = 0; 
    }

    function moveDrag(e) {
        if (!isDragging) return;
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let currentTime = performance.now();
        let dt = currentTime - lastTime || 1;

        let dx = clientX - lastX; let dy = clientY - lastY;
        artX += dx; artY += dy;

        const rect = bouncingContainer.getBoundingClientRect();
        const bX = window.innerWidth - rect.width, bYMax = window.innerHeight - rect.height - 60, bYMin = 60;
        artX = Math.max(0, Math.min(artX, bX)); artY = Math.max(bYMin, Math.min(artY, bYMax));

        bouncingContainer.style.transform = `translate(${artX}px, ${artY}px)`;
        artDX = (dx / dt) * 16; artDY = (dy / dt) * 16;
        lastX = clientX; lastY = clientY; lastTime = currentTime;
    }

    function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        artDX = Math.max(-25, Math.min(artDX, 25)); artDY = Math.max(-25, Math.min(artDY, 25));
        if (Math.abs(artDX) < baseSpeed) artDX = artDX >= 0 ? baseSpeed : -baseSpeed;
        if (Math.abs(artDY) < baseSpeed) artDY = artDY >= 0 ? baseSpeed : -baseSpeed;
        if (!isBouncing) { isBouncing = true; animateBounce(); }
    }

    bouncingContainer.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);
    bouncingContainer.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', moveDrag, {passive: false});
    window.addEventListener('touchend', endDrag);

    // --- SHAKE TO BOUNCE LOGIC ---
    let motionRequested = false;
    let lastShakeTime = 0;
    const shakeThreshold = 15;

    function handleMotion(event) {
        let acc = event.acceleration || event.accelerationIncludingGravity;
        if (!acc) return;
        let totalForce = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
        if (totalForce > shakeThreshold) {
            let now = performance.now();
            if (now - lastShakeTime > 200) { 
                lastShakeTime = now;
                artDX = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 15);
                artDY = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 15);
                if (!isBouncing) { isBouncing = true; animateBounce(); }
            }
        }
    }

    function requestMotionPermission() {
        if (motionRequested) return;
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                        motionRequested = true;
                    }
                }).catch(console.error);
        } else {
            window.addEventListener('devicemotion', handleMotion);
            motionRequested = true;
        }
    }

    function animateBounce() {
        if (!isBouncing || isDragging) return;
        const rect = bouncingContainer.getBoundingClientRect();
        const topB = 60, bottomB = 60; 
        const bX = window.innerWidth - rect.width, bYMax = window.innerHeight - rect.height - bottomB, bYMin = topB;
        
        let speedX = Math.abs(artDX); let speedY = Math.abs(artDY);
        if (speedX > baseSpeed) { artDX *= 0.98; if (Math.abs(artDX) < baseSpeed) artDX = Math.sign(artDX) * baseSpeed; }
        if (speedY > baseSpeed) { artDY *= 0.98; if (Math.abs(artDY) < baseSpeed) artDY = Math.sign(artDY) * baseSpeed; }

        artX += artDX; artY += artDY;
        
        if (artX <= 0) { artX = 0; artDX *= -1; }
        else if (artX >= bX) { artX = bX; artDX *= -1; }
        if (artY <= bYMin) { artY = bYMin; artDY *= -1; }
        else if (artY >= bYMax) { artY = bYMax; artDY *= -1; }
        
        bouncingContainer.style.transform = `translate(${artX}px, ${artY}px)`;
        requestAnimationFrame(animateBounce); 
    }

    let currentArtUrl = "", currentLayer = 1;
    async function fetchArtwork() {
        try {
            const res = await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now());
            const cleanUrl = (await res.text()).trim();
            if (cleanUrl && cleanUrl.startsWith('http') && currentArtUrl !== cleanUrl) {
                currentArtUrl = cleanUrl;
                const nextL = document.getElementById(`art-layer-${currentLayer === 1 ? 2 : 1}`);
                const oldL = document.getElementById(`art-layer-${currentLayer}`);
                
                nextL.src = cleanUrl;
                nextL.onload = () => { 
                    nextL.style.zIndex = "2"; oldL.style.zIndex = "1";
                    nextL.classList.add('active'); 
                    setTimeout(() => { oldL.classList.remove('active'); }, 1500);
                    currentLayer = currentLayer === 1 ? 2 : 1; 
                    if (!isBouncing) { isBouncing = true; animateBounce(); } 
                };
            }
        } catch(e) {}
    }

    historyToggle.onclick = () => { historyList.classList.toggle("open"); document.getElementById("arrow").innerText = historyList.classList.contains("open") ? "▲" : "▼"; };
    async function directFetch(url) { const res = await fetch(url + "?t=" + Date.now()); return await res.json(); }
    async function fetchGlobalHistory() { try { const data = await directFetch(`${STREAM_BASE}/history.json`); if (data) { historyList.innerHTML = data.filter(t => t).map(track => `<li class="history-item">${track}</li>`).join(''); } } catch(e) {} }

    function updateTicker(base) {
        if (currentTrackText === base) return; currentTrackText = base;
        const content = Array(10).fill(`<span class="song-display">${base}</span>`).join('');
        [topMarquee, bottomMarquee].forEach(m => { 
            m.style.opacity = 0; 
            setTimeout(() => { 
                m.innerHTML = content + content; m.style.animationDuration = `${(base.length + 10) * 1.5}s`; m.style.opacity = 1; 
            }, 500); 
        });
    }

    function setStatus(text, dot) { centerStatus.innerText = text; pulseIndicator.className = "pulse-dot " + dot; }

    async function fetchSongData() {
        try {
            const data = await directFetch(`${STREAM_BASE}/status-json.xsl`);
            let s = data.icestats.source; if (!s) throw new Error();
            isOnline = true; let t = Array.isArray(s) ? (s[0].title || "ON AIR") : (s.title || "ON AIR");
            if (!playing) setStatus("LIVE", "live");
            if (t !== currentTitle) { currentTitle = t; fetchGlobalHistory(); fetchArtwork(); }
            updateTicker(`NOW PLAYING: ${t}`);
        } catch (e) { isOnline = false; if (!playing) { setStatus("OFFLINE", ""); updateTicker("STANDBY"); } }
    }

    btn.onclick = () => {
        requestMotionPermission();
        if (!playing) { player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`; player.play(); btn.innerText = "⏸ Disconnect"; setStatus("CONNECTING...", ""); }
        else { player.pause(); player.src = ""; btn.innerText = "▶ Listen"; setStatus(isOnline ? "LIVE" : "OFFLINE", isOnline ? "live" : ""); }
        playing = !playing;
    };

    player.onplaying = () => { if (playing) setStatus("ON AIR", "on-air"); };
    fetchGlobalHistory(); fetchArtwork(); updateTicker("STANDBY"); fetchSongData(); setInterval(fetchSongData, 4000);
</script>
</body>
</html>
