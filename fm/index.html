<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #app-wrapper {
            width: 100%; height: 100%; position: relative;
            animation: continuityGlide 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes continuityGlide {
            0% { opacity: 0; transform: translateY(-5vh); } 100% { opacity: 1; transform: translateY(0); }
        }
        .status-area {
            position: absolute; top: 75px; right: 30px; display: flex; align-items: center;
            font-size: 16px; font-weight: 800; text-transform: uppercase; color: #000000; z-index: 100;
        }
        .ticker-tape {
            position: absolute; width: 100%; background: #000; color: #ffffff; overflow: hidden;
            padding: 12px 0; border-top: 4px solid #000; border-bottom: 4px solid #000;
            z-index: 10; display: flex;
        }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        
        /* Added transition to the marquee wrapper for smooth fading */
        .marquee-wrapper { 
            display: flex; white-space: nowrap; 
            animation: marquee linear infinite; 
            width: fit-content; 
            transition: opacity 0.5s ease-in-out;
        }
        .song-display {
            font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            padding-right: 80px;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        
        .main-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; padding: 0 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 {
            font-size: clamp(4rem, 16vw, 18rem); font-weight: 900;
            text-transform: uppercase; letter-spacing: -5px; margin: 0;
            -webkit-text-stroke: 4px #000; 
        }
        .fm-text { font-size: 0.5em; text-transform: lowercase; -webkit-text-stroke: 0px; }
        .live-status {
            font-size: clamp(1rem, 3vw, 1.5rem); text-transform: uppercase; letter-spacing: 3px;
            font-weight: 800; margin-top: 15px; margin-bottom: 30px;
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
        }
        
        /* Added transition to the text for smooth status changes */
        #center-status {
            transition: opacity 0.3s ease-in-out;
        }
        
        .pulse-dot { height: 12px; width: 12px; background-color: #777; border-radius: 50%; transition: background-color 0.3s ease; }
        .pulse-dot.live { background-color: #34c759; }
        .pulse-dot.on-air { background-color: #ff3b30; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        
        #btn {
            background-color: #000; color: #fff; border: 4px solid #000; padding: 20px 40px;
            font-size: 1.2rem; text-transform: uppercase; font-weight: 800; letter-spacing: 3px;
            cursor: pointer; box-shadow: 8px 8px 0 #d3d3d3; transition: all 0.2s ease; margin-bottom: 30px;
        }
        
        /* --- NEW ELEGANT FLOATING DROPDOWN --- */
        .history-wrapper {
            position: relative;
            width: 360px;
            z-index: 50;
        }
        #history-toggle {
            width: 100%; background: #fff; color: #000; border: 4px solid #000; padding: 12px;
            font-size: 0.85rem; font-weight: 900; text-transform: uppercase;
            cursor: pointer; box-shadow: 6px 6px 0 #d3d3d3;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        #history-toggle:hover {
            background: #f4f4f4;
        }
        #history-list { 
            position: absolute; top: calc(100% + 8px); left: 0; width: 100%;
            background: #fff; border: 4px solid #000; padding: 0 12px; margin: 0; list-style: none;
            box-shadow: 6px 6px 0 #d3d3d3; box-sizing: border-box;
            
            /* The magic smooth slide/fade setup */
            max-height: 0; opacity: 0; overflow: hidden; pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #history-list.open {
            max-height: 350px; opacity: 1; padding: 12px; pointer-events: auto;
            transform: translateY(0); overflow-y: auto;
        }
        .history-item { 
            padding: 12px 0; font-size: 0.85rem; font-weight: 900; 
            text-transform: uppercase; border-bottom: 1px solid #eee; color: #000;
            text-align: left;
        }
        .history-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div class="ticker-tape ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>
        <div class="status-area"><span id="mac-clock">00:00 AM</span></div>
        <div class="main-container">
            <h1>CUCEU<span class="fm-text">.fm</span></h1>
            
            <div class="live-status">
                <div class="pulse-dot" id="pulse-indicator"></div> 
                <span id="center-status">CHECKING...</span>
            </div>
            
            <button id="btn">▶ Listen</button>
            
            <div class="history-wrapper">
                <div id="history-toggle">Recently Played <span>▼</span></div>
                <ul id="history-list">
                    <li class="history-item" style="border:none; text-align:center; color:#ccc;">Loading history...</li>
                </ul>
            </div>
            
        </div>
        <div class="ticker-tape ticker-bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>
    </div>
    <audio id="radioPlayer" preload="none"></audio>

<script>
    const STREAM_BASE = "https://stream.cuceu.co.uk";
    
    function updateClock() {
        const now = new Date();
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        let hours = now.getHours() % 12 || 12; 
        let minutes = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
        document.getElementById('mac-clock').innerText = `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][now.getDay()]} ${hours}:${minutes} ${ampm}`;
    }
    updateClock(); setInterval(updateClock, 1000);

    const btn = document.getElementById("btn"), player = document.getElementById("radioPlayer"),
          centerStatus = document.getElementById("center-status"), pulseIndicator = document.getElementById("pulse-indicator"),
          historyList = document.getElementById("history-list"), historyToggle = document.getElementById("history-toggle"),
          topMarquee = document.getElementById("top-marquee"), bottomMarquee = document.getElementById("bottom-marquee");
    
    let playing = false, isOnline = false, currentTrackText = "", currentTitle = ""; 

    // Dropdown Logic
    historyToggle.onclick = () => {
        historyList.classList.toggle("open");
        historyToggle.querySelector("span").innerText = historyList.classList.contains("open") ? "▲" : "▼";
    };

    async function directFetch(url) {
        const response = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("Direct fetch failed");
        return await response.json();
    }

    async function fetchGlobalHistory() {
        try {
            const data = await directFetch(`${STREAM_BASE}/history.json`);
            if (data && Array.isArray(data)) {
                const cleanData = data.filter(t => t && t.trim() !== "");
                if (cleanData.length > 0) {
                    historyList.innerHTML = cleanData.map(track => `<li class="history-item">${track}</li>`).join('');
                }
            }
        } catch(e) {
            console.warn("History not ready yet.");
        }
    }

    // New smooth fading ticker logic
    function updateTicker(baseString) {
        if (currentTrackText === baseString) return;
        currentTrackText = baseString;
        
        const content = Array(10).fill(`<span class="song-display">${baseString}</span>`).join('');
        
        // 1. Fade out the text
        [topMarquee, bottomMarquee].forEach(m => m.style.opacity = 0);
        
        // 2. Wait for fade out to finish, then swap text and fade back in
        setTimeout(() => {
            [topMarquee, bottomMarquee].forEach(m => {
                m.innerHTML = content + content;
                m.style.animationDuration = `${(baseString.length + 10) * 1.5}s`;
                m.style.opacity = 1;
            });
        }, 500); // 500ms matches the CSS transition time
    }

    // New smooth fading status text logic
    function setStatus(text, dotClass) {
        if (centerStatus.innerText === text) return;
        
        centerStatus.style.opacity = 0; // Fade out
        setTimeout(() => {
            centerStatus.innerText = text;
            pulseIndicator.className = "pulse-dot " + dotClass;
            centerStatus.style.opacity = 1; // Fade in
        }, 300); // Quick 300ms fade
    }

    async function fetchSongData() {
        try {
            const data = await directFetch(`${STREAM_BASE}/status-json.xsl`);
            let source = data.icestats ? data.icestats.source : null;
            if (!source) throw new Error("Offline");
            
            isOnline = true;
            let newTitle = Array.isArray(source) ? (source[0].title || "ON AIR") : (source.title || "ON AIR");
            
            if (!playing) { 
                setStatus("LIVE", "live");
            }
            
            if (newTitle !== currentTitle) { 
                currentTitle = newTitle; 
                fetchGlobalHistory(); 
            }
            updateTicker(`NOW PLAYING: ${newTitle}`);
        } catch (e) {
            isOnline = false;
            if (!playing) { 
                setStatus("OFFLINE", "");
                updateTicker("STANDBY");
            }
        }
    }

    btn.onclick = () => {
        if (!playing) {
            player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`; player.play();
            btn.innerText = "⏸ Disconnect"; 
            setStatus("CONNECTING...", "");
        } else {
            player.pause(); player.src = ""; btn.innerText = "▶ Listen";
            setStatus(isOnline ? "LIVE" : "OFFLINE", isOnline ? "live" : "");
        }
        playing = !playing;
    };

    player.onplaying = () => { if (playing) setStatus("ON AIR", "on-air"); };

    // Kickoff
    fetchGlobalHistory();
    updateTicker("STANDBY");
    fetchSongData();
    setInterval(fetchSongData, 3000);
</script>
</body>
</html>
