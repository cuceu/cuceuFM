<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <meta name="description" content="cuceu.fm — Live internet radio. Music, visuals, creative experiments.">
    <meta property="og:title" content="cuceu.fm">
    <meta property="og:description" content="Live internet radio stream with real-time audio visualizer.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        html, body {
            height: 100dvh; overflow: hidden;
        }
        /* The photo IS the page — no aurora wash or grain here */
        body::before, body::after { display: none; }
        body { --page-bg: #fafafa; background: var(--page-bg); }
        body.dark-mode { --page-bg: #000; background: var(--page-bg); }

        /* ── FULL-BLEED CONTAINER ────────────────────── */
        #app-container {
            width: 100vw; height: 100dvh;
            position: relative; overflow: hidden;
            background-color: transparent;
            transition: background-color var(--dur-slow) ease;
        }
        /* DVD + visualizers run on strict black, both themes */
        #app-container.viz-mode { background-color: #000; }
        #viz-canvas { z-index: 2; }

        /* ── TICKERS — always black tape, white type ──── */
        .ticker-tape {
            position: absolute; left: 0; right: 0;
            height: 54px; z-index: 60;
            background: #0c0c0c;
            color: #f4f4f4;
            overflow: hidden; display: flex; align-items: center;
            transition: opacity 1.1s ease;
        }
        body.dark-mode .ticker-tape { border-block: 1px solid rgba(255,255,255,0.14); }
        .ticker-top    { top: 0; }
        .ticker-bottom { bottom: 0; }
        .ticker-top    { transform: translateY(-100%); animation: stIn 0.55s var(--ease-smooth) 0.2s forwards; }
        .ticker-bottom { transform: translateY( 100%); animation: sbIn 0.55s var(--ease-smooth) 0.2s forwards; }
        body.is-exiting .ticker-top    { animation: stOut 0.3s var(--ease-smooth) forwards; }
        body.is-exiting .ticker-bottom { animation: sbOut 0.3s var(--ease-smooth) forwards; }
        @keyframes stIn  { to{transform:translateY(0)} }
        @keyframes sbIn  { to{transform:translateY(0)} }
        @keyframes stOut { to{transform:translateY(-100%)} }
        @keyframes sbOut { to{transform:translateY( 100%)} }
        .marquee-wrapper { display:flex; white-space:nowrap; align-items:center; width:fit-content; animation:tickerScroll linear infinite; transition: opacity 0.4s ease; }
        @keyframes tickerScroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
        /* Track-change roll: composes with tickerScroll (opacity/blur only) */
        @keyframes trackRoll {
            0%   { opacity: 0; filter: blur(10px); }
            100% { opacity: 1; filter: blur(0); }
        }
        .ticker-item  { display:inline-flex; align-items:center; }
        .ticker-art   {
            height:38px; width:38px; object-fit:cover; margin:0 22px; border-radius:5px; opacity:0;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.25);
            transition: opacity 0.4s ease, width 0.5s var(--ease-spring), margin 0.5s var(--ease-spring);
        }
        .ticker-art.has-art { opacity:1; }
        body.is-dvd .ticker-art { opacity: 0; width: 0; margin: 0; }
        .song-display { font-size:1.25rem; font-weight:900; text-transform:uppercase; letter-spacing:3.5px; padding:0 10px; }

        /* ── NAV ─────────────────────────────────────── */
        .top-nav-bar {
            position: absolute; top: 62px; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 26px; z-index: 50;
            transition: opacity 1.1s var(--ease-smooth);
        }
        /* Mockup-style outlined BACK box */
        .top-nav-bar .back-pill {
            background: var(--page-bg); border: 1.5px solid var(--c-text);
            color: var(--c-text); border-radius: 4px;
            padding: 8px 16px; font-size: 10px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            box-shadow: none; backdrop-filter: none;
        }
        .top-nav-bar .back-pill:hover { background: var(--c-text); color: var(--page-bg); }
        body.viz-active .top-nav-bar .back-pill { background: transparent; border-color: #e8e8e8; color: #e8e8e8; }
        body.viz-active .top-nav-bar .back-pill:hover { background: #e8e8e8; color: #000; }
        body.viz-active .cuceu-clock { color: #f4ede3; text-shadow: 0 0 8px rgba(0,0,0,0.5); }
        body.viz-active .theme-toggle { color: #f4ede3; }
        .nav-right { display: flex; align-items: center; gap: 12px; position: relative; }

        /* ── PHOTO STAGE (clean mode) ─────────────────── */
        #photo-stage {
            position: absolute; inset: 54px 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
            transition: opacity 0.9s ease;
        }
        body.viz-active #photo-stage { opacity: 0; pointer-events: none; }
        .photo-frame {
            position: relative;
            width: min(960px, 94vw, calc((100dvh - 150px) * 1.1));
            container-type: inline-size;
        }
        .stage-photo {
            display: block; width: 100%; height: auto;
            user-select: none; pointer-events: none;
            transition: filter var(--dur-slow) ease;
        }
        body.dark-mode .stage-photo { filter: invert(1) contrast(0.96); }
        /* Soft vignette blends photo edges into the page background */
        .photo-frame::after {
            content: ''; position: absolute; inset: -2px;
            box-shadow: inset 0 0 46px 34px var(--page-bg);
            pointer-events: none;
            transition: box-shadow var(--dur-slow) ease;
        }

        /* Logo sprayed onto the shutter */
        .stage-logo {
            position: absolute; left: 50%; top: 36%;
            transform: translate(-50%, -50%);
            width: 44%; z-index: 3;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; pointer-events: none;
        }
        .logo-row { display: flex; align-items: flex-end; justify-content: center; width: 100%; }
        .cuceu-logo-img {
            width: 82%; height: auto;
            filter: drop-shadow(0 3px 10px rgba(0,0,0,0.18));
        }
        .fm-text {
            font-size: clamp(15px, 6.2cqw, 60px);
            font-weight: 900; letter-spacing: -2px; color: var(--c-text);
            padding-bottom: clamp(2px, 0.8cqw, 8px); margin-left: -2%;
            transition: color var(--dur-slow) ease;
        }
        .stage-live {
            display: flex; align-items: center; gap: clamp(6px, 1cqw, 10px);
            margin-top: clamp(8px, 1.6cqw, 18px);
            font-size: clamp(11px, 1.8cqw, 17px);
            font-weight: 900; letter-spacing: 5px; text-transform: uppercase;
            color: var(--c-text);
            transition: color var(--dur-slow) ease;
        }
        .stage-live .aero-dot {
            width: clamp(9px, 1.5cqw, 13px); height: clamp(9px, 1.5cqw, 13px);
            animation: aero-pulse 1.6s ease-in-out infinite;
        }
        .stage-live .aero-dot.buffering { animation: aero-blink 0.8s infinite alternate; }

        /* Controls under the windowsill */
        .stage-controls {
            position: absolute; left: 50%; top: 61%;
            transform: translateX(-50%); z-index: 4;
            display: flex; flex-direction: column; align-items: center;
            gap: 11px; width: max-content; max-width: 92vw;
        }
        .listen-btn {
            display: none; align-items: center; gap: 10px;
            background: #0c0c0c; color: #fff;
            border: 1.5px solid #0c0c0c; border-radius: 4px;
            padding: 13px 42px;
            font-family: var(--font-primary);
            font-size: 11px; font-weight: 900; letter-spacing: 3.5px; text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, color 0.25s, transform 0.25s var(--ease-spring);
        }
        .listen-btn.show { display: inline-flex; animation: aero-pop-in 0.5s var(--ease-spring) both; }
        .listen-btn:hover { transform: scale(1.04); }
        .listen-btn:active { transform: scale(0.97); }
        body.dark-mode .listen-btn { background: #f4f4f4; color: #000; border-color: #f4f4f4; }

        .stage-volume {
            display: flex; align-items: center; gap: 9px;
            width: 170px;
            opacity: 0; pointer-events: none; transform: translateY(-4px);
            transition: opacity 0.5s ease, transform 0.5s var(--ease-spring);
            color: var(--c-text);
        }
        body.is-playing .stage-volume { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .stage-volume svg { flex-shrink: 0; opacity: 0.7; }
        .stage-volume input[type="range"] {
            flex: 1; min-width: 0; height: 3px;
            accent-color: var(--c-text);
            cursor: pointer;
        }

        .recent-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--page-bg); color: var(--c-text);
            border: 1.5px solid var(--c-text); border-radius: 4px;
            padding: 9px 20px;
            font-family: var(--font-primary);
            font-size: 9px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        .recent-btn:hover { background: var(--c-text); color: var(--page-bg); }
        .recent-btn .chev { transition: transform 0.4s var(--ease-spring); font-size: 8px; }
        .stage-controls.recent-open .recent-btn .chev { transform: rotate(180deg); }

        .recent-wrap {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.55s var(--ease-spring);
            width: min(380px, 88vw);
        }
        .stage-controls.recent-open .recent-wrap { grid-template-rows: 1fr; }
        .recent-panel { min-height: 0; overflow: hidden; }
        .recent-inner {
            background: var(--page-bg);
            border: 1.5px solid var(--c-text); border-radius: 6px;
            padding: 10px 14px; max-height: 190px; overflow-y: auto;
        }
        #history-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
        .history-item {
            display: flex; align-items: baseline; gap: 10px;
            font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--c-text-muted);
            padding: 7px 2px;
            border-bottom: 1px solid rgba(128,128,128,0.18);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: color 0.3s;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item:hover { color: var(--c-amber); }
        .history-num { font-size: 8px; font-weight: 900; color: var(--c-amber); flex-shrink: 0; }

        /* ── VIZ CLUSTER (DVD + Aurora) ───────────────── */
        #viz-cluster {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            opacity: 0; visibility: hidden;
            transition: opacity 0.9s ease, visibility 0.9s;
        }
        body.viz-active #viz-cluster { opacity: 1; visibility: visible; }

        .viz-logo {
            position: absolute; left: 50%; top: 21%;
            transform: translate(-50%, -50%);
            display: flex; align-items: flex-end;
            transition: top 1.15s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 1.15s ease,
                        transform 1.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .viz-logo img { height: clamp(54px, 11vw, 86px); width: auto;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6)); }
        .viz-logo .fm-viz {
            font-size: clamp(19px, 4vw, 38px); font-weight: 900; letter-spacing: -2px;
            color: #fff; padding-bottom: 4px; margin-left: -8px;
        }
        /* AOD: logo descends to center and dims — like the iPhone always-on display */
        body.ui-idle .viz-logo {
            top: 46%;
            opacity: 0.45;
            transform: translate(-50%, -50%) scale(0.92);
        }

        .viz-now {
            position: absolute; bottom: 132px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; gap: 12px;
            width: min(330px, 82vw); height: 60px;
            padding: 8px 14px 8px 8px; box-sizing: border-box;
            background: rgba(14, 14, 14, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            pointer-events: auto;
            overflow: hidden;
            transition: width 1.05s cubic-bezier(0.4, 0, 0.2, 1),
                        height 1.05s cubic-bezier(0.4, 0, 0.2, 1),
                        bottom 1.05s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 1.05s cubic-bezier(0.4, 0, 0.2, 1),
                        background 1.05s ease, border-color 1.05s ease;
        }
        #now-art {
            width: 44px; height: 44px; flex-shrink: 0;
            border-radius: 50%; object-fit: cover;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
            transition: width 1.05s cubic-bezier(0.4, 0, 0.2, 1), height 1.05s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #now-art.swap { animation: artPop 0.7s var(--ease-spring); }
        @keyframes artPop { 0% { scale: 0.55; } 60% { scale: 1.12; } 100% { scale: 1; } }
        .now-meta {
            display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1;
            transition: opacity 0.6s ease;
        }
        #now-title {
            font-size: 11.5px; font-weight: 800; letter-spacing: 0.6px; color: #f4f4f4;
            text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .now-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 8px; font-weight: 800; letter-spacing: 2px; color: #999;
            text-transform: uppercase;
        }
        .now-status .aero-dot { width: 6px; height: 6px; animation: aero-pulse 1.6s ease-in-out infinite; }
        .now-status .aero-dot.buffering { animation: aero-blink 0.8s infinite alternate; }
        .viz-play {
            width: 34px; height: 34px; flex-shrink: 0;
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff;
            transition: background 0.3s, opacity 0.6s ease;
        }
        .viz-play:hover { background: rgba(255,255,255,0.22); }
        .viz-play svg { width: 12px; height: 12px; fill: currentColor; }
        /* AOD: now-playing shrinks into a breathing circle.
           Art keeps its left slot and ends up centered as the pill
           collapses around it — no layout jump. */
        body.ui-idle .viz-now {
            width: 64px; height: 64px; bottom: 33%;
            padding: 0 7px; gap: 0;
            background: rgba(8, 8, 8, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
            animation: aodBreathe 5.5s ease-in-out 1.2s infinite;
        }
        body.ui-idle #now-art { width: 50px; height: 50px; }
        body.ui-idle .now-meta, body.ui-idle .viz-play {
            opacity: 0; pointer-events: none;
            position: absolute; top: 50%; translate: 0 -50%;
            transition: opacity 0.3s ease;
        }
        body.ui-idle .now-meta { left: 70px; width: 200px; }
        body.ui-idle .viz-play { right: 14px; }
        @keyframes aodBreathe {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%      { transform: translateX(-50%) scale(1.05); }
        }

        /* ── BACKGROUND MODES (DVD) ──────────────────── */
        #bg-layer {
            position: absolute; inset: 0; z-index: 1;
            pointer-events: none; overflow: hidden;
        }
        #dvd-box {
            position: absolute; top: 0; left: 0;
            width: clamp(120px, 22vw, 220px);
            opacity: 0;
            transition: opacity 0.8s ease;
            will-change: transform;
            border-radius: 8px;
        }
        #bg-layer.mode-dvd #dvd-box { opacity: 1; }
        #dvd-artwork { display: block; width: 100%; height: auto; border-radius: 8px; }
        .dvd-tint {
            position: absolute; inset: 0; border-radius: 8px;
            mix-blend-mode: color; opacity: 0.45;
            pointer-events: none;
            transition: background 0.15s ease;
        }
        #dvd-box.corner-pop { animation: dvdPop 0.7s var(--ease-spring); }
        @keyframes dvdPop {
            0% { scale: 1; } 35% { scale: 1.18; } 100% { scale: 1; }
        }
        .dvd-burst {
            position: absolute; inset: -30%;
            border: 3px solid var(--c-amber-hot); border-radius: 50%;
            opacity: 0; pointer-events: none;
            transform: scale(0.4);
        }
        .dvd-burst.go { animation: dvdBurst 0.7s var(--ease-smooth) forwards; }
        @keyframes dvdBurst {
            0%   { opacity: 0.9; transform: scale(0.4); }
            100% { opacity: 0;   transform: scale(1.6); }
        }
        .dvd-badge {
            position: absolute; top: -10px; right: -10px;
            min-width: 22px; height: 22px; padding: 0 6px;
            border-radius: 11px; background: #0c0c0c;
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff; font-size: 11px; font-weight: 900;
            display: none; align-items: center; justify-content: center;
        }
        .dvd-badge.show { display: flex; }

        /* ── MODE DOCK — monochrome ──────────────────── */
        .mode-dock-wrap {
            position: absolute; bottom: 70px; left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            max-width: calc(100vw - 32px);
            transition: opacity 1.1s var(--ease-smooth);
        }
        /* Step aside while the recently-played drawer is open */
        body:has(.recent-open) .mode-dock-wrap { opacity: 0; pointer-events: none; transition-duration: 0.35s; }
        .mode-toggle {
            display: flex; gap: 0;
            border-radius: var(--r-pill); padding: 4px;
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            max-width: 100%;
            flex-wrap: nowrap;
            transition: background 0.6s ease, border-color 0.6s ease;
        }
        .mode-toggle::-webkit-scrollbar { display: none; }
        body.dark-mode .mode-toggle,
        body.viz-active .mode-toggle {
            background: rgba(10, 10, 10, 0.7);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .mode-btn {
            background: transparent; border: none;
            padding: 8px 18px; font-size: 9px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            color: #777; cursor: pointer;
            border-radius: var(--r-pill); white-space: nowrap;
            flex-shrink: 0;
            font-family: var(--font-primary);
            transition: color 0.3s, background 0.3s var(--ease-spring);
        }
        .mode-btn:hover { color: var(--c-text); }
        body.dark-mode .mode-btn:hover, body.viz-active .mode-btn:hover { color: #f4f4f4; }
        .mode-btn.active { background: #0c0c0c; color: #fff; }
        body.dark-mode .mode-btn.active,
        body.viz-active .mode-btn.active { background: #f4f4f4; color: #000; }

        .viz-settings-btn {
            background: transparent; border: none; color: #888;
            cursor: pointer;
            border-radius: 50%; opacity: 0; pointer-events: none;
            width: 0; padding: 0; transition: width 0.3s, opacity 0.3s, padding 0.3s, color 0.3s;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        body[data-active-mode="aurora"] .viz-settings-btn {
            width: 30px; padding: 4px; opacity: 1; pointer-events: auto; margin-left: 2px;
        }
        .viz-settings-btn:hover { color: #fff; }

        .viz-settings-popup {
            position: absolute; bottom: calc(100% + 12px); right: 0;
            border-radius: var(--r-lg);
            padding: 16px; display: flex; flex-direction: column; gap: 6px;
            opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.95);
            transition: opacity 0.3s var(--ease-spring), transform 0.3s var(--ease-spring);
            width: 210px; transform-origin: bottom right;
            max-height: min(420px, calc(100dvh - 220px)); overflow-y: auto;
            background: rgba(10, 10, 10, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .viz-settings-popup.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        .viz-set-section {
            color: rgba(255,255,255,0.55); font-size: 9px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding: 8px 0 6px; margin-bottom: 4px;
        }
        .viz-set-section:first-child { padding-top: 0; }
        .viz-set-row {
            display: flex; flex-direction: column; gap: 6px; padding: 4px 0;
            color: rgba(244, 237, 227, 0.6);
            font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
        }
        .viz-set-range { width: 100%; height: 4px; }
        .viz-set-select {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            color: #f4f4f4; padding: 5px; border-radius: 6px; outline: none;
            font-size: 8px; font-weight: 800; text-transform: uppercase;
            cursor: pointer; font-family: var(--font-primary);
        }
        .viz-set-select option { background: #111; color: #f4f4f4; }
        .viz-set-reset {
            margin-top: 8px; padding: 6px;
            background: transparent; border: 1px solid rgba(255,255,255,0.25);
            border-radius: var(--r-pill); color: #e8e8e8;
            font-size: 8px; font-weight: 900; letter-spacing: 2px; cursor: pointer;
            font-family: var(--font-primary);
            transition: background 0.3s, color 0.3s;
        }
        .viz-set-reset:hover { background: #fff; color: #000; }

        /* ── AOD IDLE (viz modes) ─────────────────────── */
        body.viz-active.ui-idle .top-nav-bar,
        body.viz-active.ui-idle .mode-dock-wrap {
            opacity: 0; pointer-events: none;
        }
        body.viz-active.ui-idle .ticker-tape { opacity: 0.15; }

        /* ── MOBILE ──────────────────────────────────── */
        @media (max-width: 600px) {
            .top-nav-bar  { top:48px; padding:10px 14px; }
            .ticker-tape  { height:48px; }
            #photo-stage  { inset: 48px 0; }
            .song-display { font-size:1.05rem; letter-spacing:2.5px; }
            .ticker-art   { height:32px; width:32px; margin: 0 16px; }
            .stage-live   { letter-spacing: 3.5px; }
            .listen-btn   { padding: 12px 30px; font-size: 10px; letter-spacing: 3px; }
            .stage-controls { gap: 9px; top: 60%; }
            .mode-dock-wrap { bottom: 60px; }
            .mode-btn     { padding: 7px 13px; font-size: 8px; letter-spacing: 1.5px; }
            .viz-now      { bottom: 118px; width: min(300px, 84vw); }
            #dvd-box      { width: clamp(100px, 30vw, 160px); }
        }
    </style>
</head>
<body>

<script src="../shared.js"></script>
<script src="viz-core.js"></script>
<script src="visualizers.js"></script>
<script>
// Redirect to wrapper if loaded directly
if (window === window.parent) {
    window.location.replace('/?path=' + window.location.pathname);
}

// ── THEME TOGGLE (shared.js; visualizers run on black in both themes) ──
CuceuTheme.bindToggle(document.getElementById('direct-theme-toggle'));

// ── STREAM ────────────────────────────────────────────────────
const STREAM_BASE    = "https://stream.cuceu.co.uk";
// Use the global wrapper player if available, else fall back to the local element
const isWrapper      = window !== window.parent && window.parent.CuceuGlobalPlayer;
const player         = isWrapper ? window.parent.CuceuGlobalPlayer.getAudioElement() : document.getElementById('radioPlayer');

// FM page has its own controls — hide the wrapper mini player here
if (isWrapper) {
    window.parent.CuceuGlobalPlayer.hideMiniPlayer();
}

const listenBtn       = document.getElementById('btn');
const vizPlayBtn      = document.getElementById('viz-play');
const stageStatusText = document.getElementById('stage-status-text');
const stageDot        = document.getElementById('stage-dot');
const nowStatusText   = document.getElementById('now-status-text');
const nowDot          = document.getElementById('now-dot');
const nowTitle        = document.getElementById('now-title');
const nowArt          = document.getElementById('now-art');
const stageControls   = document.getElementById('stage-controls');
const historyList     = document.getElementById('history-list');
const historyToggle   = document.getElementById('history-toggle');
const topMarquee      = document.getElementById('top-marquee');
const bottomMarquee   = document.getElementById('bottom-marquee');
let playing = false, isOnline = false, currentTitle = '', currentArtUrl = '', currentTickerBase = '';

const DOT_COLORS = {
    live: '#4ade80', buffering: '#ffcc00', 'on-air': '#f0913c',
    offline: '#777777', checking: '#9a9a9a'
};
function setStatus(text, kind) {
    const color = DOT_COLORS[kind] || DOT_COLORS.checking;
    stageStatusText.textContent = text;
    stageDot.style.setProperty('--dot-c', color);
    stageDot.classList.toggle('buffering', kind === 'buffering');
    nowStatusText.textContent = text;
    nowDot.style.setProperty('--dot-c', color);
    nowDot.classList.toggle('buffering', kind === 'buffering');
}

// LISTEN only exists while the station is live (or already playing)
function updateListenVisibility() {
    listenBtn.classList.toggle('show', isOnline || playing);
}

function renderPlayState() {
    listenBtn.innerHTML = playing ? '&#10074;&#10074;&nbsp; Pause' : '&#9654;&nbsp; Listen';
    vizPlayBtn.querySelector('.play-icon').style.display = playing ? 'none' : 'block';
    vizPlayBtn.querySelector('.pause-icon').style.display = playing ? 'block' : 'none';
    document.body.classList.toggle('is-playing', playing);
}

function updateTicker(base) {
    const art = currentArtUrl ? `<img class="ticker-art has-art" src="${currentArtUrl}" alt="">` : `<span style="display:inline-block;width:10px"></span>`;
    const item = `<div class="ticker-item"><span class="song-display">${base}</span>${art}</div>`;
    const content = Array(14).fill(item).join('');
    const dur = Math.max(22, base.length * 1.6);
    setTimeout(() => {
        for (const m of [topMarquee, bottomMarquee]) {
            m.innerHTML = content + content;
            // Blur-roll swap composes with the endless scroll
            m.style.animation = `tickerScroll ${dur}s linear infinite, trackRoll 0.8s var(--ease-smooth)`;
        }
        bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s, 0s`;
        setTimeout(() => {
            topMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
            bottomMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
            bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s`;
        }, 900);
    }, 50);
}

// Pop the artwork + roll the tickers when the song changes
function flashTrackSwap() {
    nowArt.classList.remove('swap');
    void nowArt.offsetWidth;
    nowArt.classList.add('swap');
}

historyToggle.addEventListener('click', () => {
    const open = stageControls.classList.toggle('recent-open');
    historyToggle.setAttribute('aria-expanded', String(open));
});

async function fetchGlobalHistory() {
    try {
        const d = await fetch(`${STREAM_BASE}/history.json?t=` + Date.now()).then(r => r.json());
        if (d) historyList.innerHTML = d.filter(Boolean).map((t, i) =>
            `<li class="history-item"><span class="history-num">${String(i + 1).padStart(2, '0')}</span>${t}</li>`).join('');
    } catch(_) {}
}
async function fetchArtwork() {
    try {
        const u = (await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now()).then(r => r.text())).trim();
        if (u && u.startsWith('http')) currentArtUrl = u;
    } catch(_) { currentArtUrl = ''; }
    nowArt.src = currentArtUrl || 'cuceugrta.png';
    if (currentMode === 'dvd') setDvdArt(currentArtUrl || 'cuceugrta.png');
}
async function fetchSongData() {
    try {
        const data = await fetch(`${STREAM_BASE}/status-json.xsl?t=` + Date.now()).then(r => r.json());
        const s = data.icestats.source; if (!s) throw new Error();
        isOnline = true;
        const t = Array.isArray(s) ? (s[0].title || 'ON AIR') : (s.title || 'ON AIR');
        if (!playing) setStatus('LIVE', 'live');
        if (t !== currentTitle) {
            currentTitle = t; fetchGlobalHistory(); await fetchArtwork();
            nowTitle.textContent = t;
            nowTitle.title = t;
            currentTickerBase = `NOW PLAYING: ${t}`;
            updateTicker(currentTickerBase);
            flashTrackSwap();
        }
    } catch(_) {
        isOnline = false;
        if (!playing) {
            setStatus('OFFLINE', 'offline');
            if (currentTickerBase !== 'STANDBY') { currentTickerBase = 'STANDBY'; updateTicker('STANDBY'); }
        }
    }
    updateListenVisibility();
}
player.onwaiting = () => { if (playing) setStatus('BUFFERING', 'buffering'); };
player.onplaying = () => { if (playing) setStatus('ON AIR', 'on-air'); };
player.onpause   = () => { if (isOnline) setStatus('LIVE', 'live'); };

function togglePlay() {
    if (!playing) {
        player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`;
        player.play().catch(() => {});
        setStatus('BUFFERING', 'buffering');
        resumeAudioGraph();
    } else {
        player.pause(); player.src = '';
        setStatus(isOnline ? 'LIVE' : 'OFFLINE', isOnline ? 'live' : 'offline');
    }
    playing = !playing;
    renderPlayState();
    updateListenVisibility();
}
listenBtn.addEventListener('click', togglePlay);
vizPlayBtn.addEventListener('click', togglePlay);

// Volume — persisted across visits
const volumeSlider = document.getElementById('volume-slider');
const savedVolume = CuceuStore.get('cuceu-volume', 0.5);
volumeSlider.value = savedVolume;
player.volume = savedVolume;
volumeSlider.addEventListener('input', (e) => {
    player.volume = e.target.value;
    CuceuStore.set('cuceu-volume', parseFloat(e.target.value));
});

updateTicker('STANDBY'); fetchSongData(); fetchGlobalHistory();
let fetchInterval = setInterval(fetchSongData, 4000);
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        fetchSongData();
        clearInterval(fetchInterval);
        fetchInterval = setInterval(fetchSongData, 4000);
        if (currentMode === 'dvd') resumeDvd();
    } else {
        clearInterval(fetchInterval);
    }
});

// ── AUDIO GRAPH (analyser lives in the wrapper when framed) ──
let localCtx = null, localAnalyser = null;
function ensureLocalAudio() {
    if (localCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    localCtx = new AC();
    localAnalyser = localCtx.createAnalyser();
    localAnalyser.fftSize = 1024;
    localAnalyser.smoothingTimeConstant = 0.8;
    const src = localCtx.createMediaElementSource(player);
    src.connect(localAnalyser);
    localAnalyser.connect(localCtx.destination);
}
function resumeAudioGraph() {
    if (isWrapper) {
        window.parent.CuceuGlobalPlayer.resumeAudioContext();
    } else {
        ensureLocalAudio();
        if (localCtx.state === 'suspended') localCtx.resume();
    }
}

const audioProvider = isWrapper ? {
    getFrequencyData: (a) => window.parent.CuceuGlobalPlayer.getFrequencyData(a),
    getSampleRate: () => window.parent.CuceuGlobalPlayer.getSampleRate(),
    getFrequencyBinCount: () => window.parent.CuceuGlobalPlayer.getFrequencyBinCount()
} : {
    getFrequencyData: (a) => { if (localAnalyser) localAnalyser.getByteFrequencyData(a); },
    getSampleRate: () => localCtx ? localCtx.sampleRate : 44100,
    getFrequencyBinCount: () => localAnalyser ? localAnalyser.frequencyBinCount : 512
};

// ══════════════════════════════════════════════════════════════
// MODE SYSTEM (Clean / DVD / Aurora)
// ══════════════════════════════════════════════════════════════
const bgLayer    = document.getElementById('bg-layer');
const container  = document.getElementById('app-container');
const modeToggle = document.getElementById('mode-toggle');
const modeBtns   = modeToggle.querySelectorAll('.mode-btn');
const ENGINE_MODES  = ['aurora'];           // run on the Three.js engine
const AMBIENT_MODES = ['dvd', 'aurora'];    // dark chrome + AOD idle state
let currentMode = 'clean';

CuceuViz.setup({ container, provider: audioProvider });

const vizSettingsBtn = document.getElementById('viz-settings-btn');
const vizSettingsPopup = document.getElementById('viz-settings-popup');
const vizSettingsMount = document.getElementById('viz-settings-mount');

function setMode(mode) {
    if (mode === currentMode) return;
    stopDvd();
    CuceuViz.stop();

    bgLayer.className = '';
    container.classList.remove('viz-mode');
    currentMode = mode;
    document.body.classList.toggle('is-dvd', mode === 'dvd');
    document.body.classList.toggle('viz-active', AMBIENT_MODES.includes(mode));
    document.body.dataset.activeMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    vizSettingsPopup.classList.remove('visible');
    CuceuStore.set('cuceu-fm-mode', mode);

    if (mode === 'dvd') {
        container.classList.add('viz-mode');
        bgLayer.classList.add('mode-dvd');
        startDvd();
    } else if (ENGINE_MODES.includes(mode)) {
        container.classList.add('viz-mode');
        resumeAudioGraph();
        CuceuViz.start(mode);
        CuceuViz.buildSettingsPanel(mode, vizSettingsMount);
    }
    resetIdleTimer();
}

modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

vizSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    vizSettingsPopup.classList.toggle('visible');
});
document.addEventListener('click', (e) => {
    if (!vizSettingsPopup.contains(e.target) && !vizSettingsBtn.contains(e.target)) {
        vizSettingsPopup.classList.remove('visible');
    }
});

// ── AOD IDLE (DVD + Aurora drift into always-on-display) ────
let idleTimer = null;
function resetIdleTimer() {
    document.body.classList.remove('ui-idle');
    if (idleTimer) clearTimeout(idleTimer);
    if (!AMBIENT_MODES.includes(currentMode)) return;
    idleTimer = setTimeout(() => {
        if (!vizSettingsPopup.classList.contains('visible')) {
            document.body.classList.add('ui-idle');
        }
    }, 4500);
}
['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev =>
    document.addEventListener(ev, resetIdleTimer, { passive: true }));

// ══════════════════════════════════════════════════════════════
// DVD MODE — authentic constant-speed diagonal bounce
// ══════════════════════════════════════════════════════════════
const dvdBox   = document.getElementById('dvd-box');
const dvdArt   = document.getElementById('dvd-artwork');
const dvdTint  = dvdBox.querySelector('.dvd-tint');
const dvdBurst = document.getElementById('dvd-burst');
const dvdBadge = document.getElementById('dvd-badge');
const tickerTopEl = document.querySelector('.ticker-top');
const tickerBottomEl = document.querySelector('.ticker-bottom');

const DVD_TINTS = ['#ffffff', '#ffb066', '#f0913c', '#ffd23f', '#ff5c5c', '#7ce0a3', '#6fb7ff', '#c792ff'];
let dvdAnimId = null, dvdX = 100, dvdY = 100, dvdVx = 0, dvdVy = 0;
let dvdLastT = 0, dvdTintIdx = 0;
let dvdCorners = parseInt(sessionStorage.getItem('cuceu-dvd-corners') || '0', 10);

function dvdBounds() {
    return {
        top: tickerTopEl.offsetHeight,
        bottom: container.clientHeight - tickerBottomEl.offsetHeight,
        left: 0,
        right: container.clientWidth
    };
}

function setDvdArt(url) { dvdArt.src = url; }

function applyDvdTint() {
    dvdTintIdx = (dvdTintIdx + 1) % DVD_TINTS.length;
    const c = DVD_TINTS[dvdTintIdx];
    dvdTint.style.background = c;
    dvdBox.style.filter = `drop-shadow(0 0 16px ${c}80)`;
}

function celebrateCorner() {
    dvdCorners++;
    sessionStorage.setItem('cuceu-dvd-corners', String(dvdCorners));
    dvdBadge.textContent = dvdCorners;
    dvdBadge.classList.add('show');
    dvdBox.classList.remove('corner-pop');
    dvdBurst.classList.remove('go');
    // restart the one-shot animations
    void dvdBox.offsetWidth;
    dvdBox.classList.add('corner-pop');
    dvdBurst.classList.add('go');
}

function initDvdPosition() {
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180;
    const h = dvdBox.offsetHeight || 180;
    dvdX = b.left + Math.random() * Math.max(1, b.right - b.left - w);
    dvdY = b.top + Math.random() * Math.max(1, b.bottom - b.top - h);
    // OG DVD logo: constant speed, perfect 45° diagonals (|vx| = |vy|)
    const speed = (window.innerWidth < 600 ? 120 : 170) / Math.SQRT2;
    dvdVx = (Math.random() < 0.5 ? -1 : 1) * speed;
    dvdVy = (Math.random() < 0.5 ? -1 : 1) * speed;
}

function dvdFrame(now) {
    if (currentMode !== 'dvd') return;
    const dt = Math.min((now - dvdLastT) / 1000, 0.05);
    dvdLastT = now;

    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180;
    const h = dvdBox.offsetHeight || 180;
    dvdX += dvdVx * dt;
    dvdY += dvdVy * dt;

    let hitX = false, hitY = false;
    if (dvdX <= b.left)          { dvdX = b.left;        dvdVx = Math.abs(dvdVx);  hitX = true; }
    if (dvdX + w >= b.right)     { dvdX = b.right - w;   dvdVx = -Math.abs(dvdVx); hitX = true; }
    if (dvdY <= b.top)           { dvdY = b.top;         dvdVy = Math.abs(dvdVy);  hitY = true; }
    if (dvdY + h >= b.bottom)    { dvdY = b.bottom - h;  dvdVy = -Math.abs(dvdVy); hitY = true; }

    if (hitX || hitY) applyDvdTint();
    if (hitX && hitY) celebrateCorner();

    dvdBox.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    dvdAnimId = requestAnimationFrame(dvdFrame);
}

function startDvd() {
    setDvdArt(currentArtUrl || 'cuceugrta.png');
    if (dvdCorners > 0) { dvdBadge.textContent = dvdCorners; dvdBadge.classList.add('show'); }
    const begin = () => { initDvdPosition(); dvdLastT = performance.now(); dvdAnimId = requestAnimationFrame(dvdFrame); };
    if (dvdArt.complete && dvdArt.naturalWidth > 0) begin();
    else dvdArt.onload = begin;
}
function resumeDvd() {
    if (dvdAnimId) cancelAnimationFrame(dvdAnimId);
    dvdLastT = performance.now();
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function stopDvd() {
    if (dvdAnimId) { cancelAnimationFrame(dvdAnimId); dvdAnimId = null; }
}

// Keep the box inside the bounds when the window resizes
new ResizeObserver(() => {
    if (currentMode !== 'dvd') return;
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180;
    const h = dvdBox.offsetHeight || 180;
    dvdX = Math.min(Math.max(dvdX, b.left), b.right - w);
    dvdY = Math.min(Math.max(dvdY, b.top), b.bottom - h);
}).observe(container);

// ── RESTORE LAST MODE (legacy saved modes fall back to clean) ──
const savedMode = CuceuStore.get('cuceu-fm-mode', 'clean');
if (savedMode !== 'clean' && AMBIENT_MODES.includes(savedMode)) {
    setMode(savedMode);
}
renderPlayState();
</script>
