<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* PLAIN WHITE BRUTALIST BACKGROUND */
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #app-wrapper {
            width: 100%; height: 100%; position: relative;
            animation: continuityGlide 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes continuityGlide {
            0% { opacity: 0; transform: translateY(-5vh); } 100% { opacity: 1; transform: translateY(0); }
        }
        .status-area {
            position: absolute; top: 75px; right: 30px; display: flex; align-items: center;
            font-size: 16px; font-weight: 800; text-transform: uppercase; color: #000000; z-index: 100; letter-spacing: 1px;
        }
        .ticker-tape {
            position: absolute; width: 100%; background: #000; color: #ffffff; overflow: hidden;
            padding: 12px 0; border-top: 4px solid #000; border-bottom: 4px solid #000;
            z-index: 10; box-sizing: border-box; display: flex;
        }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        .marquee-wrapper { 
            display: flex; white-space: nowrap; 
            animation: marquee linear infinite; 
            width: fit-content; 
        }
        .song-display {
            font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            padding-right: 40px; transition: opacity 0.75s ease-in-out; opacity: 1;
        }
        .song-display.fade-out { opacity: 0; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        
        .main-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; padding: 0 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 {
            font-size: clamp(4rem, 16vw, 18rem); white-space: nowrap; font-weight: 900;
            text-transform: uppercase; letter-spacing: -5px; margin: 0; color: #000; -webkit-text-stroke: 4px #000;
        }
        .fm-text { font-size: 0.5em; text-transform: lowercase; letter-spacing: -2px; -webkit-text-stroke: 0px; }
        .live-status {
            font-size: clamp(1rem, 3vw, 1.5rem); text-transform: uppercase; letter-spacing: 3px;
            font-weight: 800; margin-top: 15px; margin-bottom: 30px; color: #000;
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
        }
        .pulse-dot { height: 12px; width: 12px; background-color: #777; border-radius: 50%; flex-shrink: 0; }
        .pulse-dot.live { background-color: #34c759; }
        .pulse-dot.on-air { background-color: #ff3b30; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        button {
            background-color: #000; color: #fff; border: 4px solid #000; padding: 20px 40px;
            font-size: 1.2rem; text-transform: uppercase; font-weight: 800; letter-spacing: 3px;
            cursor: pointer; box-shadow: 8px 8px 0 #d3d3d3; transition: all 0.2s ease; margin-bottom: 30px;
        }
        .history-dropdown {
            width: 340px; border: 4px solid #000; background: #fff; text-align: left;
            box-shadow: 6px 6px 0 #d3d3d3; cursor: pointer; z-index: 50;
        }
        summary {
            padding: 12px; font-weight: 900; text-transform: uppercase; font-size: 0.85rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        #history-list { margin: 0; padding: 0 12px 12px 12px; list-style: none; border-top: 4px solid #000; }
        .history-item { padding: 10px 0; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid #eee; }
        .history-item span { color: #000; display: block; margin-top: 3px; font-size: 0.85rem;}
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div class="ticker-tape ticker-top">
            <div class="marquee-wrapper" id="top-marquee"></div>
        </div>
        <div class="status-area"><span id="mac-clock">00:00 AM</span></div>
        <div class="main-container">
            <h1>CUCEU<span class="fm-text">.fm</span></h1>
            <div class="live-status">
                <div class="pulse-dot" id="pulse-indicator"></div> 
                <span id="center-status">CHECKING...</span>
            </div>
            <button id="btn">▶ Listen</button>
            <details class="history-dropdown">
                <summary>Recently Played</summary>
                <ul id="history-list"><li class="history-item" style="border:none; text-align:center; color:#ccc; padding: 20px 0;">No history yet</li></ul>
            </details>
        </div>
        <div class="ticker-tape ticker-bottom">
            <div class="marquee-wrapper" id="bottom-marquee"></div>
        </div>
    </div>
    <audio id="radioPlayer" preload="none"></audio>

<script>
    const STREAM_BASE = "https://stream.cuceu.co.uk";
    
    function updateClock() {
        const now = new Date();
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        let hours = now.getHours() % 12 || 12; 
        let minutes = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
        document.getElementById('mac-clock').innerText = `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][now.getDay()]} ${hours}:${minutes} ${ampm}`;
    }
    updateClock(); setInterval(updateClock, 1000);

    const btn = document.getElementById("btn"), player = document.getElementById("radioPlayer"),
          centerStatus = document.getElementById("center-status"), pulseIndicator = document.getElementById("pulse-indicator"),
          historyList = document.getElementById("history-list"),
          topMarquee = document.getElementById("top-marquee"), bottomMarquee = document.getElementById("bottom-marquee");
    
    let playing = false, isOnline = false, currentTrackText = "", currentTitle = ""; 

    async function smartFetch(url) {
        try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error();
            return await response.json();
        } catch (e) {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
            const res = await fetch(proxyUrl);
            return await res.json();
        }
    }

    async function fetchGlobalHistory() {
        const data = await smartFetch(`${STREAM_BASE}/history.json?t=${Date.now()}`);
        if (data && Array.isArray(data)) {
            const cleanData = data.filter(t => t && t.trim() !== "");
            if (cleanData.length > 0) {
                historyList.innerHTML = cleanData.map(track => `<li class="history-item">Previously <span>${track}</span></li>`).join('');
            }
        }
    }

    function updateTicker(baseString) {
        if (currentTrackText === baseString) return;
        currentTrackText = baseString;
        
        const content = Array(15).fill(`<span class="song-display">${baseString}</span>`).join('');
        
        // Instant visual update
        [topMarquee, bottomMarquee].forEach(m => {
            m.innerHTML = content + content; // Double for seamless loop
            m.style.animationDuration = `${(baseString.length + 10) * 0.4}s`;
        });
    }

    async function fetchSongData() {
        try {
            const data = await smartFetch(`${STREAM_BASE}/status-json.xsl?t=${Date.now()}`);
            let source = data.icestats ? data.icestats.source : null;
            if (!source) throw new Error();
            
            isOnline = true;
            let newTitle = Array.isArray(source) ? (source[0].title || "ON AIR") : (source.title || "ON AIR");
            
            if (!playing) { centerStatus.innerText = "LIVE"; pulseIndicator.className = "pulse-dot live"; }
            if (newTitle !== currentTitle) { currentTitle = newTitle; fetchGlobalHistory(); }
            updateTicker(`NOW PLAYING: ${newTitle}`);
        } catch (e) {
            isOnline = false;
            if (!playing) { 
                centerStatus.innerText = "OFFLINE"; pulseIndicator.className = "pulse-dot"; 
                updateTicker("STANDBY");
            }
        }
    }

    btn.onclick = () => {
        if (!playing) {
            player.src = `${STREAM_BASE}/stream.mp3`; player.play();
            btn.innerText = "⏸ Disconnect"; centerStatus.innerText = "CONNECTING...";
        } else {
            player.pause(); player.src = ""; btn.innerText = "▶ Listen";
            centerStatus.innerText = isOnline ? "LIVE" : "OFFLINE";
            pulseIndicator.className = isOnline ? "pulse-dot live" : "pulse-dot";
        }
        playing = !playing;
    };

    player.onplaying = () => { if (playing) { centerStatus.innerText = "ON AIR"; pulseIndicator.className = "pulse-dot on-air"; } };

    // Start with Standby Ticker immediately
    updateTicker("STANDBY");
    fetchSongData();
    setInterval(fetchSongData, 10000);
</script>
</body>
</html>
