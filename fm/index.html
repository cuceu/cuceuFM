<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <meta name="description" content="cuceu.fm — Live internet radio. Music, visuals, creative experiments.">
    <meta property="og:title" content="cuceu.fm">
    <meta property="og:description" content="Live internet radio stream with real-time audio visualizer.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg:#000; --ink:#f2f0eb; --dim:#6b6b6b; --line:#262626; --acid:#ff4d00;
            --mono:'Space Mono', ui-monospace, monospace;
            --disp:'Archivo', system-ui, sans-serif;
        }
        body.dark-mode { /* default already dark; light overrides below */ }
        body:not(.dark-mode) {
            --bg:#f4f2ec; --ink:#14110d; --dim:#8a857a; --line:#d8d4ca; --acid:#f23c00;
        }

        * { box-sizing:border-box; margin:0; }
        html, body { height:100dvh; overflow:hidden; }
        body {
            background:var(--bg); color:var(--ink); font-family:var(--disp);
            display:flex; flex-direction:column;
            transition:background 0.4s ease, color 0.4s ease;
        }
        .mono { font-family:var(--mono); }

        #app-container { position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }
        #viz-canvas { z-index:1; }
        #bg-layer { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }

        /* ── TICKERS ─────────────────────────────────── */
        .tick {
            position:relative; z-index:3; flex-shrink:0;
            height:46px; background:var(--bg);
            border-block:1px solid var(--line);
            display:flex; align-items:center; overflow:hidden;
        }
        .ticker-top { border-top:none; }
        .ticker-bottom { border-bottom:none; }
        .marquee-wrapper { display:flex; white-space:nowrap; align-items:center; width:fit-content; animation:tickerScroll linear infinite; }
        @keyframes tickerScroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
        @keyframes trackRoll { 0%{opacity:0} 100%{opacity:1} }
        .ticker-item { display:inline-flex; align-items:center; }
        .ticker-art { height:30px; width:30px; object-fit:cover; margin:0 18px; opacity:0; border:1px solid var(--line); transition:opacity 0.4s ease; }
        .ticker-art.has-art { opacity:1; }
        .song-display { font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:0 14px; }

        /* ── HEADER ──────────────────────────────────── */
        .head {
            position:relative; z-index:3; flex-shrink:0; background:var(--bg);
            display:flex; align-items:center; justify-content:space-between;
            padding:13px 24px; border-bottom:1px solid var(--line);
        }
        .back {
            font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:1px;
            text-transform:uppercase; border:1px solid var(--ink); padding:7px 13px;
            color:var(--ink); text-decoration:none; transition:background 0.2s, color 0.2s;
        }
        .back:hover { background:var(--ink); color:var(--bg); }
        .brand { display:flex; align-items:flex-end; user-select:none; }
        .brand img { height:34px; }
        .brand .fm { font-family:var(--mono); font-weight:700; font-size:18px; margin-left:3px; margin-bottom:2px; color:var(--ink); }
        .clock { display:flex; align-items:center; gap:16px; }
        .clock #rawclock { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:1px; color:var(--dim); white-space:nowrap; }
        .tog { width:28px; height:28px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s, color 0.2s; }
        .tog:hover { background:var(--ink); color:var(--bg); }
        .tog svg { width:15px; height:15px; }
        .tog .icon-sun { display:none; } body.dark-mode .tog .icon-sun { display:block; } body.dark-mode .tog .icon-moon { display:none; }

        /* ── MAIN ────────────────────────────────────── */
        #main { position:relative; z-index:2; flex:1; min-height:0; }
        #stage {
            position:absolute; inset:0;
            display:grid; grid-template-columns:auto 1fr;
            opacity:0; pointer-events:none; transition:opacity 0.5s ease;
        }
        body[data-active-mode="clean"] #stage { opacity:1; pointer-events:auto; }
        .art-cell { border-right:1px solid var(--line); display:flex; align-items:center; justify-content:center; padding:clamp(20px,4vw,46px); }
        #now-art { width:clamp(180px, 30vh, 320px); height:clamp(180px, 30vh, 320px); object-fit:cover; border:1px solid var(--line); display:block; background:var(--line); }
        #now-art.swap { animation:artSwap 0.5s ease; }
        @keyframes artSwap { 0%{opacity:0.2} 100%{opacity:1} }
        .now { display:flex; flex-direction:column; justify-content:center; gap:16px; padding:clamp(24px,4vw,44px); min-width:0; }
        .status { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--dim); }
        .status #status-dot { width:9px; height:9px; flex-shrink:0; background:var(--dim); }
        .status #status-text { color:var(--acid); }
        .titles { display:flex; flex-direction:column; gap:2px; min-width:0; }
        .artist { font-weight:800; font-size:clamp(18px,3vw,34px); line-height:0.98; letter-spacing:-0.02em; text-transform:uppercase; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .track  { font-weight:900; font-size:clamp(38px,7vw,76px); line-height:0.92; letter-spacing:-0.03em; text-transform:uppercase; overflow:hidden; }

        /* ── DVD BOUNCE ──────────────────────────────── */
        #dvd-box { position:absolute; top:0; left:0; width:clamp(110px,18vw,190px); opacity:0; will-change:transform; transition:opacity 0.6s ease; }
        #bg-layer.mode-dvd #dvd-box { opacity:1; }
        #dvd-artwork { display:block; width:100%; height:auto; border:1px solid rgba(255,255,255,0.25); }
        #dvd-box.corner-pop { animation:dvdPop 0.6s ease; }
        @keyframes dvdPop { 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }
        .dvd-badge { position:absolute; top:-9px; right:-9px; min-width:22px; height:22px; padding:0 5px; background:var(--acid); color:#000; font-family:var(--mono); font-size:11px; font-weight:700; display:none; align-items:center; justify-content:center; }
        .dvd-badge.show { display:flex; }

        /* ── CONSOLE (controls + modes) ──────────────── */
        .console {
            position:relative; z-index:3; flex-shrink:0; background:var(--bg);
            border-top:1px solid var(--line);
            display:flex; align-items:stretch; flex-wrap:wrap;
        }
        .listen {
            background:var(--acid); color:#000; border:none;
            font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:2px; text-transform:uppercase;
            padding:0 26px; min-height:52px; cursor:pointer; display:flex; align-items:center; gap:9px;
            transition:filter 0.2s;
        }
        .listen:hover { filter:brightness(1.1); }
        .listen:disabled { background:var(--line); color:var(--dim); cursor:not-allowed; filter:none; }
        .ctl { display:flex; align-items:center; gap:11px; padding:0 22px; border-right:1px solid var(--line); }
        .ctl .lab { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px; color:var(--dim); }
        #vol-meter { display:flex; gap:3px; cursor:pointer; }
        #vol-meter i { width:6px; height:20px; background:var(--line); display:block; transition:background 0.1s; }
        #vol-meter i.on { background:var(--ink); }
        .bass-segs { display:flex; gap:4px; }
        .bass-seg { width:22px; height:22px; border:1px solid var(--dim); background:transparent; font-family:var(--mono); font-size:11px; font-weight:700; color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:background 0.15s, color 0.15s, border-color 0.15s; }
        .bass-seg.on { background:var(--acid); border-color:var(--acid); color:#000; }
        .spacer { flex:1; border-right:1px solid var(--line); min-width:12px; }

        .modes { display:flex; }
        .mode-btn { background:transparent; border:none; border-right:1px solid var(--line); font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:0 20px; min-height:52px; color:var(--dim); cursor:pointer; transition:background 0.2s, color 0.2s; }
        .mode-btn:hover { color:var(--ink); }
        .mode-btn.active { background:var(--ink); color:var(--bg); }
        .viz-settings-btn { background:transparent; border:none; border-right:1px solid var(--line); color:var(--dim); cursor:pointer; width:0; padding:0; overflow:hidden; opacity:0; pointer-events:none; transition:width 0.25s, opacity 0.25s, color 0.2s; display:flex; align-items:center; justify-content:center; }
        body[data-active-mode="aurora"] .viz-settings-btn { width:46px; opacity:1; pointer-events:auto; }
        .viz-settings-btn:hover { color:var(--ink); }
        .viz-settings-btn svg { width:15px; height:15px; }
        .recent { background:transparent; border:none; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:0 22px; min-height:52px; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:8px; transition:background 0.2s, color 0.2s; }
        .recent:hover { background:var(--ink); color:var(--bg); }
        body.recent-open .recent { background:var(--acid); color:#000; }

        /* Recently played — raw panel above the console */
        .recent-panel {
            position:absolute; bottom:100%; right:0; width:min(420px, 100%);
            background:var(--bg); border:1px solid var(--line); border-bottom:none;
            max-height:min(50vh, 340px); overflow-y:auto;
            transform:translateY(8px); opacity:0; pointer-events:none;
            transition:opacity 0.25s ease, transform 0.25s ease; z-index:5;
        }
        body.recent-open .recent-panel { opacity:1; pointer-events:auto; transform:translateY(0); }
        .recent-panel .rp-head { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--dim); padding:14px 16px 10px; border-bottom:1px solid var(--line); }
        #history-list { list-style:none; padding:0; margin:0; }
        .history-item { display:flex; align-items:baseline; gap:14px; font-family:var(--mono); font-size:12px; font-weight:400; letter-spacing:0.5px; text-transform:uppercase; padding:12px 16px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .history-item:last-child { border-bottom:none; }
        .history-num { color:var(--acid); font-weight:700; flex-shrink:0; }

        /* Aurora settings popup — raw */
        .viz-settings-popup {
            position:absolute; bottom:100%; left:0; width:230px;
            background:var(--bg); border:1px solid var(--line); border-bottom:none;
            padding:14px 16px; display:flex; flex-direction:column; gap:8px;
            transform:translateY(8px); opacity:0; pointer-events:none;
            transition:opacity 0.25s, transform 0.25s; z-index:5;
        }
        .viz-settings-popup.visible { opacity:1; pointer-events:auto; transform:translateY(0); }
        .viz-set-section { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--acid); border-bottom:1px solid var(--line); padding-bottom:6px; margin-top:4px; }
        .viz-set-section:first-child { margin-top:0; }
        .viz-set-row { display:flex; flex-direction:column; gap:5px; }
        .viz-set-header { display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--dim); }
        .viz-set-value { color:var(--ink); }
        .viz-set-range { width:100%; height:4px; accent-color:var(--acid); }
        .viz-set-select { background:var(--bg); border:1px solid var(--line); color:var(--ink); font-family:var(--mono); font-size:11px; text-transform:uppercase; padding:5px; cursor:pointer; }
        .viz-set-reset { margin-top:4px; background:transparent; border:1px solid var(--line); color:var(--ink); font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:7px; cursor:pointer; transition:background 0.2s, color 0.2s; }
        .viz-set-reset:hover { background:var(--ink); color:var(--bg); }

        /* ── MOBILE ──────────────────────────────────── */
        @media (max-width:680px) {
            .head { padding:11px 16px; }
            .brand img { height:28px; } .brand .fm { font-size:15px; }
            #stage { grid-template-columns:1fr; }
            .art-cell { border-right:none; border-bottom:1px solid var(--line); padding:22px; }
            #now-art { width:clamp(130px,34vw,180px); height:clamp(130px,34vw,180px); }
            .now { padding:20px; gap:12px; }
            .console { flex-direction:column; align-items:stretch; }
            .listen { min-height:50px; justify-content:center; }
            .ctl { border-right:none; border-bottom:1px solid var(--line); padding:13px 18px; justify-content:space-between; }
            .spacer { display:none; }
            .modes { border-bottom:1px solid var(--line); }
            .mode-btn { flex:1; padding:0 10px; min-height:46px; }
            .recent { min-height:46px; justify-content:center; }
            .recent-panel { width:100%; }
        }
    </style>
</head>
<body>

    <div class="tick ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>

    <div id="app-container">
        <div class="head">
            <a href="/" class="back internal-link">← Back</a>

                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>

                </button>

<script>
// ── THEME (visualizers re-skin live when it flips) ───────────
CuceuTheme.bindToggle(document.getElementById('direct-theme-toggle'),
    (dark) => CuceuViz.setTheme(dark));
CuceuViz.setTheme(CuceuTheme.isDark());

// Clock in raw "FRI / 23.54.12" form (overrides the shared format on this page)
(function rawClock() {
    const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const el = document.getElementById('rawclock');
    const p = n => String(n).padStart(2, '0');
    function tick() {
        const n = new Date();
        el.textContent = window.innerWidth < 680
            ? `${p(n.getHours())}.${p(n.getMinutes())}`
            : `${DAYS[n.getDay()]} / ${p(n.getHours())}.${p(n.getMinutes())}.${p(n.getSeconds())}`;
    }
    tick(); setInterval(tick, 1000);
})();

// ── STREAM ────────────────────────────────────────────────────
const STREAM_BASE  = "https://stream.cuceu.co.uk";
const player       = document.getElementById('radioPlayer');

const statusText   = document.getElementById('status-text');
const statusDot    = document.getElementById('status-dot');
const nowArtist    = document.getElementById('now-artist');
const nowTrack     = document.getElementById('now-track');
const nowArt       = document.getElementById('now-art');
const playBtn      = document.getElementById('play-btn');
const topMarquee   = document.getElementById('top-marquee');
const bottomMarquee= document.getElementById('bottom-marquee');
const historyList  = document.getElementById('history-list');
const historyToggle= document.getElementById('history-toggle');
let playing = false, isOnline = false, currentTitle = '', currentArtUrl = '', currentTickerBase = '';

const DOT_COLORS = {
    live: 'var(--acid)', buffering: '#ffcc00', 'on-air': 'var(--acid)',
    offline: 'var(--dim)', checking: 'var(--dim)'
};
function setStatus(text, kind) {
    statusText.textContent = text;
    statusDot.style.background = DOT_COLORS[kind] || 'var(--dim)';
    statusDot.style.animation = kind === 'buffering' ? 'trackRoll 0.5s steps(2) infinite alternate' : 'none';
}
function setNowPlaying(t) {
    const sep = t.indexOf(' - ');
    if (sep > 0) { nowArtist.textContent = t.slice(0, sep); nowTrack.textContent = t.slice(sep + 3); }
    else { nowArtist.textContent = 'CUCEU.FM'; nowTrack.textContent = t; }
    nowTrack.title = t;
}

function renderPlayState() {
    playBtn.innerHTML = playing ? '❚❚ Pause' : '▶ Listen';
}
function updateAvailability() { playBtn.disabled = !(isOnline || playing); }

function updateTicker(base) {
    const art = currentArtUrl ? `<img class="ticker-art has-art" src="${currentArtUrl}" alt="">` : `<span style="display:inline-block;width:10px"></span>`;
    const item = `<div class="ticker-item"><span class="song-display">${base}</span>${art}</div>`;
    const content = Array(14).fill(item).join('');
    const dur = Math.max(22, base.length * 1.6);
    for (const m of [topMarquee, bottomMarquee]) {
        m.innerHTML = content + content;
        m.style.animation = `tickerScroll ${dur}s linear infinite, trackRoll 0.6s ease`;
    }
    bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s, 0s`;
    setTimeout(() => {
        topMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s`;
    }, 700);
}

// ── RECENTLY PLAYED panel ─────────────────────────────────────
historyToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = document.body.classList.toggle('recent-open');
    historyToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => {
    if (document.body.classList.contains('recent-open') &&
        !e.target.closest('.recent-panel') && !e.target.closest('#history-toggle')) {
        document.body.classList.remove('recent-open');
    }
});

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
async function fetchGlobalHistory() {
    try {
        const d = await fetch(`${STREAM_BASE}/history.json?t=` + Date.now()).then(r => r.json());
        if (Array.isArray(d) && d.length) {
            historyList.innerHTML = d.filter(Boolean).map((t, i) =>
                `<li class="history-item"><span class="history-num">${String(i + 1).padStart(2, '0')}</span>${esc(t)}</li>`).join('');
        }
    } catch(_) {}
}

async function fetchArtwork() {
    try {
        const u = (await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now()).then(r => r.text())).trim();
        if (u && u.startsWith('http')) currentArtUrl = u; else currentArtUrl = '';
    } catch(_) { currentArtUrl = ''; }
    nowArt.src = currentArtUrl || 'cuceugrta.png';
    if (currentMode === 'dvd') setDvdArt(currentArtUrl || 'cuceugrta.png');
}
async function fetchSongData() {
    try {
        const data = await fetch(`${STREAM_BASE}/status-json.xsl?t=` + Date.now()).then(r => r.json());
        const s = data.icestats.source; if (!s) throw new Error();
        isOnline = true;
        const t = Array.isArray(s) ? (s[0].title || 'ON AIR') : (s.title || 'ON AIR');
        if (!playing) setStatus('Live', 'live');
        if (t !== currentTitle) {
            currentTitle = t; fetchGlobalHistory(); await fetchArtwork();
            nowArt.classList.remove('swap'); void nowArt.offsetWidth; nowArt.classList.add('swap');
            setNowPlaying(t);
            currentTickerBase = `NOW PLAYING: ${t}`;
            updateTicker(currentTickerBase);
        }
    } catch(_) {
        isOnline = false;
        if (!playing) {
            setStatus('Offline', 'offline');
            if (currentTickerBase !== 'STANDBY') { currentTickerBase = 'STANDBY'; updateTicker('STANDBY'); }
        }
    }
    updateAvailability();
}
player.onwaiting = () => { if (playing) setStatus('Buffering', 'buffering'); };
player.onplaying = () => { if (playing) setStatus('On Air', 'on-air'); };
player.onpause   = () => { if (isOnline) setStatus('Live', 'live'); };

function togglePlay() {
    if (playBtn.disabled && !playing) return;
    if (!playing) {
        player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`;
        player.play().catch(() => {});
        setStatus('Buffering', 'buffering');
        resumeAudioGraph();
    } else {
        player.pause(); player.src = '';
        setStatus(isOnline ? 'Live' : 'Offline', isOnline ? 'live' : 'offline');
    }
    playing = !playing;
    CuceuViz.setPlaying(playing);
    renderPlayState();
    updateAvailability();
}
playBtn.addEventListener('click', togglePlay);

// ── AUDIO GRAPH: source → bass (lowshelf) → analyser → out ────
let audioCtx = null, analyser = null, bassFilter = null;
const BASS_DB = [0, 6, 10, 14];
let bassLevel = Math.min(3, Math.max(0, CuceuStore.get('cuceu-bass', 0)));
const savedVolume = Math.min(1, Math.max(0, CuceuStore.get('cuceu-volume', 0.5)));
player.volume = savedVolume;

function ensureAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.8;
    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 160;
    bassFilter.gain.value = BASS_DB[bassLevel];
    const src = audioCtx.createMediaElementSource(player);
    src.connect(bassFilter); bassFilter.connect(analyser); analyser.connect(audioCtx.destination);
}
function resumeAudioGraph() {
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
const audioProvider = {
    getFrequencyData: (a) => { if (analyser) analyser.getByteFrequencyData(a); },
    getSampleRate: () => audioCtx ? audioCtx.sampleRate : 44100,
    getFrequencyBinCount: () => analyser ? analyser.frequencyBinCount : 512
};

// ── VOLUME — clickable segmented meter, persisted ─────────────
const VOL_SEGMENTS = 12;
const volMeter = document.getElementById('vol-meter');
for (let i = 0; i < VOL_SEGMENTS; i++) volMeter.appendChild(document.createElement('i'));
function renderVol() {
    const filled = Math.round(player.volume * VOL_SEGMENTS);
    [...volMeter.children].forEach((s, i) => s.classList.toggle('on', i < filled));
}
volMeter.addEventListener('click', (e) => {
    const rect = volMeter.getBoundingClientRect();
    const v = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    player.volume = v; CuceuStore.set('cuceu-volume', v); renderVol();
});
renderVol();

// ── BASS boost (1·2·3, tap active level to step down) ─────────
const bassSegs = document.getElementById('bass-segs');
function renderBass() {
    bassSegs.querySelectorAll('.bass-seg').forEach(seg =>
        seg.classList.toggle('on', parseInt(seg.dataset.level, 10) <= bassLevel));
}
function setBass(level) {
    bassLevel = level;
    CuceuStore.set('cuceu-bass', level);
    if (bassFilter) bassFilter.gain.value = BASS_DB[level];
    renderBass();
}
bassSegs.addEventListener('click', (e) => {
    const seg = e.target.closest('.bass-seg'); if (!seg) return;
    const n = parseInt(seg.dataset.level, 10);
    setBass(n === bassLevel ? n - 1 : n);
});
renderBass();

// ── POLLING ───────────────────────────────────────────────────
updateTicker('STANDBY'); fetchSongData(); fetchGlobalHistory();
let fetchInterval = setInterval(fetchSongData, 4000);
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        fetchSongData();
        clearInterval(fetchInterval);
        fetchInterval = setInterval(fetchSongData, 4000);
        if (currentMode === 'dvd') resumeDvd();
    } else {
        clearInterval(fetchInterval);
    }
});

// ══════════════════════════════════════════════════════════════
// MODE SYSTEM (Clean / DVD / Aurora)
// ══════════════════════════════════════════════════════════════
const bgLayer    = document.getElementById('bg-layer');
const container  = document.getElementById('app-container');
const mainEl     = document.getElementById('main');
const modeToggle = document.getElementById('mode-toggle');
const modeBtns   = modeToggle.querySelectorAll('.mode-btn');
const ENGINE_MODES = ['aurora'];
let currentMode = 'clean';
document.body.dataset.activeMode = 'clean';

CuceuViz.setup({ container, provider: audioProvider });

const vizSettingsBtn   = document.getElementById('viz-settings-btn');
const vizSettingsPopup = document.getElementById('viz-settings-popup');
const vizSettingsMount = document.getElementById('viz-settings-mount');

function setMode(mode) {
    if (mode === currentMode) return;
    stopDvd();
    CuceuViz.stop();
    bgLayer.className = '';
    currentMode = mode;
    document.body.dataset.activeMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    vizSettingsPopup.classList.remove('visible');
    CuceuStore.set('cuceu-fm-mode', mode);

    if (mode === 'dvd') {
        bgLayer.classList.add('mode-dvd');
        startDvd();
    } else if (ENGINE_MODES.includes(mode)) {
        resumeAudioGraph();
        CuceuViz.start(mode);
        CuceuViz.buildSettingsPanel(mode, vizSettingsMount);
    }
}
modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

vizSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    vizSettingsPopup.classList.toggle('visible');
});
document.addEventListener('click', (e) => {
    if (!vizSettingsPopup.contains(e.target) && !vizSettingsBtn.contains(e.target)) {
        vizSettingsPopup.classList.remove('visible');
    }
});

// ══════════════════════════════════════════════════════════════
// DVD MODE — constant-speed diagonal bounce, confined to #main
// ══════════════════════════════════════════════════════════════
const dvdBox   = document.getElementById('dvd-box');
const dvdArt   = document.getElementById('dvd-artwork');
const dvdBadge = document.getElementById('dvd-badge');

let dvdAnimId = null, dvdX = 100, dvdY = 100, dvdVx = 0, dvdVy = 0, dvdLastT = 0;
let dvdCorners = parseInt(sessionStorage.getItem('cuceu-dvd-corners') || '0', 10);

function dvdBounds() {
    const r = mainEl.getBoundingClientRect();
    return { top: r.top, bottom: r.bottom, left: r.left, right: r.right };
}
function setDvdArt(url) { dvdArt.src = url; }

function celebrateCorner() {
    dvdCorners++;
    sessionStorage.setItem('cuceu-dvd-corners', String(dvdCorners));
    dvdBadge.textContent = dvdCorners;
    dvdBadge.classList.add('show');
    dvdBox.classList.remove('corner-pop');
    void dvdBox.offsetWidth;
    dvdBox.classList.add('corner-pop');
}
function initDvdPosition() {
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 160, h = dvdBox.offsetHeight || 160;
    dvdX = b.left + Math.random() * Math.max(1, b.right - b.left - w);
    dvdY = b.top + Math.random() * Math.max(1, b.bottom - b.top - h);
    const speed = (window.innerWidth < 600 ? 120 : 165) / Math.SQRT2;
    dvdVx = (Math.random() < 0.5 ? -1 : 1) * speed;
    dvdVy = (Math.random() < 0.5 ? -1 : 1) * speed;
}
function dvdFrame(now) {
    if (currentMode !== 'dvd') return;
    const dt = Math.min((now - dvdLastT) / 1000, 0.05);
    dvdLastT = now;
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 160, h = dvdBox.offsetHeight || 160;
    dvdX += dvdVx * dt; dvdY += dvdVy * dt;
    let hitX = false, hitY = false;
    if (dvdX <= b.left)       { dvdX = b.left;       dvdVx = Math.abs(dvdVx);  hitX = true; }
    if (dvdX + w >= b.right)  { dvdX = b.right - w;  dvdVx = -Math.abs(dvdVx); hitX = true; }
    if (dvdY <= b.top)        { dvdY = b.top;        dvdVy = Math.abs(dvdVy);  hitY = true; }
    if (dvdY + h >= b.bottom) { dvdY = b.bottom - h; dvdVy = -Math.abs(dvdVy); hitY = true; }
    if (hitX && hitY) celebrateCorner();
    dvdBox.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function startDvd() {
    setDvdArt(currentArtUrl || 'cuceugrta.png');
    if (dvdCorners > 0) { dvdBadge.textContent = dvdCorners; dvdBadge.classList.add('show'); }
    const begin = () => { initDvdPosition(); dvdLastT = performance.now(); dvdAnimId = requestAnimationFrame(dvdFrame); };
    if (dvdArt.complete && dvdArt.naturalWidth > 0) begin();
    else dvdArt.onload = begin;
}
function resumeDvd() {
    if (dvdAnimId) cancelAnimationFrame(dvdAnimId);
    dvdLastT = performance.now();
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function stopDvd() { if (dvdAnimId) { cancelAnimationFrame(dvdAnimId); dvdAnimId = null; } }

new ResizeObserver(() => {
    if (currentMode !== 'dvd') return;
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 160, h = dvdBox.offsetHeight || 160;
    dvdX = Math.min(Math.max(dvdX, b.left), b.right - w);
    dvdY = Math.min(Math.max(dvdY, b.top), b.bottom - h);
}).observe(mainEl);

// ── RESTORE LAST MODE ─────────────────────────────────────────
const savedMode = CuceuStore.get('cuceu-fm-mode', 'clean');
if (savedMode !== 'clean' && (savedMode === 'dvd' || ENGINE_MODES.includes(savedMode))) {
    setMode(savedMode);
}
renderPlayState();
</script>
</body>
