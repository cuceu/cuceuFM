<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #app-wrapper {
            width: 100%; height: 100%; position: relative;
            animation: continuityGlide 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes continuityGlide {
            0% { opacity: 0; transform: translateY(-5vh); } 100% { opacity: 1; transform: translateY(0); }
        }
        .status-area {
            position: absolute; top: 75px; right: 30px; display: flex; align-items: center;
            font-size: 16px; font-weight: 800; text-transform: uppercase; color: #000000; z-index: 100;
        }
        .ticker-tape {
            position: absolute; width: 100%; background: #000; color: #ffffff; overflow: hidden;
            padding: 12px 0; border-top: 4px solid #000; border-bottom: 4px solid #000;
            z-index: 10; display: flex;
        }
        .ticker-top { top: 0; } .ticker-bottom { bottom: 0; }
        .marquee-wrapper { 
            display: flex; white-space: nowrap; 
            animation: marquee linear infinite; 
            width: fit-content; 
        }
        .song-display {
            font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            padding-right: 80px;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        
        .main-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; padding: 0 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 {
            font-size: clamp(4rem, 16vw, 18rem); font-weight: 900;
            text-transform: uppercase; letter-spacing: -5px; margin: 0;
            -webkit-text-stroke: 4px #000; 
        }
        .fm-text { font-size: 0.5em; text-transform: lowercase; -webkit-text-stroke: 0px; }
        .live-status {
            font-size: clamp(1rem, 3vw, 1.5rem); text-transform: uppercase; letter-spacing: 3px;
            font-weight: 800; margin-top: 15px; margin-bottom: 30px;
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
        }
        .pulse-dot { height: 12px; width: 12px; background-color: #777; border-radius: 50%; }
        .pulse-dot.live { background-color: #34c759; }
        .pulse-dot.on-air { background-color: #ff3b30; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        button {
            background-color: #000; color: #fff; border: 4px solid #000; padding: 20px 40px;
            font-size: 1.2rem; text-transform: uppercase; font-weight: 800; letter-spacing: 3px;
            cursor: pointer; box-shadow: 8px 8px 0 #d3d3d3; transition: all 0.2s ease; margin-bottom: 30px;
        }
        
        /* --- DROPDOWN ANIMATION --- */
        .history-dropdown {
            width: 360px; border: 4px solid #000; background: #fff; text-align: left;
            box-shadow: 6px 6px 0 #d3d3d3; cursor: pointer; z-index: 50;
        }
        summary {
            padding: 12px; font-weight: 900; text-transform: uppercase; font-size: 0.85rem;
            display: flex; justify-content: space-between; align-items: center; outline: none;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 0.7rem; }
        details[open] summary::after { content: '▲'; }
