<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* PLAIN WHITE BRUTALIST BACKGROUND */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        #app-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            animation: continuityGlide 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes continuityGlide {
            0% { opacity: 0; transform: translateY(-5vh); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        /* --- FLOATING STATUS AREA --- */
        .status-area {
            position: absolute;
            top: 75px; 
            right: 30px;
            display: flex;
            align-items: center;
            font-size: 16px; 
            font-weight: 800; 
            text-transform: uppercase;
            color: #000000;
            z-index: 100;
            letter-spacing: 1px;
        }

        /* --- SEAMLESS INFINITE TICKER TAPE --- */
        .ticker-tape {
            position: absolute;
            width: 100%;
            background: #000;
            color: #ffffff;
            overflow: hidden;
            padding: 12px 0;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            z-index: 10;
            box-sizing: border-box;
            display: flex;
        }

        .ticker-top { top: 0; }
        .ticker-bottom { bottom: 0; }

        .marquee-wrapper {
            display: flex;
            white-space: nowrap;
            animation: marquee 60s linear infinite;
            width: fit-content;
        }

        .song-display {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding-right: 20px; 
            transition: opacity 0.75s ease-in-out; 
            opacity: 1;
        }

        .song-display.fade-out { opacity: 0; }

        @media (max-width: 600px) {
            .song-display { font-size: 1.1rem; letter-spacing: 2px; }
            .status-area { top: 65px; right: 15px; font-size: 12px; }
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- MAIN BRUTALIST UI (FIXED CENTERING) --- */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(4rem, 16vw, 18rem); 
            white-space: nowrap; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px; 
            margin: 0;
            color: #000; 
            -webkit-text-stroke: 4px #000; 
        }

        .fm-text {
            font-size: 0.5em; 
            text-transform: lowercase;
            letter-spacing: -2px;
            -webkit-text-stroke: 0px; 
        }

        .live-status {
            font-size: clamp(1rem, 3vw, 1.5rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            margin-top: 15px;
            margin-bottom: 30px;
            color: #000; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 90%;
            white-space: nowrap;
        }

        .pulse-dot {
            height: 12px;
            width: 12px;
            background-color: #777; 
            border-radius: 50%;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }
        .pulse-dot.live { background-color: #34c759; }
        .pulse-dot.on-air {
            background-color: #ff3b30; 
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        button {
            background-color: #000; 
            color: #fff; 
            border: 4px solid #000; 
            padding: 20px 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 8px 8px 0 #d3d3d3; 
            transition: all 0.2s ease;
            margin-bottom: 30px;
        }
        button:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0 #d3d3d3; }
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0 #d3d3d3; }

        /* --- RECENTLY PLAYED DROPDOWN (CENTERED) --- */
        .history-dropdown {
            width: 320px;
            border: 4px solid #000;
            background: #fff;
            text-align: left;
            box-shadow: 6px 6px 0 #d3d3d3;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            cursor: pointer;
            z-index: 50;
        }

        summary {
            padding: 12px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 0.7rem; }
        details[open] summary::after { content: '▲'; }

        #history-list {
            margin: 0;
            padding: 0 12px 12px 12px;
            list-style: none;
            border-top: 4px solid #000;
        }

        .history-item {
            padding: 10px 0;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            border-bottom: 1px solid #eee;
            color: #555;
            animation: slideIn 0.3s ease-out;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item span { color: #000; display: block; margin-top: 3px; font-size: 0.85rem;}

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="ticker-tape ticker-top">
            <div class="marquee-wrapper">
                <span class="song-display"></span>
                <span class="song-display"></span>
            </div>
        </div>

        <div class="status-area">
            <span id="mac-clock">00:00 AM</span>
        </div>

        <div class="main-container">
            <h1>CUCEU<span class="fm-text">.fm</span></h1>
            
            <div class="live-status">
                <div class="pulse-dot" id="pulse-indicator"></div> <span id="center-status">CHECKING...</span>
            </div>
            
            <button id="btn">▶ Listen</button>

            <details class="history-dropdown">
                <summary>Recently Played</summary>
                <ul id="history-list">
                    <li class="history-item" style="border:none; text-align:center; color:#ccc; padding: 20px 0;">No history yet</li>
                </ul>
            </details>
        </div>

        <div class="ticker-tape ticker-bottom">
            <div class="marquee-wrapper">
                <span class="song-display"></span>
                <span class="song-display"></span>
            </div>
        </div>
    </div>

    <audio id="radioPlayer" src="https://stream.cuceu.co.uk/stream.mp3" preload="none"></audio>

<script>
    // --- Clock Script ---
    function updateClock() {
        const now = new Date();
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        let hours = now.getHours() % 12 || 12; 
        let minutes = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
        document.getElementById('mac-clock').innerText = `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][now.getDay()]} ${hours}:${minutes} ${ampm}`;
    }
    updateClock(); setInterval(updateClock, 1000);

    const btn = document.getElementById("btn"), player = document.getElementById("radioPlayer"),
          centerStatus = document.getElementById("center-status"), pulseIndicator = document.getElementById("pulse-indicator"),
          tapes = document.querySelectorAll('.song-display'), historyList = document.getElementById("history-list");
    
    let playing = false, isOnline = false, currentTrackText = "", currentTitle = "", fetchInterval = null; 

    // --- GLOBAL HISTORY FETCH (The Magic Step) ---
    function fetchGlobalHistory() {
        // This hits your tunnel directly to grab the history file we made in Step 1
        const histUrl = "https://stream.cuceu.co.uk/history.json?nocache=" + new Date().getTime();
        fetch(histUrl, { cache: "no-store" })
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    // Filter out the empty slots from the start of the file
                    const cleanData = data.filter(t => t && t.trim() !== "");
                    if (cleanData.length > 0) {
                        historyList.innerHTML = cleanData.map(track => 
                            `<li class="history-item">Previously <span>${track}</span></li>`
                        ).join('');
                    }
                }
            }).catch(() => { console.log("History sync waiting for data..."); });
    }

    // --- Ticker Engine ---
    function updateTicker(baseString, instant = false) {
        const newFullString = Array(15).fill(baseString + " ").join('');
        if (currentTrackText !== newFullString) {
            if (instant) {
                tapes.forEach(el => el.innerText = newFullString);
                currentTrackText = newFullString;
                document.querySelectorAll('.marquee-wrapper').forEach(w => w.style.animationDuration = `${newFullString.length * 0.333}s`);
                return;
            }
            tapes.forEach(el => el.classList.add('fade-out'));
            setTimeout(() => {
                tapes.forEach(el => el.innerText = newFullString);
                currentTrackText = newFullString;
                document.querySelectorAll('.marquee-wrapper').forEach(w => w.style.animationDuration = `${newFullString.length * 0.333}s`);
                tapes.forEach(el => el.classList.remove('fade-out'));
            }, 750); 
        }
    }
    
    // --- Handshake ---
    const cachedStatus = localStorage.getItem('cuceu_fm_status');
    const cachedTitle = localStorage.getItem('cuceu_fm_title');
    if (cachedStatus === 'online') {
        isOnline = true; centerStatus.innerText = "LIVE";
        pulseIndicator.className = "pulse-dot live";
        updateTicker(`NOW PLAYING: ${cachedTitle || "ON AIR"}`, true);
    } else {
        centerStatus.innerText = "OFFLINE"; updateTicker("STANDBY", true);
    }
    
    function fetchGlobalHistory() {
    const histUrl = "https://stream.cuceu.co.uk/history.json?nocache=" + new Date().getTime();
    
    fetch(histUrl, { 
        method: 'GET',
        mode: 'cors', // This is the magic "allow" switch
        headers: { 'Accept': 'application/json' }
    })
    .then(res => res.json())
    .then(data => {
        console.log("Global History Sync:", data); // Check your console for this!
        if (data && Array.isArray(data)) {
            const cleanData = data.filter(t => t && t.trim() !== "");
            if (cleanData.length > 0) {
                historyList.innerHTML = cleanData.map(track => 
                    `<li class="history-item">Previously <span>${track}</span></li>`
                ).join('');
            } else {
                historyList.innerHTML = '<li class="history-item" style="text-align:center; color:#ccc; border:none; padding:20px 0;">No history yet</li>';
            }
        }
    })
    .catch(err => console.error("History Fetch Error:", err));
}

    function processData(data) {
        let source = data.icestats ? data.icestats.source : null;
        if (!source) return; 
        isOnline = true;
        if (!playing) { centerStatus.innerText = "LIVE"; pulseIndicator.className = "pulse-dot live"; }
        let newTitle = Array.isArray(source) ? (source[0].title || "ON AIR") : (source.title || "ON AIR");
        
        // If the song has changed, fetch the updated history file from your Mac
        if (newTitle !== currentTitle && newTitle !== "ON AIR") { 
            currentTitle = newTitle; 
            fetchGlobalHistory(); 
        }
        updateTicker(`NOW PLAYING: ${newTitle}`);
    }

    function fetchSongData() {
        const targetUrl = "https://stream.cuceu.co.uk/status-json.xsl?nocache=" + new Date().getTime();
        fetch(targetUrl, { cache: "no-store" }).then(res => res.json()).then(processData).catch(() => {
            const p1 = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl);
            fetch(p1, { cache: "no-store" }).then(res => res.json()).then(processData).catch(() => {
                const p2 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
                fetch(p2, { cache: "no-store" }).then(res => res.json()).then(processData).catch(() => {
                    isOnline = false; if (!playing) { centerStatus.innerText = "OFFLINE"; pulseIndicator.className = "pulse-dot"; }
                });
            });
        });
    }
    
    // Sync metadata every 15s
    setInterval(fetchSongData, 15000);
</script>
</body>
</html>
