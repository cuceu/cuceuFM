<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu.fm</title>
    <meta name="description" content="cuceu.fm — Live internet radio. Music, visuals, creative experiments.">
    <meta property="og:title" content="cuceu.fm">
    <meta property="og:description" content="Live internet radio stream with real-time audio visualizer.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2255%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22 letter-spacing=%22-2%22>.fm</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        html, body { height: 100dvh; overflow: hidden; }
        /* No aurora wash / grain on the radio page */
        body::before, body::after { display: none; }
        body { --page-bg: #fafafa; background: var(--page-bg); }
        body.dark-mode { --page-bg: #000; background: var(--page-bg); }

        /* ── FULL-BLEED CONTAINER ────────────────────── */
        #app-container {
            width: 100vw; height: 100dvh;
            position: relative; overflow: hidden;
            background-color: transparent;
            transition: background-color var(--dur-slow) ease;
        }
        /* DVD + visualizers run on strict black, both themes */
        #app-container.viz-mode { background-color: #000; }
        #viz-canvas { z-index: 2; }

        /* ── TICKERS — always black tape, white type ──── */
        .ticker-tape {
            position: absolute; left: 0; right: 0;
            height: 54px; z-index: 60;
            background: #0c0c0c; color: #f4f4f4;
            overflow: hidden; display: flex; align-items: center;
            transition: opacity 1.1s ease;
        }
        body.dark-mode .ticker-tape { border-block: 1px solid rgba(255,255,255,0.14); }
        .ticker-top    { top: 0; transform: translateY(-100%); animation: stIn 0.55s var(--ease-smooth) 0.2s forwards; }
        .ticker-bottom { bottom: 0; transform: translateY( 100%); animation: sbIn 0.55s var(--ease-smooth) 0.2s forwards; }
        body.is-exiting .ticker-top    { animation: stOut 0.3s var(--ease-smooth) forwards; }
        body.is-exiting .ticker-bottom { animation: sbOut 0.3s var(--ease-smooth) forwards; }
        @keyframes stIn  { to{transform:translateY(0)} }
        @keyframes sbIn  { to{transform:translateY(0)} }
        @keyframes stOut { to{transform:translateY(-100%)} }
        @keyframes sbOut { to{transform:translateY( 100%)} }
        .marquee-wrapper { display:flex; white-space:nowrap; align-items:center; width:fit-content; animation:tickerScroll linear infinite; }
        @keyframes tickerScroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
        @keyframes trackRoll { 0%{opacity:0;filter:blur(10px)} 100%{opacity:1;filter:blur(0)} }
        .ticker-item  { display:inline-flex; align-items:center; }
        .ticker-art   {
            height:38px; width:38px; object-fit:cover; margin:0 22px; border-radius:5px; opacity:0;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.25);
            transition: opacity 0.4s ease;
        }
        .ticker-art.has-art { opacity:1; }
        .song-display { font-size:1.25rem; font-weight:900; text-transform:uppercase; letter-spacing:3.5px; padding:0 10px; }

        /* ── NAV ─────────────────────────────────────── */
        .top-nav-bar {
            position: absolute; top: 62px; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 26px; z-index: 50;
            transition: opacity 1.1s var(--ease-smooth);
        }
        .top-nav-bar .back-pill {
            background: var(--page-bg); border: 1.5px solid var(--c-text);
            color: var(--c-text); border-radius: 4px;
            padding: 8px 16px; font-size: 10px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            box-shadow: none; backdrop-filter: none;
        }
        .top-nav-bar .back-pill:hover { background: var(--c-text); color: var(--page-bg); }
        body.viz-active .top-nav-bar .back-pill { background: transparent; border-color: #e8e8e8; color: #e8e8e8; }
        body.viz-active .top-nav-bar .back-pill:hover { background: #e8e8e8; color: #000; }
        body.viz-active .cuceu-clock { color: #f4ede3; text-shadow: 0 0 8px rgba(0,0,0,0.5); }
        body.viz-active .theme-toggle { color: #f4ede3; }
        .nav-right { display: flex; align-items: center; gap: 12px; position: relative; }

        /* ── STAGE: logo + player, centered in every mode ── */
        #stage {
            position: absolute; inset: 54px 0 54px;
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: clamp(26px, 5vh, 52px);
            pointer-events: none;
            transition: gap 1.1s var(--ease-smooth);
        }
        body.ui-idle #stage { gap: clamp(18px, 3.5vh, 34px); }

        /* Big centered logo (idle dims this; entry anim lives on the inner) */
        .fm-logo {
            user-select: none;
            transition: opacity 1.1s ease, transform 1.1s var(--ease-smooth);
        }
        .fm-logo-inner { display: flex; align-items: flex-end; justify-content: center; }
        .fm-logo-img {
            height: clamp(72px, 15vw, 150px); width: auto;
            filter: drop-shadow(0 4px 14px rgba(0,0,0,0.18));
            transition: filter var(--dur-slow) ease;
        }
        body.viz-active .fm-logo-img,
        body.dark-mode .fm-logo-img { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6)); }
        .fm-logo-dot {
            font-size: clamp(26px, 5.5vw, 56px); font-weight: 900; letter-spacing: -2px;
            color: var(--c-text); padding-bottom: clamp(4px, 1vw, 12px); margin-left: -6px;
            transition: color var(--dur-slow) ease;
        }
        body.viz-active .fm-logo-dot { color: #fff; }
        /* AOD: logo lifts a touch and dims */
        body.ui-idle .fm-logo { opacity: 0.4; transform: translateY(-6px); }

        /* ── GLASSY PLAYER ───────────────────────────── */
        .player {
            pointer-events: auto;
            width: min(380px, 90vw);
            display: flex; flex-direction: column; gap: 16px;
            padding: 16px 18px;
            border-radius: 26px;
            background: var(--c-glass-strong);
            border: 1px solid var(--c-glass-border);
            outline: 1px solid var(--c-glass-edge);
            box-shadow: var(--sh-float), var(--sh-gloss);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            transition: background 0.9s ease, border-color 0.9s ease,
                        box-shadow 0.9s ease, padding 0.9s var(--ease-smooth),
                        width 0.9s var(--ease-smooth), gap 0.9s ease;
        }
        body.viz-active .player {
            background: rgba(16, 16, 18, 0.6);
            border-color: rgba(255, 255, 255, 0.14);
            outline-color: rgba(255,255,255,0.05);
        }

        .player-row1 { display: flex; align-items: center; justify-content: center; gap: 14px; min-width: 0; }

        /* Vinyl / artwork — morphs into a spinning record when idle */
        .vinyl {
            --v: 56px;
            width: var(--v); height: var(--v); flex-shrink: 0;
            position: relative; border-radius: 50%;
            background:
                repeating-radial-gradient(circle at 50% 50%,
                    rgba(255,255,255,0) 0, rgba(255,255,255,0) 2.5px,
                    rgba(255,255,255,0.05) 2.5px, rgba(255,255,255,0.05) 3.5px),
                radial-gradient(circle at 38% 32%, #232323, #060606 78%);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.08);
            transition: width 0.9s var(--ease-smooth), height 0.9s var(--ease-smooth);
        }
        .vinyl-label {
            position: absolute; inset: 16%;
            width: 68%; height: 68%; border-radius: 50%;
            object-fit: cover; box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
        }
        .vinyl-hole {
            position: absolute; top: 50%; left: 50%;
            width: 6%; height: 6%; border-radius: 50%;
            transform: translate(-50%, -50%);
            background: var(--c-glass-strong);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
        }
        body.viz-active .vinyl-hole { background: #16161a; }
        body.ui-idle .vinyl {
            --v: clamp(170px, 42vw, 220px);
            animation: spin 4.5s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .player-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; overflow: hidden;
            transition: opacity 0.5s ease, max-width 0.9s var(--ease-smooth); max-width: 400px; }
        .player-status {
            display: flex; align-items: center; gap: 7px;
            font-size: 8px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--c-text-muted);
        }
        body.viz-active .player-status { color: #9a8d7c; }
        .player-status .aero-dot { width: 7px; height: 7px; animation: aero-pulse 1.6s ease-in-out infinite; }
        .player-status .aero-dot.buffering { animation: aero-blink 0.8s infinite alternate; }
        .player-title {
            font-size: 13px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
            color: var(--c-text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        body.viz-active .player-title { color: #f4f4f4; }

        .play-btn {
            width: 50px; height: 50px; flex-shrink: 0;
            border-radius: 50%; border: none; cursor: pointer;
            background: var(--g-gel); color: #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--sh-gloss), 0 4px 14px rgba(143,74,20,0.35);
            position: relative; overflow: hidden;
            transition: transform 0.25s var(--ease-spring), opacity 0.4s ease, filter 0.4s ease,
                        max-width 0.9s var(--ease-smooth);
            max-width: 60px;
        }
        .play-btn::before {
            content: ''; position: absolute; inset: 1px 1px 55% 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.05));
            border-radius: inherit; pointer-events: none;
        }
        .play-btn svg { width: 19px; height: 19px; fill: #fff; position: relative; z-index: 1; }
        .play-btn:hover { transform: scale(1.06); }
        .play-btn:active { transform: scale(0.95); }
        .play-btn:disabled { filter: grayscale(1) brightness(0.7); opacity: 0.5; cursor: not-allowed; }

        .player-row2 {
            display: flex; align-items: center; gap: 16px;
            overflow: hidden;
            transition: opacity 0.45s ease, max-height 0.9s var(--ease-smooth), margin 0.9s ease;
            max-height: 40px;
        }
        .vol { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; color: var(--c-text-muted); }
        body.viz-active .vol { color: #9a8d7c; }
        .vol svg { flex-shrink: 0; opacity: 0.8; }
        .vol input[type="range"] {
            flex: 1; min-width: 0; height: 4px; cursor: pointer;
            accent-color: var(--c-amber);
        }

        /* Bass boost — OFF / 1 / 2 / 3 segmented control */
        .bass { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .bass-label {
            font-size: 8px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--c-text-muted);
        }
        body.viz-active .bass-label { color: #9a8d7c; }
        .bass-segs { display: flex; gap: 3px; align-items: flex-end; }
        .bass-seg {
            width: 9px; height: 14px; padding: 0; cursor: pointer;
            border: 1.5px solid var(--c-text-muted); border-radius: 2px;
            background: transparent; transition: background 0.2s, border-color 0.2s, height 0.2s;
        }
        .bass-seg[data-level="2"] { height: 17px; }
        .bass-seg[data-level="3"] { height: 20px; }
        .bass-seg.on { background: var(--c-amber); border-color: var(--c-amber); }
        body.viz-active .bass-seg { border-color: #6a6258; }
        body.viz-active .bass-seg.on { background: var(--c-amber-bright); border-color: var(--c-amber-bright); }

        /* AOD idle: collapse everything but the vinyl (kept centred by
           row1's justify-center), which grows and spins */
        body.ui-idle .player {
            background: transparent; border-color: transparent;
            outline-color: transparent; box-shadow: none;
            padding: 0; gap: 0;
        }
        body.ui-idle .player-row1 { gap: 0; }
        body.ui-idle .player-meta { opacity: 0; max-width: 0; flex: 0 0 auto; }
        body.ui-idle .play-btn { opacity: 0; max-width: 0; pointer-events: none; }
        body.ui-idle .player-row2 { opacity: 0; max-height: 0; margin-top: -16px; pointer-events: none; }

        /* ── DVD MODE — clean artwork bounce, no tinting ── */
        #bg-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        #dvd-box {
            position: absolute; top: 0; left: 0;
            width: clamp(120px, 20vw, 200px);
            opacity: 0; will-change: transform; border-radius: 8px;
            filter: drop-shadow(0 6px 24px rgba(0,0,0,0.5));
            transition: opacity 0.8s ease;
        }
        #bg-layer.mode-dvd #dvd-box { opacity: 1; }
        #dvd-artwork { display: block; width: 100%; height: auto; border-radius: 8px; }
        #dvd-box.corner-pop { animation: dvdPop 0.7s var(--ease-spring); }
        @keyframes dvdPop { 0%{scale:1} 35%{scale:1.16} 100%{scale:1} }
        .dvd-badge {
            position: absolute; top: -10px; right: -10px;
            min-width: 22px; height: 22px; padding: 0 6px;
            border-radius: 11px; background: #0c0c0c;
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff; font-size: 11px; font-weight: 900;
            display: none; align-items: center; justify-content: center;
        }
        .dvd-badge.show { display: flex; }

        /* ── MODE DOCK — monochrome ──────────────────── */
        .mode-dock-wrap {
            position: absolute; bottom: 70px; left: 50%;
            transform: translateX(-50%); z-index: 70;
            max-width: calc(100vw - 32px);
            transition: opacity 1.1s var(--ease-smooth);
        }
        .mode-toggle {
            display: flex; gap: 0; border-radius: var(--r-pill); padding: 4px;
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
            max-width: 100%; flex-wrap: nowrap;
            transition: background 0.6s ease, border-color 0.6s ease;
        }
        .mode-toggle::-webkit-scrollbar { display: none; }
        body.dark-mode .mode-toggle, body.viz-active .mode-toggle {
            background: rgba(10, 10, 10, 0.7); border-color: rgba(255, 255, 255, 0.25);
        }
        .mode-btn {
            background: transparent; border: none;
            padding: 8px 18px; font-size: 9px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            color: #777; cursor: pointer; border-radius: var(--r-pill);
            white-space: nowrap; flex-shrink: 0; font-family: var(--font-primary);
            transition: color 0.3s, background 0.3s var(--ease-spring);
        }
        .mode-btn:hover { color: var(--c-text); }
        body.dark-mode .mode-btn:hover, body.viz-active .mode-btn:hover { color: #f4f4f4; }
        .mode-btn.active { background: #0c0c0c; color: #fff; }
        body.dark-mode .mode-btn.active, body.viz-active .mode-btn.active { background: #f4f4f4; color: #000; }

        .viz-settings-btn {
            background: transparent; border: none; color: #888; cursor: pointer;
            border-radius: 50%; opacity: 0; pointer-events: none;
            width: 0; padding: 0; transition: width 0.3s, opacity 0.3s, padding 0.3s, color 0.3s;
            overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        body[data-active-mode="aurora"] .viz-settings-btn {
            width: 30px; padding: 4px; opacity: 1; pointer-events: auto; margin-left: 2px;
        }
        .viz-settings-btn:hover { color: #fff; }

        .viz-settings-popup {
            position: absolute; bottom: calc(100% + 12px); right: 0;
            border-radius: var(--r-lg); padding: 16px;
            display: flex; flex-direction: column; gap: 6px;
            opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.95);
            transition: opacity 0.3s var(--ease-spring), transform 0.3s var(--ease-spring);
            width: 210px; transform-origin: bottom right;
            max-height: min(420px, calc(100dvh - 220px)); overflow-y: auto;
            background: rgba(10, 10, 10, 0.92); border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .viz-settings-popup.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
        .viz-set-section {
            color: rgba(255,255,255,0.55); font-size: 9px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.12); padding: 8px 0 6px; margin-bottom: 4px;
        }
        .viz-set-section:first-child { padding-top: 0; }
        .viz-set-row {
            display: flex; flex-direction: column; gap: 6px; padding: 4px 0;
            color: rgba(244, 237, 227, 0.6);
            font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
        }
        .viz-set-range { width: 100%; height: 4px; }
        .viz-set-select {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            color: #f4f4f4; padding: 5px; border-radius: 6px; outline: none;
            font-size: 8px; font-weight: 800; text-transform: uppercase;
            cursor: pointer; font-family: var(--font-primary);
        }
        .viz-set-select option { background: #111; color: #f4f4f4; }
        .viz-set-reset {
            margin-top: 8px; padding: 6px; background: transparent;
            border: 1px solid rgba(255,255,255,0.25); border-radius: var(--r-pill);
            color: #e8e8e8; font-size: 8px; font-weight: 900; letter-spacing: 2px;
            cursor: pointer; font-family: var(--font-primary);
            transition: background 0.3s, color 0.3s;
        }
        .viz-set-reset:hover { background: #fff; color: #000; }

        /* ── AOD idle: fade the surrounding chrome ─────── */
        body.ui-idle .top-nav-bar,
        body.ui-idle .mode-dock-wrap { opacity: 0; pointer-events: none; }
        body.ui-idle .ticker-tape { opacity: 0.12; }

        /* ── MOBILE ──────────────────────────────────── */
        @media (max-width: 600px) {
            .top-nav-bar  { top:48px; padding:10px 14px; }
            .ticker-tape  { height:48px; }
            #stage        { inset: 48px 0 48px; }
            .song-display { font-size:1.05rem; letter-spacing:2.5px; }
            .ticker-art   { height:32px; width:32px; margin: 0 16px; }
            .player       { width: min(340px, 90vw); }
            .mode-dock-wrap { bottom: 60px; }
            .mode-btn     { padding: 7px 13px; font-size: 8px; letter-spacing: 1.5px; }
            #dvd-box      { width: clamp(96px, 30vw, 150px); }
        }
    </style>
</head>
<body>

    <div id="app-container" class="a-pop">
        <div class="ticker-tape ticker-top"><div class="marquee-wrapper" id="top-marquee"></div></div>

        <div class="top-nav-bar">
            <a href="/" class="back-pill internal-link a-drop" style="--d:.2s">&larr; Back</a>
            <div class="nav-right a-drop" style="--d:.2s">
                <div class="cuceu-clock"><span class="cuceu-clock-text">MONDAY | 00:00 AM</span></div>
                <button class="theme-toggle" id="direct-theme-toggle" aria-label="Toggle Theme">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>

        <!-- UNIFIED STAGE: logo + glassy player, centered in every mode -->
        <div id="stage">
            <div class="fm-logo">
                <div class="fm-logo-inner a-rise" style="--d:.3s">
                    <img src="cuceugrta.png" alt="CUCEU" class="fm-logo-img">
                    <span class="fm-logo-dot">.fm</span>
                </div>
            </div>

            <div class="player a-rise" id="player" style="--d:.42s">
                <div class="player-row1">
                    <div class="vinyl" id="vinyl">
                        <img class="vinyl-label" id="now-art" src="cuceugrta.png" alt="Now playing artwork">
                        <div class="vinyl-hole"></div>
                    </div>
                    <div class="player-meta">
                        <div class="player-status">
                            <span class="aero-dot" id="status-dot" style="--dot-c:#9a9a9a"></span>
                            <span id="status-text">CHECKING</span>
                        </div>
                        <div class="player-title" id="track-title">CUCEU.FM</div>
                    </div>
                    <button class="play-btn" id="play-btn" aria-label="Play/Pause stream" disabled>
                        <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>
                <div class="player-row2">
                    <div class="vol">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
                    </div>
                    <div class="bass" role="group" aria-label="Bass boost">
                        <span class="bass-label">Bass</span>
                        <div class="bass-segs" id="bass-segs">
                            <button class="bass-seg" data-level="1" aria-label="Bass level 1"></button>
                            <button class="bass-seg" data-level="2" aria-label="Bass level 2"></button>
                            <button class="bass-seg" data-level="3" aria-label="Bass level 3"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DVD bounce layer -->
        <div id="bg-layer">
            <div id="dvd-box">
                <img id="dvd-artwork" src="" alt="">
                <span class="dvd-badge" id="dvd-badge">0</span>
            </div>
        </div>

        <!-- Mode dock -->
        <div class="mode-dock-wrap" id="mode-dock-wrap">
            <div class="mode-toggle a-slideup" style="--d:.5s" id="mode-toggle">
                <button class="mode-btn active" data-mode="clean">Clean</button>
                <button class="mode-btn" data-mode="dvd">DVD</button>
                <button class="mode-btn" data-mode="aurora">Aurora</button>
                <button class="viz-settings-btn" id="viz-settings-btn" aria-label="Visualizer Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
            <div class="viz-settings-popup" id="viz-settings-popup">
                <div id="viz-settings-mount"></div>
            </div>
        </div>

        <div class="ticker-tape ticker-bottom"><div class="marquee-wrapper" id="bottom-marquee"></div></div>
        <audio id="radioPlayer" preload="none" crossorigin="anonymous"></audio>
    </div>

<script src="../shared.js"></script>
<script src="viz-core.js"></script>
<script src="visualizers.js"></script>
<script>
// ── THEME ─────────────────────────────────────────────────────
CuceuTheme.bindToggle(document.getElementById('direct-theme-toggle'));

// ── STREAM ────────────────────────────────────────────────────
// Standalone page — owns its own <audio>, analyser and bass filter.
const STREAM_BASE  = "https://stream.cuceu.co.uk";
const player       = document.getElementById('radioPlayer');

const statusText   = document.getElementById('status-text');
const statusDot    = document.getElementById('status-dot');
const trackTitle   = document.getElementById('track-title');
const nowArt       = document.getElementById('now-art');
const playBtn      = document.getElementById('play-btn');
const topMarquee   = document.getElementById('top-marquee');
const bottomMarquee= document.getElementById('bottom-marquee');
let playing = false, isOnline = false, currentTitle = '', currentArtUrl = '', currentTickerBase = '';

const DOT_COLORS = {
    live: '#4ade80', buffering: '#ffcc00', 'on-air': '#f0913c',
    offline: '#777777', checking: '#9a9a9a'
};
function setStatus(text, kind) {
    statusText.textContent = text;
    statusDot.style.setProperty('--dot-c', DOT_COLORS[kind] || DOT_COLORS.checking);
    statusDot.classList.toggle('buffering', kind === 'buffering');
}

function renderPlayState() {
    playBtn.querySelector('.play-icon').style.display  = playing ? 'none' : 'block';
    playBtn.querySelector('.pause-icon').style.display = playing ? 'block' : 'none';
    document.body.classList.toggle('is-playing', playing);
}
// Play only enabled while the station is live (or already playing)
function updateAvailability() { playBtn.disabled = !(isOnline || playing); }

function updateTicker(base) {
    const art = currentArtUrl ? `<img class="ticker-art has-art" src="${currentArtUrl}" alt="">` : `<span style="display:inline-block;width:10px"></span>`;
    const item = `<div class="ticker-item"><span class="song-display">${base}</span>${art}</div>`;
    const content = Array(14).fill(item).join('');
    const dur = Math.max(22, base.length * 1.6);
    for (const m of [topMarquee, bottomMarquee]) {
        m.innerHTML = content + content;
        m.style.animation = `tickerScroll ${dur}s linear infinite, trackRoll 0.8s var(--ease-smooth)`;
    }
    bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s, 0s`;
    setTimeout(() => {
        topMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.style.animation = `tickerScroll ${dur}s linear infinite`;
        bottomMarquee.style.animationDelay = `-${(dur * 0.44).toFixed(1)}s`;
    }, 900);
}

async function fetchArtwork() {
    try {
        const u = (await fetch(`${STREAM_BASE}/artwork.txt?t=` + Date.now()).then(r => r.text())).trim();
        if (u && u.startsWith('http')) currentArtUrl = u; else currentArtUrl = '';
    } catch(_) { currentArtUrl = ''; }
    nowArt.src = currentArtUrl || 'cuceugrta.png';
    if (currentMode === 'dvd') setDvdArt(currentArtUrl || 'cuceugrta.png');
}
async function fetchSongData() {
    try {
        const data = await fetch(`${STREAM_BASE}/status-json.xsl?t=` + Date.now()).then(r => r.json());
        const s = data.icestats.source; if (!s) throw new Error();
        isOnline = true;
        const t = Array.isArray(s) ? (s[0].title || 'ON AIR') : (s.title || 'ON AIR');
        if (!playing) setStatus('LIVE', 'live');
        if (t !== currentTitle) {
            currentTitle = t; await fetchArtwork();
            trackTitle.textContent = t; trackTitle.title = t;
            currentTickerBase = `NOW PLAYING: ${t}`;
            updateTicker(currentTickerBase);
        }
    } catch(_) {
        isOnline = false;
        if (!playing) {
            setStatus('OFFLINE', 'offline');
            if (currentTickerBase !== 'STANDBY') { currentTickerBase = 'STANDBY'; updateTicker('STANDBY'); }
        }
    }
    updateAvailability();
}
player.onwaiting = () => { if (playing) setStatus('BUFFERING', 'buffering'); };
player.onplaying = () => { if (playing) setStatus('ON AIR', 'on-air'); };
player.onpause   = () => { if (isOnline) setStatus('LIVE', 'live'); };

function togglePlay() {
    if (playBtn.disabled && !playing) return;
    if (!playing) {
        player.src = `${STREAM_BASE}/stream.mp3?t=${Date.now()}`;
        player.play().catch(() => {});
        setStatus('BUFFERING', 'buffering');
        resumeAudioGraph();
    } else {
        player.pause(); player.src = '';
        setStatus(isOnline ? 'LIVE' : 'OFFLINE', isOnline ? 'live' : 'offline');
    }
    playing = !playing;
    renderPlayState();
    updateAvailability();
}
playBtn.addEventListener('click', togglePlay);

// ── VOLUME — persisted ────────────────────────────────────────
const volumeSlider = document.getElementById('volume-slider');
const savedVolume = CuceuStore.get('cuceu-volume', 0.5);
volumeSlider.value = savedVolume; player.volume = savedVolume;
volumeSlider.addEventListener('input', (e) => {
    player.volume = e.target.value;
    CuceuStore.set('cuceu-volume', parseFloat(e.target.value));
});

// ── AUDIO GRAPH: source → bass (lowshelf) → analyser → out ────
let audioCtx = null, analyser = null, bassFilter = null;
const BASS_DB = [0, 6, 10, 14];               // OFF, 1, 2, 3
let bassLevel = Math.min(3, Math.max(0, CuceuStore.get('cuceu-bass', 0)));

function ensureAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.8;
    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 160;
    bassFilter.gain.value = BASS_DB[bassLevel];
    const src = audioCtx.createMediaElementSource(player);
    src.connect(bassFilter); bassFilter.connect(analyser); analyser.connect(audioCtx.destination);
}
function resumeAudioGraph() {
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
const audioProvider = {
    getFrequencyData: (a) => { if (analyser) analyser.getByteFrequencyData(a); },
    getSampleRate: () => audioCtx ? audioCtx.sampleRate : 44100,
    getFrequencyBinCount: () => analyser ? analyser.frequencyBinCount : 512
};

// Bass boost control (1·2·3, click active level to turn off)
const bassSegs = document.getElementById('bass-segs');
function renderBass() {
    bassSegs.querySelectorAll('.bass-seg').forEach(seg => {
        seg.classList.toggle('on', parseInt(seg.dataset.level, 10) <= bassLevel);
    });
}
function setBass(level) {
    bassLevel = level;
    CuceuStore.set('cuceu-bass', level);
    if (bassFilter) bassFilter.gain.value = BASS_DB[level];
    renderBass();
}
bassSegs.addEventListener('click', (e) => {
    const seg = e.target.closest('.bass-seg'); if (!seg) return;
    const n = parseInt(seg.dataset.level, 10);
    setBass(n === bassLevel ? n - 1 : n);   // tap the active top bar to step down/off
});
renderBass();

// ── POLLING ───────────────────────────────────────────────────
updateTicker('STANDBY'); fetchSongData();
let fetchInterval = setInterval(fetchSongData, 4000);
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        fetchSongData();
        clearInterval(fetchInterval);
        fetchInterval = setInterval(fetchSongData, 4000);
        if (currentMode === 'dvd') resumeDvd();
    } else {
        clearInterval(fetchInterval);
    }
});

// ══════════════════════════════════════════════════════════════
// MODE SYSTEM (Clean / DVD / Aurora) — same stage, different bg
// ══════════════════════════════════════════════════════════════
const bgLayer    = document.getElementById('bg-layer');
const container  = document.getElementById('app-container');
const modeToggle = document.getElementById('mode-toggle');
const modeBtns   = modeToggle.querySelectorAll('.mode-btn');
const ENGINE_MODES  = ['aurora'];           // Three.js engine
const DARK_MODES    = ['dvd', 'aurora'];    // force black canvas + dark chrome
let currentMode = 'clean';

CuceuViz.setup({ container, provider: audioProvider });

const vizSettingsBtn   = document.getElementById('viz-settings-btn');
const vizSettingsPopup = document.getElementById('viz-settings-popup');
const vizSettingsMount = document.getElementById('viz-settings-mount');

function setMode(mode) {
    if (mode === currentMode) return;
    stopDvd();
    CuceuViz.stop();
    bgLayer.className = '';
    container.classList.remove('viz-mode');
    currentMode = mode;
    document.body.classList.toggle('viz-active', DARK_MODES.includes(mode));
    document.body.dataset.activeMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    vizSettingsPopup.classList.remove('visible');
    CuceuStore.set('cuceu-fm-mode', mode);

    if (mode === 'dvd') {
        container.classList.add('viz-mode');
        bgLayer.classList.add('mode-dvd');
        startDvd();
    } else if (ENGINE_MODES.includes(mode)) {
        container.classList.add('viz-mode');
        resumeAudioGraph();
        CuceuViz.start(mode);
        CuceuViz.buildSettingsPanel(mode, vizSettingsMount);
    }
    resetIdleTimer();
}
modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

vizSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    vizSettingsPopup.classList.toggle('visible');
});
document.addEventListener('click', (e) => {
    if (!vizSettingsPopup.contains(e.target) && !vizSettingsBtn.contains(e.target)) {
        vizSettingsPopup.classList.remove('visible');
    }
});

// ── AOD IDLE (all modes drift to the spinning-vinyl sleep state) ──
let idleTimer = null;
function resetIdleTimer() {
    document.body.classList.remove('ui-idle');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        if (!vizSettingsPopup.classList.contains('visible')) {
            document.body.classList.add('ui-idle');
        }
    }, 5000);
}
['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev =>
    document.addEventListener(ev, resetIdleTimer, { passive: true }));
resetIdleTimer();

// ══════════════════════════════════════════════════════════════
// DVD MODE — constant-speed diagonal bounce, clean artwork (no tint)
// ══════════════════════════════════════════════════════════════
const dvdBox   = document.getElementById('dvd-box');
const dvdArt   = document.getElementById('dvd-artwork');
const dvdBadge = document.getElementById('dvd-badge');
const tickerTopEl = document.querySelector('.ticker-top');
const tickerBottomEl = document.querySelector('.ticker-bottom');

let dvdAnimId = null, dvdX = 100, dvdY = 100, dvdVx = 0, dvdVy = 0, dvdLastT = 0;
let dvdCorners = parseInt(sessionStorage.getItem('cuceu-dvd-corners') || '0', 10);

function dvdBounds() {
    return {
        top: tickerTopEl.offsetHeight,
        bottom: container.clientHeight - tickerBottomEl.offsetHeight,
        left: 0, right: container.clientWidth
    };
}
function setDvdArt(url) { dvdArt.src = url; }

function celebrateCorner() {
    dvdCorners++;
    sessionStorage.setItem('cuceu-dvd-corners', String(dvdCorners));
    dvdBadge.textContent = dvdCorners;
    dvdBadge.classList.add('show');
    dvdBox.classList.remove('corner-pop');
    void dvdBox.offsetWidth;
    dvdBox.classList.add('corner-pop');
}

function initDvdPosition() {
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180, h = dvdBox.offsetHeight || 180;
    dvdX = b.left + Math.random() * Math.max(1, b.right - b.left - w);
    dvdY = b.top + Math.random() * Math.max(1, b.bottom - b.top - h);
    const speed = (window.innerWidth < 600 ? 120 : 170) / Math.SQRT2;   // perfect 45° diagonals
    dvdVx = (Math.random() < 0.5 ? -1 : 1) * speed;
    dvdVy = (Math.random() < 0.5 ? -1 : 1) * speed;
}
function dvdFrame(now) {
    if (currentMode !== 'dvd') return;
    const dt = Math.min((now - dvdLastT) / 1000, 0.05);
    dvdLastT = now;
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180, h = dvdBox.offsetHeight || 180;
    dvdX += dvdVx * dt; dvdY += dvdVy * dt;
    let hitX = false, hitY = false;
    if (dvdX <= b.left)       { dvdX = b.left;       dvdVx = Math.abs(dvdVx);  hitX = true; }
    if (dvdX + w >= b.right)  { dvdX = b.right - w;  dvdVx = -Math.abs(dvdVx); hitX = true; }
    if (dvdY <= b.top)        { dvdY = b.top;        dvdVy = Math.abs(dvdVy);  hitY = true; }
    if (dvdY + h >= b.bottom) { dvdY = b.bottom - h; dvdVy = -Math.abs(dvdVy); hitY = true; }
    if (hitX && hitY) celebrateCorner();
    dvdBox.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function startDvd() {
    setDvdArt(currentArtUrl || 'cuceugrta.png');
    if (dvdCorners > 0) { dvdBadge.textContent = dvdCorners; dvdBadge.classList.add('show'); }
    const begin = () => { initDvdPosition(); dvdLastT = performance.now(); dvdAnimId = requestAnimationFrame(dvdFrame); };
    if (dvdArt.complete && dvdArt.naturalWidth > 0) begin();
    else dvdArt.onload = begin;
}
function resumeDvd() {
    if (dvdAnimId) cancelAnimationFrame(dvdAnimId);
    dvdLastT = performance.now();
    dvdAnimId = requestAnimationFrame(dvdFrame);
}
function stopDvd() { if (dvdAnimId) { cancelAnimationFrame(dvdAnimId); dvdAnimId = null; } }

new ResizeObserver(() => {
    if (currentMode !== 'dvd') return;
    const b = dvdBounds();
    const w = dvdBox.offsetWidth || 180, h = dvdBox.offsetHeight || 180;
    dvdX = Math.min(Math.max(dvdX, b.left), b.right - w);
    dvdY = Math.min(Math.max(dvdY, b.top), b.bottom - h);
}).observe(container);

// ── RESTORE LAST MODE ─────────────────────────────────────────
const savedMode = CuceuStore.get('cuceu-fm-mode', 'clean');
if (savedMode !== 'clean' && (savedMode === 'dvd' || ENGINE_MODES.includes(savedMode))) {
    setMode(savedMode);
}
renderPlayState();
</script>
</body>
</html>
