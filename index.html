<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUCEU</title>
    <style>
        /* PLAIN WHITE BRUTALIST MAC BACKGROUND */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- MAC OS TOP MENU BAR --- */
        .mac-topbar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 35px;
            background: #ffffff;
            border-bottom: 3px solid #000; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            font-weight: 700;
            font-size: 14px;
            color: #000;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .apple-logo {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon {
            display: flex;
            align-items: center;
        }

        /* --- THE MASSIVE CENTER LOGO --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: clamp(5rem, 20vw, 20rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -8px;
            margin: 0;
            color: #000;
            line-height: 0.8;
            cursor: default;
        }

        /* --- THE BRUTALIST MAC DOCK --- */
        .mac-dock-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .mac-dock {
            background: #ffffff;
            border: 4px solid #000;
            border-radius: 25px;
            padding: 15px 25px;
            display: flex;
            gap: 20px;
            box-shadow: 8px 8px 0 #d3d3d3; 
            align-items: flex-end;
        }

        .dock-app {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .app-icon {
            width: 65px;
            height: 65px;
            background: #000;
            color: #fff;
            border-radius: 16px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            border: 3px solid #000;
            box-shadow: inset 0 0 0 2px #fff; 
            transition: transform 0.2s ease;
        }

        .app-indicator {
            width: 6px;
            height: 6px;
            background-color: #000;
            border-radius: 50%;
            margin-top: 8px;
        }

        .app-tooltip {
            position: absolute;
            top: -45px;
            background: #ffffff;
            border: 3px solid #000;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        .dock-app:hover {
            transform: translateY(-15px) scale(1.1);
        }

        .dock-app:hover .app-tooltip {
            opacity: 1;
        }

        .dock-app:active .app-icon {
            transform: scale(0.9);
            background: #333;
        }

        /* --- THE LIQUID GLASS GENIE OVERLAY --- */
        .genie-overlay {
            position: fixed;
            bottom: 45px; 
            left: 50%;
            margin-left: -32.5px; 
            width: 65px;
            height: 65px;
            
            /* Liquid Glass Effect */
            background: rgba(0, 0, 0, 0.4); /* Semi-transparent dark tint */
            backdrop-filter: blur(25px); /* Creates the heavy glass blur */
            -webkit-backdrop-filter: blur(25px); /* Safari support for the blur */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Subtle glass edge shine */
            
            border-radius: 16px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transform-origin: bottom center;
            transition: all 0.6s cubic-bezier(0.8, 0, 0.2, 1); 
        }

        .genie-overlay.expand {
            opacity: 1;
            transform: scale(50); 
        }
    </style>
</head>
<body>

    <div class="mac-topbar">
        <div class="topbar-left">
            <span class="apple-logo"></span>
            <span>CUCEU Studio</span>
        </div>
        <div class="topbar-right">
            <div class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            </div>
            <div class="icon">
                <svg width="24" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line><rect x="4" y="9" width="12" height="6" fill="currentColor"></rect></svg>
            </div>
            <span id="mac-clock">Sat 12:40 AM</span>
        </div>
    </div>

    <div class="main-content">
        <h1>CUCEU</h1>
    </div>

    <div class="mac-dock-container">
        <div class="mac-dock">
            <a href="/fm" class="dock-app" id="fm-app">
                <div class="app-tooltip">CUCEU.fm</div>
                <div class="app-icon">.fm</div>
                <div class="app-indicator"></div>
            </a>
        </div>
    </div>

    <div id="genie" class="genie-overlay"></div>

    <script>
        // Clock Logic
        function updateClock() {
            const now = new Date();
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const day = days[now.getDay()];
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            const timeString = `${day} ${hours}:${minutes} ${ampm}`;
            document.getElementById('mac-clock').innerText = timeString;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // --- THE GENIE TRANSITION MAGIC ---
        const appIcon = document.getElementById('fm-app');
        const genieOverlay = document.getElementById('genie');

        appIcon.addEventListener('click', (e) => {
            e.preventDefault(); 
            
            // Trigger the liquid glass explosion
            genieOverlay.classList.add('expand');
            
            // Wait exactly 550ms, then teleport
            setTimeout(() => {
                window.location.href = "/fm";
            }, 550); 
        });

        // --- THE BACK-BUTTON FIX ---
        // If the browser tries to load this page from the cache (like when pressing back), instantly reset the animation
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                genieOverlay.classList.remove('expand');
            }
        });
    </script>

</body>
</html>
