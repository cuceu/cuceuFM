<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f4f4f4;
        }
        .app-badge {
            display: flex;
            align-items: center;
        }
        .recording-dot {
            width: 8px;
            height: 8px;
            background-color: red;
            border-radius: 50%;
            margin-right: 8px;
        }
        .app-icon {
            font-size: 24px;
            color: #666;
        }
        .dock-app {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
        }
        .dock-app:hover {
            text-decoration: underline;
        }
        #page-transition-overlay.leaving {
            opacity: 0;
        }
        .now-playing-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: none;
        }
        .now-playing-banner.visible {
            display: block;
        }
        #banner-art {
            max-width: 100%;
            height: auto;
            display: none;
        }
        #banner-art.has-art {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="#" class="dock-app internal-link">
            <div class="app-tooltip">CUEUPNGS</div>
            <img src="path-to-your-image.png" alt="CUEUPNGS Logo" class="app-icon">
        </a>
        <a href="#" class="dock-app internal-link">
            <div class="app-tooltip">STATUS</div>
            <div class="app-badge visible">
                <div class="recording-dot"></div>
                <span id="fm-badge-text">STATUS...</span>
            </div>
            <div class="app-icon .fm">
                CUEUPNGS
            </div>
        </a>
        <a href="/bin" class="dock-app internal-link">
            <div class="app-tooltip">Trash</div>
            <div class="app-icon icon-trash">
                Trash
            </div>
        </a>
    </div>

    <div id="page-transition-overlay"></div>

    <script>
        // ── PAGE TRANSITIONS ─────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('page-transition-overlay');
            requestAnimationFrame(() => overlay.classList.add('loaded'));
            document.querySelectorAll('.internal-link').forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    document.body.classList.add('is-exiting');
                    setTimeout(() => { overlay.classList.remove('loaded'); overlay.classList.add('leaving'); }, 500);
                    setTimeout(() => window.location.href = link.href, 900);
                });
            });
        });

        // ── MARQUEE FIX — pause on hide, resume on show ──────────────────
        // Animations start PAUSED in CSS. This ensures widths are correct
        // before scrolling begins, and prevents bfcache time-drift entirely.
        function setMarqueeState(state) {
            document.querySelectorAll('.marquee-track').forEach(t => {
                t.style.animationPlayState = state;
            });
        }

        window.addEventListener('load',           () => setMarqueeState('running'));
        window.addEventListener('pagehide',       () => setMarqueeState('paused'));
        document.addEventListener('visibilitychange', () => setMarqueeState(document.hidden ? 'paused' : 'running'));
        window.addEventListener('pageshow', e => {
            setMarqueeState('running');
            if (e.persisted) {
                const ov = document.getElementById('page-transition-overlay');
                ov.classList.remove('loaded','leaving');
                document.body.classList.remove('is-exiting');
                requestAnimationFrame(() => ov.classList.add('loaded'));
            }
        });

        // ── CLOCK — MONDAY | 1:24 AM ─────────────────────────────────────
        const DAYS = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
        function updateClock() {
            const n = new Date();
            const h = n.getHours() % 12 || 12;
            const m = n.getMinutes().toString().padStart(2,'0');
            const ap = n.getHours() >= 12 ? 'PM' : 'AM';
            document.getElementById('mac-clock').innerText = `${DAYS[n.getDay()]} | ${h}:${m} ${ap}`;
        }
        updateClock(); setInterval(updateClock, 1000);

        // ── STREAM STATUS + NOW PLAYING BANNER ───────────────────────────
        let bannerShown = false;

        async function checkStream() {
            const proxy = "https://api.allorigins.win/raw?url=" +
                encodeURIComponent("https://stream.cuceu.co.uk/status-json.xsl?t=" + Date.now());
            try {
                const data = await fetch(proxy, { cache: "no-store" }).then(r => r.json());
                const src  = data.icestats.source;
                if (src) {
                    const title = Array.isArray(src) ? (src[0].title||"ON AIR") : (src.title||"ON AIR");
                    document.getElementById('fm-badge-text').innerText = "ON AIR";
                    document.getElementById('fm-badge').classList.add('visible');
                    document.getElementById('banner-track').textContent = title;
                    if (!bannerShown) {
                        bannerShown = true;
                        try {
                            const artUrl = (await fetch('https://stream.cuceu.co.uk/artwork.txt?t=' + Date.now()).then(r => r.text())).trim();
                            if (artUrl.startsWith('http')) {
                                const img = document.getElementById('banner-art');
                                img.onload = () => img.classList.add('has-art');
                                img.src = artUrl;
                            }
                        } catch(_) {}
                        setTimeout(() => {
                            document.getElementById('now-playing-banner').classList.add('visible');
                            document.body.classList.add('banner-active');
                        }, 2500);
                    }
                } else {
                    bannerShown = false;
                    document.getElementById('now-playing-banner').classList.remove('visible');
                    document.body.classList.remove('banner-active');
                    document.getElementById('fm-badge-text').innerText = "OFFLINE";
                    document.getElementById('fm-badge').classList.add('visible');
                }
            } catch(_) {
                document.getElementById('fm-badge-text').innerText = "OFFLINE";
                document.getElementById('fm-badge').classList.add('visible');
            }
        }
        checkStream(); setInterval(checkStream, 15000);
    </script>
</body>
</html>
