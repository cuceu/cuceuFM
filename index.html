<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22>C</text></svg>">
    <style>
        html, body {
            margin: 0; padding: 0;
            height: 100vh; height: 100dvh;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
            color: #000;
        }

        /* ── PAGE TRANSITION ─────────────────────────────────────────── */
        #page-transition-overlay {
            position: fixed; inset: 0; background: #fff;
            z-index: 99999; pointer-events: none; opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.25,1,0.5,1);
        }
        #page-transition-overlay.loaded  { opacity: 0; }
        #page-transition-overlay.leaving { opacity: 1; pointer-events: auto; }

        /* ── NOW PLAYING BANNER ──────────────────────────────────────── */
        #now-playing-banner {
            position: absolute; top: 0; left: 0; right: 0;
            height: 62px; background: #fff;
            border-bottom: 3px solid #000;
            z-index: 120;
            transform: translateY(-100%);
            transition: transform 0.55s cubic-bezier(0.25,1,0.5,1);
        }
        #now-playing-banner.visible { transform: translateY(0); }
        body.is-exiting #now-playing-banner {
            transition: transform 0.30s cubic-bezier(0.25,1,0.5,1);
            transform: translateY(-100%);
        }
        .banner-inner {
            display: flex; align-items: center;
            height: 100%; padding: 0 24px; gap: 14px;
        }
        .banner-live-dot {
            width: 8px; height: 8px; flex-shrink: 0;
            background: #ff3b30; border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,59,48,0.85);
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { transform: scale(0.8); opacity: 0.7; }
            50%      { transform: scale(1.3); opacity: 1; }
        }
        #banner-art {
            width: 40px; height: 40px; border-radius: 3px;
            border: 1.5px solid #000; object-fit: cover; flex-shrink: 0;
            opacity: 0; transition: opacity 0.35s ease;
        }
        #banner-art.has-art { opacity: 1; }
        .banner-info { flex: 1; min-width: 0; }
        .banner-label {
            display: block; font-size: 8px; font-weight: 900;
            letter-spacing: 2.5px; color: #ff3b30; text-transform: uppercase;
        }
        #banner-track {
            display: block; font-size: 13px; font-weight: 800;
            color: #000; text-transform: uppercase; letter-spacing: 0.8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .banner-btn {
            flex-shrink: 0; background: #000; color: #fff;
            font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
            text-transform: uppercase; text-decoration: none;
            padding: 9px 18px; border: 2px solid #000; white-space: nowrap;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .banner-btn:hover { background: #ff3b30; border-color: #ff3b30; }

        /* ── CLOCK ───────────────────────────────────────────────────── */
        .status-area {
            position: absolute; top: 25px; right: 30px;
            display: flex; align-items: center; z-index: 100;
            font-size: clamp(11px, 1.3vw, 15px);
            font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            color: #000;
            text-shadow: 0 0 15px #fff, 0 0 30px #fff, 0 0 45px rgba(255,255,255,0.9);
            opacity: 0; transform: translateX(15px);
            animation: clockIn 0.8s cubic-bezier(0.25,1,0.5,1) 0.5s forwards;
            transition: top 0.55s cubic-bezier(0.25,1,0.5,1);
        }
        body.banner-active .status-area { top: 78px; }
        body.is-exiting   .status-area { animation: clockOut 0.5s cubic-bezier(0.25,1,0.5,1) forwards; }
        @keyframes clockIn  { 0%{opacity:0;transform:translateX(15px);filter:blur(3px)} 100%{opacity:1;transform:none;filter:none} }
        @keyframes clockOut { 0%{opacity:1;transform:none} 100%{opacity:0;transform:translateX(15px);filter:blur(3px)} }

        /* ── MARQUEE BACKGROUND ──────────────────────────────── */
        .main-content { flex-grow:1; display:flex; align-items:center; justify-content:center; position:relative; }

        #logo-wrapper {
            position: absolute; top: 50px; left: 0;
            width: 100vw; height: calc(100dvh - 160px);
            display: flex; flex-direction: column; justify-content: center;
            overflow: hidden; pointer-events: none;
        }
        body.is-exiting #logo-wrapper { animation: glideOut 0.6s cubic-bezier(0.25,1,0.5,1) forwards; }
        @keyframes glideOut { to { opacity:0; transform:translateY(30px) scale(0.95); } }

        .marquee-track {
            display: flex; flex-wrap: nowrap;
            width: max-content; will-change: transform;
            margin-top: -0.8vw;
        }

        .track-right { animation: scrollRight 30s linear infinite; animation-play-state: paused; }
        .track-left  { animation: scrollLeft  30s linear infinite; animation-play-state: paused; }

        @keyframes scrollRight { 0%{transform:translateX(-50%)} 100%{transform:translateX(0%)} }
        @keyframes scrollLeft  { 0%{transform:translateX(0%)}   100%{transform:translateX(-50%)} }

        img.cuceu-img {
            height: clamp(3rem,4.5vw,6rem); width: auto;
            margin-right: 1vw; flex-shrink: 0;
            user-select: none; -webkit-user-drag: none; opacity: 0;
        }

        @keyframes dropInOdd  { 0%{opacity:0;transform:translateY(-50px)}           100%{opacity:1;transform:none} }
        @keyframes dropInEven { 0%{opacity:0;transform:translateY(-50px) rotate(180deg)} 100%{opacity:1;transform:rotate(180deg)} }

        .marquee-track:nth-child(odd)  img.cuceu-img { animation: dropInOdd  0.6s cubic-bezier(0.1,0.9,0.2,1) both; }
        .marquee-track:nth-child(even) img.cuceu-img { animation: dropInEven 0.6s cubic-bezier(0.1,0.9,0.2,1) both; }
        
        .marquee-track:nth-child(1) img.cuceu-img { animation-delay:.1s }
        .marquee-track:nth-child(2) img.cuceu-img { animation-delay:.3s }
        .marquee-track:nth-child(3) img.cuceu-img { animation-delay:.5s }
        .marquee-track:nth-child(4) img.cuceu-img { animation-delay:.7s }
        .marquee-track:nth-child(5) img.cuceu-img { animation-delay:.9s }
        .marquee-track:nth-child(6) img.cuceu-img { animation-delay:1.1s }
        .marquee-track:nth-child(7) img.cuceu-img { animation-delay:1.3s }
        .marquee-track:nth-child(8) img.cuceu-img { animation-delay:1.5s }

        /* ── LIQUID GLASS DOCK ───────────────────────────────────────── */
        .mac-dock-container {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }

        .mac-dock {
            background: linear-gradient(170deg,
                rgba(255,255,255,0.30) 0%,
                rgba(255,255,255,0.10) 55%,
                rgba(255,255,255,0.20) 100%
            );
            backdrop-filter: blur(55px) saturate(200%) brightness(1.08);
            -webkit-backdrop-filter: blur(55px) saturate(200%) brightness(1.08);
            border: 1px solid rgba(255,255,255,0.60);
            border-top-color: rgba(255,255,255,0.85);
            border-bottom-color: rgba(255,255,255,0.30);
            border-radius: 28px;
            padding: 10px 16px;
            display: flex; gap: 12px; align-items: center;
            box-shadow:
                0 12px 48px rgba(0,0,0,0.10),
                0 2px 8px rgba(0,0,0,0.06),
                inset 0 1.5px 0 rgba(255,255,255,0.85),
                inset 0 -1px 0 rgba(255,255,255,0.18),
                inset 1px 0 0 rgba(255,255,255,0.25),
                inset -1px 0 0 rgba(255,255,255,0.25);
            opacity: 0;
            animation: dockSlideUp 0.8s cubic-bezier(0.25,1,0.5,1) 1.2s forwards;
            position: relative;
        }

        .mac-dock::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.32) 0%,
                rgba(255,255,255,0.06) 65%,
                transparent 100%
            );
            border-radius: 30px 30px 50% 50% / 28px 28px 18px 18px;
            pointer-events: none; z-index: 0;
        }

        body.is-exiting .mac-dock { animation: dockSlideDown 0.5s cubic-bezier(0.25,1,0.5,1) forwards; }
        @keyframes dockSlideUp   { 0%{opacity:0;transform:translateY(40px)} 100%{opacity:1;transform:none} }
        @keyframes dockSlideDown { 0%{opacity:1;transform:none} 100%{opacity:0;transform:translateY(40px)} }

        .dock-app {
            text-decoration: none; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: transform 0.3s cubic-bezier(0.25,1,0.5,1);
            position: relative; height: 60px; width: 60px;
            z-index: 1;
        }
        .dock-app.is-open::after {
            content: ''; position: absolute; bottom: 2px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background: rgba(255,255,255,0.95); border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        .dock-app:hover { transform: translateY(-10px); }

        /* Icon Base Styles */
        .app-icon {
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* App Squircle Shape (Used for IG, TD, FM) */
        .squircle {
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        /* Glossy inner border for standard apps */
        .squircle::after {
            content: ''; position: absolute; inset: 0;
            border: 1px solid rgba(255,255,255,0.2);
            border-top-color: rgba(255,255,255,0.5);
            border-bottom-color: rgba(0,0,0,0.1);
            border-radius: inherit; pointer-events: none;
        }

        /* Specific App Colors */
        .icon-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .icon-td { background: #1a1a1a; }
        .icon-fm { background: #000; color: #fff; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .icon-bin { background: transparent; box-shadow: none; width: 56px; height: 56px; margin-bottom: -4px; } /* Bin is slightly larger and freestanding */

        .app-tooltip {
            position: absolute; top: -35px;
            background: rgba(20,20,25,0.88); backdrop-filter: blur(12px);
            padding: 6px 14px; border-radius: 8px;
            font-size: 11px; font-weight: 700; color: #fff;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease; white-space: nowrap; text-transform: uppercase;
        }
        .dock-app:hover .app-tooltip { opacity: 1; }

        .app-badge {
            position: absolute; top: 0px; right: 0px;
            background: rgba(20,20,25,0.92); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            padding: 3px 7px; display: flex; align-items: center; gap: 4px;
            font-size: 8px; font-weight: 800; color: #fff;
            opacity: 0; z-index: 20; pointer-events: none;
        }
        .app-badge.visible { opacity: 1; }
        .recording-dot {
            width: 5px; height: 5px; background: #ff3b30; border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        /* ── MOBILE ──────────────────────────────────────────────────── */
        @media (max-width: 600px) {
            .status-area { font-size: 11px; top: 20px; right: 16px; letter-spacing: 0.8px; }
            body.banner-active .status-area { top: 72px; }
            .track-right, .track-left { animation-duration: 60s; } 
            .mobile-hide { display: none !important; }
            img.cuceu-img { height: 4rem; margin-right: 4vw; }
            .marquee-track { margin-top: -1vw; }
            .mac-dock { gap: 8px; padding: 8px 12px; border-radius: 24px; }
            .dock-app { width: 50px; height: 50px; }
            .app-icon { width: 44px; height: 44px; border-radius: 10px; }
            .icon-fm { font-size: 16px; }
            .icon-bin { width: 48px; height: 48px; }
            #now-playing-banner { height: 54px; }
            .banner-btn { padding: 7px 12px; font-size: 9px; }
            #banner-track { font-size: 11px; }
        }
    </style>
</head>

    <script>
        // ── PAGE TRANSITIONS ─────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('page-transition-overlay');
            requestAnimationFrame(() => overlay.classList.add('loaded'));
            document.querySelectorAll('.internal-link').forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    document.body.classList.add('is-exiting');
                    setTimeout(() => { overlay.classList.remove('loaded'); overlay.classList.add('leaving'); }, 500);
                    setTimeout(() => window.location.href = link.href, 1000); 
                });
            });

            // ── MARQUEE FIX ───────────────────────
            const marqueeTracks = document.querySelectorAll('.marquee-track');
            function setMarqueeState(state) {
                marqueeTracks.forEach(t => t.style.animationPlayState = state);
            }

            setTimeout(() => {
                setMarqueeState('running');
            }, 150);

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    setMarqueeState('running');
                } else {
                    setMarqueeState('paused'); 
                }
            });

            window.addEventListener('pageshow', () => {
                setMarqueeState('running'); 
            });
        });

        // ── CLOCK ─────────────────────────────────────
        const DAYS = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
        function updateClock() {
            const n = new Date();
            const h = n.getHours() % 12 || 12;
            const m = n.getMinutes().toString().padStart(2,'0');
            const ap = n.getHours() >= 12 ? 'PM' : 'AM';
            document.getElementById('mac-clock').innerText = `${DAYS[n.getDay()]} | ${h}:${m} ${ap}`;
        }
        updateClock(); setInterval(updateClock, 1000);

        // ── STREAM STATUS + NOW PLAYING BANNER ───────────────────────────
        let bannerShown = false;

        async function checkStream() {
            const fmBadgeTextEl = document.getElementById('fm-badge-text');
            const fmBadgeEl = document.getElementById('fm-badge');
            const liveDot = fmBadgeEl.querySelector('.recording-dot');
            const nowPlayingBanner = document.getElementById('now-playing-banner');

            try {
                const response = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent("https://stream.cuceu.co.uk/status-json.xsl?t=" + Date.now()));
                if (!response.ok) throw new Error('Network response was not ok.');

                const data = await response.text();
                const src  = data.match(/<title>(.*?)<\/title>/);

                if (src && src[1] && src[1].toLowerCase() !== 'offline') {
                    const title = src[1];
                    
                    fmBadgeTextEl.innerText = "ON AIR";
                    fmBadgeEl.classList.add('visible');
                    liveDot.style.display = 'block'; 

                    document.getElementById('banner-track').textContent = title;
                    if (!bannerShown) {
                        bannerShown = true;
                        try {
                            const artUrlResponse = await fetch('https://stream.cuceu.co.uk/artwork.txt?t=' + Date.now());
                            const artUrl = await artUrlResponse.text();

                            if (artUrl && artUrl.startsWith('http')) {
                                const img = document.getElementById('banner-art');
                                img.onload = () => img.classList.add('has-art');
                                img.src = artUrl;
                            } else {
                                document.getElementById('now-playing-banner').style.opacity = 1;
                            }

                        } catch (e) { }
                        
                        setTimeout(() => {
                            nowPlayingBanner.classList.add('visible');
                            document.body.classList.add('banner-active');
                        }, 2500);
                    }

                } else {
                    if (bannerShown) { 
                         nowPlayingBanner.classList.remove('visible');
                         document.body.classList.remove('banner-active');
                         bannerShown = false;
                    }

                    fmBadgeTextEl.innerText = "OFFLINE";
                    fmBadgeEl.classList.add('visible');
                    liveDot.style.display = 'none'; 
                }

            } catch (e) {
                console.error("Stream check failed:", e);
                 if (bannerShown) { 
                         document.getElementById('now-playing-banner').classList.remove('visible');
                         document.body.classList.remove('banner-active');
                         bannerShown = false;
                    }
                fmBadgeTextEl.innerText = "OFFLINE"; 
                fmBadgeEl.classList.add('visible');
                liveDot.style.display = 'none'; 
            }
        }

        checkStream(); 
        setInterval(checkStream, 15000); 
    </script>
