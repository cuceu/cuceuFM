<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* The Psychedelic Background */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-image: url('https://raw.githubusercontent.com/cuceu/m1-pirate-radio/main/Screenshot%202026-05-15%20at%2015.41.22.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* Centered Brutalist Container */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 900px; 
        }

        /* MASSIVE LOGO */
        h1 {
            font-size: 15vw; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px; 
            margin: 0;
            color: #000; 
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; /* Added a hard white outline so it pops off the background! */
        }

        /* The Live Track ID Container */
        .live-status {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            margin-top: -10px;
            margin-bottom: 50px;
            color: #000; 
            background: #fff; /* Wrapped it in a white box like a sticker */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 20px;
            border: 3px solid #000;
        }

        .pulse-dot {
            height: 15px;
            width: 15px;
            background-color: #ff0000; /* Red dot for that classic recording vibe */
            border-radius: 50%;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        /* BIG BLOCKY BUTTON */
        button {
            background-color: #000; 
            color: #fff; 
            border: 4px solid #fff; 
            padding: 25px 50px;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 0; 
            box-shadow: 10px 10px 0 #fff;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translate(-5px, -5px); 
            box-shadow: 15px 15px 0 #fff; 
        }

        button:active {
            transform: translate(5px, 5px); 
            box-shadow: 0px 0px 0 #fff; 
        }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>CUCEU FM</h1>
        <div class="live-status">
            <div class="pulse-dot"></div> <span id="song-title">Loading Vibe...</span>
        </div>
        <br>
        <button id="btn">▶ Listen</button>
    </div>

    <audio id="radioPlayer" src="https://stream.cuceu.co.uk/stream.mp3" preload="none"></audio>

    <script>
        // --- AUDIO PLAYER LOGIC ---
        const btn = document.getElementById("btn");
        const player = document.getElementById("radioPlayer");
        let playing = false;

        btn.onclick = () => {
            if (!playing) {
                player.src = "https://stream.cuceu.co.uk/stream.mp3?" + new Date().getTime();
                player.play();
                btn.innerText = "⏸ Pause";
            } else {
                player.pause();
                player.src = ""; 
                btn.innerText = "▶ Listen";
            }
            playing = !playing;
        };

        // --- LIVE SONG NAME GRABBER ---
        function fetchSongData() {
            // We use a random number at the end so it doesn't get stuck on an old song
            fetch("https://stream.cuceu.co.uk/status-json.xsl?t=" + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    let title = "LIVE ON AIR"; // Default text
                    let source = data.icestats.source;
                    
                    if (source) {
                        // Icecast formatting magic
                        if (Array.isArray(source)) {
                            title = source[0].title || "LIVE ON AIR";
                        } else {
                            title = source.title || "LIVE ON AIR";
                        }
                    }
                    document.getElementById('song-title').innerText = title;
                })
                .catch(err => {
                    console.log("Waiting for stream data...");
                    document.getElementById('song-title').innerText = "LIVE ON AIR";
                });
        }

        // Run the grabber immediately, and then check again every 10 seconds
        fetchSongData();
        setInterval(fetchSongData, 10000);
    </script>
</body>
</html>
