<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22>C</text></svg>">

    <style>
        html, body {
            margin: 0; padding: 0; 
            height: 100vh; 
            height: 100dvh; 
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
            color: #000000;
        }

        /* --- SMOOTH PAGE TRANSITIONS --- */
        #page-transition-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; z-index: 99999;
            pointer-events: none; opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #page-transition-overlay.loaded { opacity: 0; }
        #page-transition-overlay.leaving { opacity: 1; pointer-events: auto; }

        .status-area {
            position: absolute; top: 25px; right: 30px; display: flex; align-items: center;
            font-size: 17.5px; 
            font-weight: 800; 
            color: #000000; z-index: 100;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,1), 0 0 45px rgba(255,255,255,0.9);
        }

        .main-content {
            flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative;
        }

        /* --- THE IMAGE BACKGROUND & GLITCH --- */
        
        @keyframes subtle-glitch {
            0%, 95% { transform: translate(0, 0) skew(0deg); filter: none; }
            96% { transform: translate(-4px, 2px) skew(-1deg); filter: drop-shadow(4px 0 0 rgba(255,0,0,0.6)); }
            97% { transform: translate(3px, -2px) skew(1deg); filter: drop-shadow(-4px 0 0 rgba(0,0,255,0.6)); }
            98% { transform: translate(0, 0) skew(0deg); filter: none; }
            100% { transform: translate(0, 0) skew(0deg); filter: none; }
        }

        #logo-wrapper {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100vw; 
            height: calc(100dvh - 160px);
            display: flex; flex-direction: column;
            justify-content: center;
            overflow: hidden; 
            pointer-events: none;
            animation: subtle-glitch 8s infinite 2s;
        }
        
        body.is-exiting #logo-wrapper { animation: glideOut 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes glideOut { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(30px) scale(0.95); } }

        .marquee-track {
            display: flex;
            flex-wrap: nowrap; 
            width: max-content;
            will-change: transform;
            margin-top: -0.8vw; 
        }
        .marquee-track:first-child {
            margin-top: 0; 
        }

        .track-right { animation: scrollRight 30s linear infinite; }
        .track-left { animation: scrollLeft 30s linear infinite; }

        @keyframes scrollRight { 0% { transform: translateX(-50%); } 100% { transform: translateX(0%); } }
        @keyframes scrollLeft { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }

        /* Base styles for the logos */
        img.cuceu-img {
            height: clamp(3rem, 4.5vw, 6rem); 
            width: auto; 
            margin-right: 1vw; 
            flex-shrink: 0; 
            user-select: none;
            -webkit-user-drag: none; 
            opacity: 0; /* Hidden initially */
        }

        /* --- THE MECHANICAL DROP-IN ANIMATIONS (Removed Blur & Switched Easing) --- */
        @keyframes dropInMechanical {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Visibility: visible pops them in mechanically when delay ends, linear gives no smooth accel/decel */
        .marquee-track:nth-child(odd) img.cuceu-img {
            animation: dropInMechanical 0.4s linear both;
        }
        
        /* Account for rotation on even rows */
        .marquee-track:nth-child(even) img.cuceu-img {
            transform: rotate(180deg);
            animation: dropInMechanical 0.4s linear both;
            transform-origin: center;
        }
        
        /* Crucial fix to ensure rotation is respected DURING the mechanical pop-in on even rows */
        @keyframes dropInMechanical {
             0% { opacity: 0; transform: translateY(-30px) inherit; }
             100% { opacity: 1; transform: translateY(0) inherit; }
        }
        
        /* Overriding to handle specific even row rotation mechanics */
        @keyframes dropInMechanicalEven {
             0% { opacity: 0; transform: translateY(-30px) rotate(180deg); }
             100% { opacity: 1; transform: translateY(0) rotate(180deg); }
        }

        .marquee-track:nth-child(even) img.cuceu-img {
            animation-name: dropInMechanicalEven;
        }

        /* Stagger the segmented entrance line by line (Removed easing for mechanical 'snap') */
        .marquee-track img.cuceu-img {
            /* Using steps(1) means they are hidden until delay ends, then snapshot to 100% state instantly */
            animation-timing-function: steps(1, end); 
        }

        .marquee-track:nth-child(1) img.cuceu-img { animation-delay: 0.1s; }
        .marquee-track:nth-child(2) img.cuceu-img { animation-delay: 0.2s; }
        .marquee-track:nth-child(3) img.cuceu-img { animation-delay: 0.3s; }
        .marquee-track:nth-child(4) img.cuceu-img { animation-delay: 0.4s; }
        .marquee-track:nth-child(5) img.cuceu-img { animation-delay: 0.5s; }
        .marquee-track:nth-child(6) img.cuceu-img { animation-delay: 0.6s; }
        .marquee-track:nth-child(7) img.cuceu-img { animation-delay: 0.7s; }
        .marquee-track:nth-child(8) img.cuceu-img { animation-delay: 0.8s; }
        .marquee-track:nth-child(9) img.cuceu-img { animation-delay: 0.9s; }
        .marquee-track:nth-child(10) img.cuceu-img { animation-delay: 1.0s; }

        /* --- THE DOCK --- */
        .mac-dock-container {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }
        .mac-dock {
            background: rgba(30, 30, 35, 0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 28px;
            padding: 8px 16px; display: flex; gap: 12px; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            opacity: 0;
            /* Dock snaps in mechanically after logos */
            animation: dockSnapIn 0.01s steps(1) 1.2s forwards; 
        }
        
        body.is-exiting .mac-dock { animation: dockSlideDown 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes dockSnapIn { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes dockSlideDown { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(40px); } }

        .dock-app {
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            color: #fff; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative; height: 70px; justify-content: center;
        }
        
        .dock-app.is-open::after {
            content: '';
            position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }

        .app-icon {
            width: 52px; height: 52px; background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 900;
        }

        /* Scaled Down Icons */
        .icon-ig { 
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important; 
            border: none !important; backdrop-filter: none !important; box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .icon-ig svg { width: 34px; height: 34px; }

        .icon-td {
            background: linear-gradient(180deg, #f4f4f4, #e2e2e2) !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important; box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .icon-td svg { width: 36px; height: 36px; border-radius: 2px;}

        .icon-trash { background: rgba(255, 255, 255, 0.1); }
        .icon-trash svg { width: 38px; height: 38px; margin-top: 2px; }
        
        .app-tooltip {
            position: absolute; top: -35px; background: rgba(30, 30, 35, 0.85); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 10px; font-size: 11px; font-weight: 700;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease; white-space: nowrap; text-transform: uppercase;
        }
        .dock-app:hover .app-tooltip { opacity: 1; }
        .dock-app:hover { transform: translateY(-10px); }

        /* Status Badge */
        .app-badge {
            position: absolute; top: -4px; right: -8px; background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; padding: 3px 7px; display: flex; align-items: center; gap: 4px;
            font-size: 8px; font-weight: 800; color: #ffffff; opacity: 0; z-index: 20; 
        }
        .app-badge.visible { opacity: 1; }
        .recording-dot { width: 5px; height: 5px; background-color: #ff3b30; border-radius: 50%; animation: subtle-pulse 2s infinite ease-in-out; }
        @keyframes subtle-pulse { 0% { transform: scale(0.8); opacity: 0.6; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.6; } }

        @media (max-width: 600px) {
            img.cuceu-img { height: 4rem; margin-right: 4vw; margin-top: -3vw;} 
            .marquee-track { margin-top: -3vw; }
            .mac-dock { gap: 10px; padding: 8px 15px; }
            .app-icon { width: 48px; height: 48px; font-size: 1.3rem; }
            .icon-td svg { width: 30px; height: 30px; }
            .dock-app.is-open::after { bottom: 2px; width: 4px; height: 4px; }
        }
    </style>
</head>
