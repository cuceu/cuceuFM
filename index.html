<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu — under maintenance</title>
    <meta name="description" content="CUCEU is under maintenance. Back shortly.">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="CUCEU — Under Maintenance">
    <meta property="og:description" content="Reworking things behind the scenes. Back shortly.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cuceu.co.uk">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22>C</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#000; --ink:#f2f0eb; --dim:#6b6b6b; --line:#262626; --acid:#ff4d00;
            --mono:'Space Mono', ui-monospace, monospace;
            --disp:'Archivo', system-ui, sans-serif;
        }
        body:not(.dark-mode) { --bg:#f4f2ec; --ink:#14110d; --dim:#8a857a; --line:#d8d4ca; --acid:#f23c00; }

        * { box-sizing:border-box; margin:0; }
        html, body { height:100dvh; overflow:hidden; }
        body { background:var(--bg); color:var(--ink); font-family:var(--disp);
            display:flex; flex-direction:column;
            transition:background 0.4s ease, color 0.4s ease; }

        /* ── MONO TICKERS (top + bottom rails) ───────── */
        .ticker { flex-shrink:0; overflow:hidden; white-space:nowrap; background:var(--bg);
            font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px;
            text-transform:uppercase; color:var(--dim); padding:9px 0; z-index:30; }
        .ticker-top { border-bottom:1px solid var(--line); }
        .ticker-bottom { border-top:1px solid var(--line); }
        .ticker-inner { display:inline-block; will-change:transform;
            animation:slide 34s linear infinite; }
        .ticker-bottom .ticker-inner { animation-direction:reverse; }
        .ticker-inner span { padding:0 18px; }
        .ticker-inner .hot { color:var(--acid); }
        @keyframes slide { from{transform:translateX(0)} to{transform:translateX(-50%)} }

        /* ── HEADER ──────────────────────────────────── */
        .head { flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
            padding:14px 24px; z-index:30; background:var(--bg); }
        .wordmark { font-family:var(--disp); font-size:18px; font-weight:800;
            letter-spacing:-0.6px; color:var(--ink); line-height:1; }
        .head-right { display:flex; align-items:center; gap:16px; }
        #clock { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:1px;
            color:var(--dim); white-space:nowrap; }
        .tog { width:28px; height:28px; border:1px solid var(--line); background:transparent;
            color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:background 0.2s, color 0.2s; }
        .tog:hover { background:var(--ink); color:var(--bg); }
        .tog svg { width:15px; height:15px; }
        .tog .icon-sun { display:none; }
        body.dark-mode .tog .icon-sun { display:block; }
        body.dark-mode .tog .icon-moon { display:none; }

        /* ── STAGE ───────────────────────────────────── */
        #main { flex:1; position:relative; min-height:0; overflow:hidden; }

        /* The copy scrolls in its own layer above the fixed wall, so cramped
           viewports (landscape phones) never clip the buttons.
           `margin:auto 0` centres it but collapses to 0 once it overflows. */
        #scroller { position:absolute; inset:0; z-index:2; overflow-y:auto;
            display:flex; flex-direction:column; }

        /* Graffiti wall, dropped right back so it reads as texture only */
        #wall { position:absolute; inset:0; display:flex; flex-direction:column;
            justify-content:center; gap:0.4vw; overflow:hidden;
            pointer-events:none; opacity:0.10; }
        .wall-row { display:flex; flex-wrap:nowrap; width:max-content; will-change:transform;
            animation:drift 90s linear infinite; }
        .wall-row:nth-child(even) { animation-direction:reverse; }
        .wall-row:nth-child(even) img { transform:rotate(180deg); }
        .wall-row img { height:clamp(3rem, 4.6vw, 6rem); width:auto; margin-right:1.4vw;
            flex-shrink:0; user-select:none; -webkit-user-drag:none; }
        @keyframes drift { from{transform:translateX(0)} to{transform:translateX(-50%)} }

        .panel { margin:auto 0; width:100%; padding:22px 24px; }

        .status { display:flex; align-items:center; gap:9px; margin-bottom:22px;
            font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px;
            text-transform:uppercase; color:var(--dim); }
        .status .dot { width:8px; height:8px; flex-shrink:0; background:var(--acid);
            animation:blink 1.1s steps(2) infinite alternate; }
        .status .hot { color:var(--acid); }
        @keyframes blink { from{opacity:1} to{opacity:0.3} }

        h1 { font-family:var(--disp); font-weight:900;
            font-size:clamp(34px, min(11.2vw, 22vh), 168px); line-height:0.86;
            letter-spacing:-0.04em; text-transform:uppercase;
            overflow-wrap:anywhere; }
        h1 .acid { color:var(--acid); }

        .blurb { margin-top:26px; max-width:44ch;
            font-family:var(--mono); font-size:13px; line-height:1.75; color:var(--dim); }
        .blurb b { color:var(--ink); font-weight:700; }

        .actions { margin-top:32px; display:flex; flex-wrap:wrap; gap:10px; }
        .btn { display:inline-flex; align-items:center; gap:9px;
            font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px;
            text-transform:uppercase; text-decoration:none; padding:12px 20px;
            background:var(--acid); color:#000; transition:filter 0.2s; }
        .btn:hover { filter:brightness(1.12); }
        .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line);
            transition:background 0.2s, color 0.2s; }
        .btn.ghost:hover { background:var(--ink); color:var(--bg); filter:none; }
        .btn svg { width:14px; height:14px; }

        @media (max-width:680px) {
            .head { padding:11px 14px; }
            .wordmark { font-size:17px; }
            .panel { padding:22px 14px; }
            .ticker { font-size:10px; letter-spacing:1.5px; padding:8px 0; }
            .blurb { margin-top:20px; font-size:12px; }
            .actions { margin-top:26px; }
            .btn { flex:1 1 100%; justify-content:center; }
            #wall img { height:2.3rem; margin-right:3.5vw; }
        }

        /* Landscape phones / short windows — tighten the whole stack. */
        @media (max-height:560px) {
            h1 { font-size:clamp(30px, min(9vw, 15vh), 92px); }
            .panel { padding-top:12px; padding-bottom:12px; }
            .status { margin-bottom:10px; }
            .blurb { margin-top:10px; line-height:1.6; }
            .actions { margin-top:12px; }
            .btn { padding:10px 18px; }
        }

        @media (prefers-reduced-motion:reduce) {
            .ticker-inner, .wall-row, .status .dot { animation:none; }
        }
    </style>
</head>
<body>
<script>
    // Applied before paint so the page never flashes the wrong theme.
    // Same contract as CuceuTheme in shared.js: localStorage 'cuceu-theme', else system.
    (() => {
        const saved = localStorage.getItem('cuceu-theme');
        const dark = saved === 'dark' ? true
                   : saved === 'light' ? false
                   : window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? true;
        document.body.classList.toggle('dark-mode', dark);
    })();
</script>

    <div class="ticker ticker-top" aria-hidden="true"><div class="ticker-inner" id="ticker-a"></div></div>

    <header class="head">
        <span class="wordmark">cuceu</span>
        <div class="head-right">
            <span id="clock">SAT / 00.00.00</span>
            <button class="tog" id="theme-toggle" aria-label="Toggle theme">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </header>

    <main id="main">
        <div id="wall" aria-hidden="true"></div>

        <div id="scroller">
        <div class="panel">
            <p class="status"><span class="dot"></span> Status <span class="hot">/ Offline</span> / Maintenance</p>

            <h1>Under<br><span class="acid">Maintenance</span></h1>

            <p class="blurb">
                We're reworking things behind the scenes.
                <b>cuceu.co.uk</b> will be back shortly.
            </p>

            <div class="actions">
                <a class="btn" href="https://www.instagram.com/cuceuuu/" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    Updates ↗
                </a>
                <button class="btn ghost" id="retry">Retry</button>
            </div>
        </div>
        </div>
    </main>

    <div class="ticker ticker-bottom" aria-hidden="true"><div class="ticker-inner" id="ticker-b"></div></div>

<script>
    'use strict';

    /* ── THEME TOGGLE ─────────────────────────────────── */
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const nowDark = !document.body.classList.contains('dark-mode');
        document.body.classList.toggle('dark-mode', nowDark);
        localStorage.setItem('cuceu-theme', nowDark ? 'dark' : 'light');
    });

    /* ── RAW CLOCK (matches CuceuClock's site-wide format) ── */
    const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const clockEl = document.getElementById('clock');
    const pad = n => String(n).padStart(2, '0');
    const tick = () => {
        const d = new Date();
        const time = `${pad(d.getHours())}.${pad(d.getMinutes())}.${pad(d.getSeconds())}`;
        clockEl.textContent = window.innerWidth < 680 ? time : `${DAYS[d.getDay()]} / ${time}`;
    };
    tick();
    setInterval(tick, 1000);

    /* ── TICKERS ──────────────────────────────────────── */
    // Content is duplicated so the -50% translate loops seamlessly.
    const MSG = ['Under Maintenance', 'Back Soon', 'cuceu.co.uk', 'Under Maintenance', 'Stay Tuned'];
    const unit = MSG.map((m, i) => `<span${i % 2 ? ' class="hot"' : ''}>${m}</span><span>—</span>`).join('');
    const half = unit.repeat(6);
    document.getElementById('ticker-a').innerHTML = half + half;
    document.getElementById('ticker-b').innerHTML = half + half;

    /* ── GRAFFITI WALL ────────────────────────────────── */
    // Measure one row, then append until the stage is overfilled (same trick as home).
    const wall = document.getElementById('wall');
    const PER_ROW = 14; // duplicated below, so -50% drift loops seamlessly
    const buildRow = () => {
        const row = document.createElement('div');
        row.className = 'wall-row';
        row.innerHTML = `<img src="cuceugrta.png" alt="">`.repeat(PER_ROW * 2);
        return row;
    };
    const fillWall = () => {
        wall.innerHTML = '';
        const probe = buildRow();
        wall.appendChild(probe);
        const rowH = probe.getBoundingClientRect().height || 60;
        const need = Math.max(3, Math.ceil((wall.clientHeight * 1.15) / rowH));
        for (let i = 1; i < need; i++) wall.appendChild(buildRow());
    };
    fillWall();
    addEventListener('resize', () => { fillWall(); tick(); });

    /* ── RETRY ────────────────────────────────────────── */
    document.getElementById('retry').addEventListener('click', () => location.reload());
</script>
</body>
</html>
