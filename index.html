<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUCEU</title>
    <style>
        /* STARK WHITE BACKDROP */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #000000;
        }

        /* --- FLOATING STATUS AREA (Replaces Top Bar) --- */
        .status-area {
            position: absolute;
            top: 25px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #000000;
            z-index: 100;
            letter-spacing: 0.5px;
        }

        .battery-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            /* Hidden by default until JS confirms API support */
            display: none; 
        }

        .battery-outline {
            width: 24px;
            height: 12px;
            border: 1.5px solid #000;
            border-radius: 4px;
            padding: 1.5px;
            position: relative;
            display: flex;
        }

        .battery-outline::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 2px;
            width: 2px;
            height: 6px;
            background: #000;
            border-radius: 0 2px 2px 0;
        }

        .battery-fill {
            height: 100%;
            background-color: #000;
            border-radius: 2px;
            width: 100%; 
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* --- THE STARK CENTER LOGO --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1#cuceu-logo {
            font-size: clamp(5rem, 20vw, 20rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -8px;
            margin: 0;
            
            color: #000000;
            background: none;
            -webkit-text-fill-color: currentcolor;
            filter: none;
            
            cursor: default;
            line-height: 0.8;
            transition: all 0.7s cubic-bezier(0.8, 0, 0.2, 1);
            transform-origin: center center;
            position: relative;
            z-index: 5;
        }

        h1#cuceu-logo.glide-down {
            transform: translateY(15vh) scale(0.9);
            opacity: 0;
        }

        /* --- THE PREMIUM MIDNIGHT DOCK --- */
        .mac-dock-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .mac-dock {
            background: rgba(30, 30, 35, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 15px 25px;
            display: flex;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            align-items: flex-end;
        }

        .dock-app {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        /* Glassy Grey App Icon */
        .app-icon {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-radius: 18px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), inset 0 2px 4px rgba(255,255,255,0.4); 
            transition: transform 0.2s ease;
        }

        .app-indicator {
            width: 5px;
            height: 5px;
            background-color: #ffffff; 
            border-radius: 50%;
            margin-top: 8px;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .app-tooltip {
            position: absolute;
            top: -45px;
            background: rgba(30, 30, 35, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .dock-app:hover {
            transform: translateY(-15px) scale(1.1);
        }

        .dock-app:hover .app-tooltip {
            opacity: 1;
        }

        .dock-app:active .app-icon {
            transform: scale(0.9);
            filter: brightness(0.8);
        }

        /* --- THE LIQUID GLASS GENIE FIX --- */
        .genie-overlay {
            position: fixed;
            bottom: 45px; 
            left: 50%;
            margin-left: -32.5px; 
            width: 65px;
            height: 65px;
            
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px); 
            
            border-radius: 18px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transform-origin: bottom center;
            transition: all 0.6s cubic-bezier(0.8, 0, 0.2, 1); 
        }

        .genie-overlay.expand {
            opacity: 1;
            transform: scale(60); 
        }
    </style>
</head>
<body>

    <!-- Replaced Top Bar with Floating Status -->
    <div class="status-area">
        <div class="battery-wrapper" id="battery-wrapper">
            <span id="battery-pct">100%</span>
            <div class="battery-outline">
                <div class="battery-fill" id="battery-level-fill"></div>
            </div>
        </div>
        <span id="mac-clock">Sat 12:40 AM</span>
    </div>

    <div class="main-content">
        <h1 id="cuceu-logo">CUCEU</h1>
    </div>

    <div class="mac-dock-container">
        <div class="mac-dock">
            <a href="/fm" class="dock-app" id="fm-app">
                <div class="app-tooltip">CUCEU.fm</div>
                <div class="app-icon">.fm</div>
                <div class="app-indicator"></div>
            </a>
        </div>
    </div>

    <div id="genie" class="genie-overlay"></div>

    <script>
        // Clock Script
        function updateClock() {
            const now = new Date();
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const day = days[now.getDay()];
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('mac-clock').innerText = `${day} ${hours}:${minutes} ${ampm}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Battery Sync Script
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                const batteryWrapper = document.getElementById('battery-wrapper');
                batteryWrapper.style.display = 'flex'; // Show if API is supported

                function updateBatteryStatus() {
                    const level = Math.round(battery.level * 100);
                    document.getElementById('battery-pct').innerText = level + '%';
                    
                    const batteryFill = document.getElementById('battery-level-fill');
                    batteryFill.style.width = level + '%';

                    // Change color to green if charging, red if low, black normally
                    if (battery.charging) {
                        batteryFill.style.backgroundColor = '#10b981'; 
                    } else if (level <= 20) {
                        batteryFill.style.backgroundColor = '#ef4444'; 
                    } else {
                        batteryFill.style.backgroundColor = '#000000'; 
                    }
                }

                updateBatteryStatus();
                battery.addEventListener('levelchange', updateBatteryStatus);
                battery.addEventListener('chargingchange', updateBatteryStatus);
            });
        }

        // App Launch & Genie Animation
        const appIcon = document.getElementById('fm-app');
        const centralLogo = document.getElementById('cuceu-logo');
        const genieOverlay = document.getElementById('genie');

        appIcon.addEventListener('click', (e) => {
            e.preventDefault(); 
            
            genieOverlay.classList.add('expand'); 
            centralLogo.classList.add('glide-down'); 
            
            setTimeout(() => {
                window.location.href = "/fm";
            }, 550); 
        });

        // Instant reset if user presses the back button
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                genieOverlay.classList.remove('expand');
                centralLogo.classList.remove('glide-down');
            }
        });
    </script>

</body>
</html>
