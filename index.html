        #interactive-logo-container {

            flex-direction: column;

            align-items: flex-start;
            gap: 6px;
            padding: 10px 5px;
            cursor: crosshair;
        }

        .line {
            width: 2px;
            background-color: #000;
            opacity: 0.15;
            transition: all 0.3s ease;
        }

        .line:nth-child(odd) { height: 22px; }
        .line:nth-child(5n) { height: 35px; opacity: 0.4; }
