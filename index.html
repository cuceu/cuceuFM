<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUCEU</title>
    <style>
        /* Matches the clean brutalist style of the radio page */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Massive main branding */
        h1 {
            font-size: clamp(5rem, 20vw, 20rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -8px;
            margin: 0;
            color: #000;
            line-height: 0.8;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 20px;
            margin-bottom: 60px;
            color: #000;
        }

        /* The Portal Button */
        a.portal-btn {
            background-color: #000;
            color: #fff;
            text-decoration: none; /* Removes the ugly blue link underline */
            border: 4px solid #000;
            padding: 25px 50px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 10px 10px 0 #8aff00; /* Signature neon green shadow */
            transition: all 0.2s ease;
            cursor: pointer;
        }

        a.portal-btn:hover {
            transform: translate(-5px, -5px);
            box-shadow: 15px 15px 0 #8aff00;
        }

        a.portal-btn:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 #8aff00;
        }
    </style>
</head>
<body>

    <h1>CUCEU</h1>
    <p>Creative Studio & Broadcast</p>
    
    <a href="/fm" class="portal-btn">ENTER CUCEU.fm</a>

</body>
</html>
