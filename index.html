<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>CUCEU</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22>C</text></svg>">

    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
            color: #000000;
        }

        .status-area {
            position: absolute; top: 25px; right: 30px; display: flex; align-items: center;
            font-size: 14px; font-weight: 600; color: #000000; z-index: 100;
            letter-spacing: 0.5px;
        }

        .main-content {
            flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative;
        }

        #cuceu-logo-wrapper {
            width: 100%; overflow: hidden; display: flex;
            transition: all 0.7s cubic-bezier(0.8, 0, 0.2, 1);
            transform-origin: center center; position: relative; z-index: 5;
            padding: 250px 0; 
        }

        #cuceu-logo-wrapper.glide-down {
            transform: translateY(15vh) scale(0.9); opacity: 0;
        }

        h1#cuceu-logo {
            font-size: clamp(8rem, 25vw, 25rem); font-weight: 950;
            text-transform: uppercase; letter-spacing: -22px; margin: 0;
            color: #000000; white-space: nowrap; line-height: 1; 
            transform: scaleY(2.4);
            animation: marqueeLogo 38s linear infinite; display: inline-block;
        }

        @keyframes marqueeLogo {
            0% { transform: translateX(0) scaleY(2.4); }
            100% { transform: translateX(-50%) scaleY(2.4); }
        }

        .mac-dock-container {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }

        .mac-dock {
            background: rgba(30, 30, 35, 0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 35px;
            padding: 10px 20px; display: flex; gap: 15px; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .dock-app {
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            color: #fff; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative; height: 85px; justify-content: center;
        }

        .app-icon {
            width: 65px; height: 65px; background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff; border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 900; box-shadow: 0 10px 20px rgba(0,0,0,0.1), inset 0 2px 4px rgba(255,255,255,0.4); 
            transition: transform 0.2s ease;
        }

        .icon-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .icon-trash { background: rgba(255, 255, 255, 0.1); font-size: 2.2rem; }

        .icon-ig svg { width: 42px; height: 42px; }

        .app-tooltip {
            position: absolute; top: -35px; background: rgba(30, 30, 35, 0.85); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 10px; font-size: 11px; font-weight: 700;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
            white-space: nowrap; letter-spacing: 1px; text-transform: uppercase;
        }

        .dock-app:hover .app-tooltip { opacity: 1; }

        .app-badge {
            position: absolute; top: -4px; right: -8px; background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; padding: 3px 7px; display: flex; align-items: center; gap: 4px;
            font-size: 8px; font-weight: 800; color: #ffffff; opacity: 0; transition: opacity 0.4s ease;
        }

        .app-badge.visible { opacity: 1; }

        .recording-dot { width: 5px; height: 5px; background-color: #ff3b30; border-radius: 50%; animation: subtle-pulse 2s infinite ease-in-out; }
        @keyframes subtle-pulse { 0% { transform: scale(0.8); opacity: 0.6; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.6; } }

        .app-indicator { width: 4px; height: 4px; background-color: #ffffff; border-radius: 50%; position: absolute; bottom: -5px; box-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }

        .dock-app:hover { transform: translateY(-10px); }
        .genie-overlay { position: fixed; bottom: 45px; left: 50%; margin-left: -32.5px; width: 65px; height: 65px; background: #ffffff; z-index: 1000; pointer-events: none; opacity: 0; transform-origin: bottom center; transition: all 0.6s cubic-bezier(0.8, 0, 0.2, 1); border-radius: 18px; }
        .genie-overlay.expand { opacity: 1; transform: scale(70); }

        @media (max-width: 600px) {
            #cuceu-logo-wrapper { padding: 120px 0; }
            h1#cuceu-logo { font-size: 6rem; letter-spacing: -6px; transform: scaleY(1.8); animation: marqueeLogo 15s linear infinite; }
            .app-tooltip { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="status-area">
        <span id="mac-clock">00:00 AM</span>
    </div>

    <div class="main-content">
        <div id="cuceu-logo-wrapper">
            <h1 id="cuceu-logo">
                CUCEU &nbsp; CUCEU &nbsp; CUCEU &nbsp; CUCEU &nbsp; CUCEU &nbsp; CUCEU &nbsp; CUCEU &nbsp; CUCEU &nbsp;
            </h1>
        </div>
    </div>

    <div class="mac-dock-container">
        <div class="mac-dock">
            <a href="https://www.instagram.com/cuceuuu/" target="_blank" class="dock-app">
                <div class="app-tooltip">Instagram</div>
                <div class="app-icon icon-ig">
                    <svg viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4s1.791-4 4-4 4 1.791 4 4-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </div>
            </a>

            <a href="/fm" class="dock-app" id="fm-app">
                <div class="app-tooltip">cuceuFM</div>
                <div class="app-badge" id="fm-badge">
                    <div class="recording-dot"></div>
                    <span id="fm-badge-text">STATUS...</span>
                </div>
                <div class="app-icon">.fm</div>
                <div class="app-indicator"></div>
            </a>

            <a href="https://www.croydon.gov.uk/rubbish-and-recycling/bins/check-your-bin-collection-days" target="_blank" class="dock-app">
                <div class="app-tooltip">Bin</div>
                <div class="app-icon icon-trash">🗑️</div>
            </a>
        </div>
    </div>

    <div id="genie" class="genie-overlay"></div>

    <script>
        function updateClock() {
            const now = new Date();
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            let hours = now.getHours() % 12 || 12; 
            let minutes = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
            document.getElementById('mac-clock').innerText = `${days[now.getDay()]} ${hours}:${minutes} ${ampm}`;
        }
        updateClock(); setInterval(updateClock, 1000);

        const appIcon = document.getElementById('fm-app');
        const appWrapper = document.getElementById('cuceu-logo-wrapper');
        const genieOverlay = document.getElementById('genie');

        appIcon.addEventListener('click', (e) => {
            e.preventDefault(); genieOverlay.classList.add('expand'); appWrapper.classList.add('glide-down'); 
            setTimeout(() => { window.location.href = "/fm"; }, 550); 
        });

        window.addEventListener('pageshow', () => { genieOverlay.classList.remove('expand'); appWrapper.classList.remove('glide-down'); });

        function checkStreamStatus() {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://stream.cuceu.co.uk/status-json.xsl?t=" + Date.now());
            fetch(proxyUrl, { cache: "no-store" })
                .then(res => res.json())
                .then(data => {
                    if (data.icestats.source) {
                        document.getElementById('fm-badge-text').innerText = "ON AIR";
                        document.getElementById('fm-badge').classList.remove('offline');
                        document.getElementById('fm-badge').classList.add('visible');
                    }
                })
                .catch(() => {
                    document.getElementById('fm-badge-text').innerText = "OFFLINE";
                    document.getElementById('fm-badge').classList.add('offline', 'visible');
                });
        }
        checkStreamStatus(); setInterval(checkStreamStatus, 15000);
    </script>
</body>
</html>
