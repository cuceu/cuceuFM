<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22>C</text></svg>">
    <style>
        html, body {
            margin: 0; padding: 0;
            height: 100vh; height: 100dvh;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
            color: #000000;
        }

        /* --- SMOOTH PAGE TRANSITIONS --- */
        #page-transition-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; z-index: 99999;
            pointer-events: none; opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #page-transition-overlay.loaded { opacity: 0; }
        #page-transition-overlay.leaving { opacity: 1; pointer-events: auto; }

        /* --- NOW PLAYING BANNER --- */
        #now-playing-banner {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 120;
            transform: translateY(-100%);
            transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #now-playing-banner.visible { transform: translateY(0); }
        body.is-exiting #now-playing-banner {
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateY(-100%);
        }

        .banner-inner {
            display: flex; align-items: center;
            height: 100%; padding: 0 22px; gap: 12px;
        }
        .banner-live-dot {
            width: 8px; height: 8px; flex-shrink: 0;
            background: #ff3b30; border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,59,48,0.9);
            animation: subtle-pulse 1.2s infinite ease-in-out;
        }
        #banner-art {
            width: 38px; height: 38px; border-radius: 5px;
            object-fit: cover; flex-shrink: 0;
            opacity: 0; transition: opacity 0.4s ease;
        }
        #banner-art.has-art { opacity: 1; }
        .banner-info {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 2px;
        }
        .banner-label {
            font-size: 9px; font-weight: 900;
            letter-spacing: 2.5px; color: #ff3b30; text-transform: uppercase;
        }
        #banner-track {
            font-size: 13px; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .banner-btn {
            flex-shrink: 0; background: #fff; color: #000;
            font-size: 11px; font-weight: 900; letter-spacing: 1px;
            text-transform: uppercase; text-decoration: none;
            padding: 7px 16px; border-radius: 20px; white-space: nowrap;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        .banner-btn:hover { background: #ff3b30; color: #fff; transform: scale(1.04); }

        /* --- DATE & TIME STATUS AREA --- */
        .status-area {
            position: absolute; top: 25px; right: 30px;
            display: flex; align-items: center;
            font-size: 22px; font-weight: 800; color: #000000;
            z-index: 100; letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,1), 0 0 45px rgba(255,255,255,0.9);
            opacity: 0; transform: translateX(15px);
            animation: clockEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.5s forwards;
            /* Smooth push when banner arrives */
            transition: top 0.55s cubic-bezier(0.25, 1, 0.5, 1);
        }
        body.banner-active .status-area { top: 72px; }
        body.is-exiting .status-area { animation: clockExit 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes clockEntrance {
            0% { opacity: 0; transform: translateX(15px); filter: blur(3px); }
            100% { opacity: 1; transform: translateX(0); filter: blur(0); }
        }
        @keyframes clockExit {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(15px); filter: blur(3px); }
        }

        .main-content {
            flex-grow: 1; display: flex; align-items: center;
            justify-content: center; position: relative;
        }

        /* --- MARQUEE BACKGROUND --- */
        #logo-wrapper {
            position: absolute; top: 50px; left: 0;
            width: 100vw; height: calc(100dvh - 160px);
            display: flex; flex-direction: column;
            justify-content: center; overflow: hidden; pointer-events: none;
        }
        body.is-exiting #logo-wrapper { animation: glideOut 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes glideOut {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(30px) scale(0.95); }
        }

        .marquee-track {
            display: flex; flex-wrap: nowrap;
            width: max-content; will-change: transform;
            margin-top: -0.8vw;
        }
        .marquee-track:first-child { margin-top: 0; }
        .marquee-track:nth-child(even) { margin-left: -7vw; }

        .track-right { animation: scrollRight 8s linear infinite; }
        .track-left  { animation: scrollLeft  8s linear infinite; }

        @keyframes scrollRight { 0% { transform: translateX(-50%); } 100% { transform: translateX(0%); } }
        @keyframes scrollLeft  { 0% { transform: translateX(0%); }   100% { transform: translateX(-50%); } }

        img.cuceu-img {
            height: clamp(3rem, 4.5vw, 6rem); width: auto;
            margin-right: 1vw; flex-shrink: 0;
            user-select: none; -webkit-user-drag: none; opacity: 0;
        }

        @keyframes dropInOdd  { 0% { opacity:0; transform: translateY(-50px); }           100% { opacity:1; transform: translateY(0); } }
        @keyframes dropInEven { 0% { opacity:0; transform: translateY(-50px) rotate(180deg); } 100% { opacity:1; transform: translateY(0) rotate(180deg); } }

        .marquee-track:nth-child(odd)  img.cuceu-img { animation: dropInOdd  0.6s cubic-bezier(0.1,0.9,0.2,1) both; }
        .marquee-track:nth-child(even) img.cuceu-img { animation: dropInEven 0.6s cubic-bezier(0.1,0.9,0.2,1) both; }

        .marquee-track:nth-child(1) img.cuceu-img { animation-delay: 0.1s; }
        .marquee-track:nth-child(2) img.cuceu-img { animation-delay: 0.2s; }
        .marquee-track:nth-child(3) img.cuceu-img { animation-delay: 0.3s; }
        .marquee-track:nth-child(4) img.cuceu-img { animation-delay: 0.4s; }
        .marquee-track:nth-child(5) img.cuceu-img { animation-delay: 0.5s; }
        .marquee-track:nth-child(6) img.cuceu-img { animation-delay: 0.6s; }
        .marquee-track:nth-child(7) img.cuceu-img { animation-delay: 0.7s; }
        .marquee-track:nth-child(8) img.cuceu-img { animation-delay: 0.8s; }
        .marquee-track:nth-child(9) img.cuceu-img { animation-delay: 0.9s; }
        .marquee-track:nth-child(10) img.cuceu-img { animation-delay: 1.0s; }

        /* --- THE DOCK --- */
        .mac-dock-container {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }
        .mac-dock {
            background: rgba(30,30,35,0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 28px;
            padding: 8px 16px; display: flex; gap: 12px; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            opacity: 0;
            animation: dockSlideUp 0.8s cubic-bezier(0.25,1,0.5,1) 1.2s forwards;
        }
        body.is-exiting .mac-dock { animation: dockSlideDown 0.5s cubic-bezier(0.25,1,0.5,1) forwards; }
        @keyframes dockSlideUp   { 0% { opacity:0; transform: translateY(40px); } 100% { opacity:1; transform: translateY(0); } }
        @keyframes dockSlideDown { 0% { opacity:1; transform: translateY(0); }    100% { opacity:0; transform: translateY(40px); } }

        .dock-app {
            text-decoration: none; display: flex; flex-direction: column;
            align-items: center; color: #fff;
            transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
            position: relative; height: 70px; justify-content: center;
        }
        .dock-app.is-open::after {
            content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background-color: rgba(255,255,255,0.9);
            border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        .app-icon {
            width: 52px; height: 52px; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3);
            color: #ffffff; border-radius: 14px; display: flex;
            align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 900;
        }
        .icon-ig {
            background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888) !important;
            border: none !important; backdrop-filter: none !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .icon-ig svg { width: 34px; height: 34px; }
        .icon-td {
            background: linear-gradient(180deg,#f4f4f4,#e2e2e2) !important;
            border: 1px solid rgba(0,0,0,0.1) !important;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .icon-td svg { width: 36px; height: 36px; border-radius: 2px; }
        .icon-trash { background: rgba(255,255,255,0.1); }
        .icon-trash svg { width: 38px; height: 38px; margin-top: 2px; }

        .app-tooltip {
            position: absolute; top: -35px;
            background: rgba(30,30,35,0.85); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 10px; font-size: 11px; font-weight: 700;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
            white-space: nowrap; text-transform: uppercase;
        }
        .dock-app:hover .app-tooltip { opacity: 1; }
        .dock-app:hover { transform: translateY(-10px); }

        .app-badge {
            position: absolute; top: -4px; right: -8px;
            background: rgba(20,20,25,0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            padding: 3px 7px; display: flex; align-items: center; gap: 4px;
            font-size: 8px; font-weight: 800; color: #ffffff; opacity: 0; z-index: 20;
        }
        .app-badge.visible { opacity: 1; }
        .recording-dot {
            width: 5px; height: 5px; background-color: #ff3b30; border-radius: 50%;
            animation: subtle-pulse 2s infinite ease-in-out;
        }
        @keyframes subtle-pulse {
            0%   { transform: scale(0.8); opacity: 0.6; }
            50%  { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.6; }
        }

        /* --- MOBILE --- */
        @media (max-width: 600px) {
            .status-area { font-size: 14px; top: 20px; right: 20px; }
            body.banner-active .status-area { top: 65px; }
            .track-right, .track-left { animation-duration: 35s; }
            .marquee-track:first-child, .marquee-track:last-child { display: none; }
            img.cuceu-img { height: 4rem; margin-right: 4vw; margin-top: 0; }
            .marquee-track { margin-top: -1vw; }
            .mac-dock { gap: 10px; padding: 8px 15px; }
            .app-icon { width: 48px; height: 48px; font-size: 1.3rem; }
            .icon-td svg { width: 30px; height: 30px; }
            .dock-app.is-open::after { bottom: 2px; width: 4px; height: 4px; }
            #now-playing-banner { height: 52px; }
            .banner-btn { padding: 6px 12px; font-size: 10px; }
            #banner-track { font-size: 12px; }
        }
    </style>
</head>

    <script>
        // ─── PAGE TRANSITIONS ────────────────────────────────────────────
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('page-transition-overlay');
            requestAnimationFrame(() => overlay.classList.add('loaded'));

            document.querySelectorAll('.internal-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.body.classList.add('is-exiting');
                    setTimeout(() => {
                        overlay.classList.remove('loaded');
                        overlay.classList.add('leaving');
                    }, 500);
                    setTimeout(() => window.location.href = link.href, 900);
                });
            });
        });

        // ─── MARQUEE FIX: pause when hidden, restart when visible ────────
        // This stops the animation timer accumulating while the page is in
        // the background / bfcache, so it never "catches up" at warp speed.
        function restartMarquees() {
            const tracks = document.querySelectorAll('.marquee-track');
            tracks.forEach(t => { t.style.animation = 'none'; });
            // Double-rAF guarantees a full paint cycle before restoring
            requestAnimationFrame(() => requestAnimationFrame(() => {
                tracks.forEach(t => { t.style.animation = ''; });
            }));
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Pause immediately so time doesn't drift while hidden
                document.querySelectorAll('.marquee-track').forEach(t => {
                    t.style.animationPlayState = 'paused';
                });
            } else {
                // Full restart on return so there's zero catching-up
                restartMarquees();
            }
        });

        // Belt-and-braces for bfcache browser-back restores
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                const overlay = document.getElementById('page-transition-overlay');
                overlay.classList.remove('loaded', 'leaving');
                document.body.classList.remove('is-exiting');
                restartMarquees();
                requestAnimationFrame(() => overlay.classList.add('loaded'));
            }
        });

        // ─── CLOCK ───────────────────────────────────────────────────────
        function updateClock() {
            const now = new Date();
            const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            const h = now.getHours() % 12 || 12;
            const m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('mac-clock').innerText = `${days[now.getDay()]} ${h}:${m} ${ampm}`;
        }
        updateClock(); setInterval(updateClock, 1000);

        // ─── STREAM STATUS + NOW PLAYING BANNER ──────────────────────────
        let bannerShown = false;

        async function checkStream() {
            const proxyUrl = "https://api.allorigins.win/raw?url=" +
                encodeURIComponent("https://stream.cuceu.co.uk/status-json.xsl?t=" + Date.now());
            try {
                const res  = await fetch(proxyUrl, { cache: "no-store" });
                const data = await res.json();
                const src  = data.icestats.source;

                if (src) {
                    // ── Stream is live ──
                    const title = Array.isArray(src)
                        ? (src[0].title || "ON AIR")
                        : (src.title   || "ON AIR");

                    document.getElementById('fm-badge-text').innerText = "ON AIR";
                    document.getElementById('fm-badge').classList.add('visible');
                    document.getElementById('banner-track').textContent = title;

                    if (!bannerShown) {
                        bannerShown = true;

                        // Fetch album art (direct — CORS is open on this endpoint)
                        try {
                            const artRes = await fetch('https://stream.cuceu.co.uk/artwork.txt?t=' + Date.now());
                            const artUrl = (await artRes.text()).trim();
                            if (artUrl && artUrl.startsWith('http')) {
                                const img = document.getElementById('banner-art');
                                img.onload = () => img.classList.add('has-art');
                                img.src = artUrl;
                            }
                        } catch (_) {}

                        // Slide banner in after 2.5 s
                        setTimeout(() => {
                            document.getElementById('now-playing-banner').classList.add('visible');
                            document.body.classList.add('banner-active');
                        }, 2500);
                    }

                } else {
                    // ── Stream offline — hide banner ──
                    bannerShown = false;
                    document.getElementById('now-playing-banner').classList.remove('visible');
                    document.body.classList.remove('banner-active');
                    document.getElementById('fm-badge-text').innerText = "OFFLINE";
                    document.getElementById('fm-badge').classList.add('visible');
                }
            } catch (_) {
                document.getElementById('fm-badge-text').innerText = "OFFLINE";
                document.getElementById('fm-badge').classList.add('visible');
            }
        }

        checkStream();
        setInterval(checkStream, 15000);
    </script>
</body>
</html>
