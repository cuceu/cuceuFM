<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* The slowly moving pastel background */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Helvetica Neue', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* The frosted glass card */
        .card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 50px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 350px;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ff6b81;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #ff6b81;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 107, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 107, 129, 0); }
        }

        p {
            font-size: 1.2rem;
            margin: 25px 0;
            font-weight: 500;
            color: #555;
        }

        button {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(255, 107, 129, 0.4);
            background: #ff4760;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><div class="status-dot"></div>cuceuFM</h1>
        <p>✨ LIVE ON AIR ✨</p>
        <button id="btn">▶ Tune In</button>
    </div>

    <audio id="radioPlayer" src="https://stream.cuceu.co.uk/stream.mp3" preload="none"></audio>

    <script>
        const btn = document.getElementById("btn");
        const player = document.getElementById("radioPlayer");
        let playing = false;

        btn.onclick = () => {
            if (!playing) {
                // Adds a random number so it always grabs the live feed, not a cached version
                player.src = "https://stream.cuceu.co.uk/stream.mp3?" + new Date().getTime();
                player.play();
                btn.innerText = "⏸ Disconnect";
            } else {
                player.pause();
                player.src = ""; 
                btn.innerText = "▶ Tune In";
            }
            playing = !playing;
        };
    </script>
</body>
</html>
