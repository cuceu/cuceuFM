<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceuFM</title>
    <style>
        /* Apply your specific psychedelic screenshot as a fixed background */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Keeps the background static */
            background-image: url('https://raw.githubusercontent.com/cuceu/m1-pirate-radio/main/Screenshot%202026-05-15%20at%2015.41.22.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Helvetica Neue', Arial, sans-serif; /* Keep it clean but impactful */
        }

        /* Pure minimalism - no card, just centered content directly on the graphic */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 800px; /* Big constraint for massive text */
        }

        /* MASSIVE, BOLD, IN-YOUR-FACE TYPOGRAPHY */
        h1 {
            font-size: 15vw; /* Scales with screen size, it will be huge */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px; /* Tightly packed for impact */
            margin: 0;
            color: #000; /* Black text for maximum contrast against the graphic */
            
            /* Optional funky text outline - try enabling this if black is hard to read:
               -webkit-text-stroke: 2px #fff; 
               color: transparent; 
            */
        }

        /* The small, minimalist live indicator */
        .live-status {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: -10px;
            margin-bottom: 50px;
            color: #fff; /* White status text */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pulse-dot {
            height: 15px;
            width: 15px;
            background-color: #000; /* Black dot */
            border-radius: 50%;
            animation: pulse-black 1.5s infinite;
        }

        @keyframes pulse-black {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 0, 0, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
        }

        /* BIG, FUNKY, BLOCKY BUTTON (Neo-Brutalism Style) */
        button {
            background-color: #000; /* Black button */
            color: #fff; /* White play icon */
            border: 4px solid #fff; /* Thick white border for pop */
            padding: 30px 60px;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 0; /* Boxy, non-rounded corner looks harder */
            
            /* Funky hover offset effect */
            box-shadow: 10px 10px 0 #fff;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translate(-5px, -5px); /* Moves up and left */
            box-shadow: 15px 15px 0 #fff; /* Shadow gets bigger */
        }

        button:active {
            transform: translate(5px, 5px); /* Simulates clicking the block down */
            box-shadow: 0px 0px 0 #fff; /* Shadow disappears */
        }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>CUCEU FM</h1>
        <div class="live-status">
            <div class="pulse-dot"></div> Live On Air
        </div>
        
        <button id="btn">▶ Listen</button>
    </div>

    <audio id="radioPlayer" src="https://stream.cuceu.co.uk/stream.mp3" preload="none"></audio>

    <script>
        const btn = document.getElementById("btn");
        const player = document.getElementById("radioPlayer");
        let playing = false;

        btn.onclick = () => {
            if (!playing) {
                // Instantly grabs the live stream
                player.src = "https://stream.cuceu.co.uk/stream.mp3?" + new Date().getTime();
                player.play();
                btn.innerText = "⏸ Pause";
            } else {
                player.pause();
                player.src = ""; 
                btn.innerText = "▶ Listen";
            }
            playing = !playing;
        };
    </script>
</body>
</html>
