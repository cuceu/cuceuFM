<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cuceu</title>
    <meta name="description" content="CUCEU — Music, Visuals, Creative Studio. Live radio, TouchDesigner visuals, and creative experiments.">
    <meta property="og:title" content="CUCEU">
    <meta property="og:description" content="Live radio, TouchDesigner visuals, and creative experiments.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cuceu.co.uk">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22 font-weight=%22900%22 font-family=%22Helvetica, Arial, sans-serif%22>C</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#000; --ink:#f2f0eb; --dim:#6b6b6b; --line:#262626; --acid:#ff4d00;
            --mono:'Space Mono', ui-monospace, monospace;
            --disp:'Archivo', system-ui, sans-serif;
        }
        body:not(.dark-mode) { --bg:#f4f2ec; --ink:#14110d; --dim:#8a857a; --line:#d8d4ca; --acid:#f23c00; }

        * { box-sizing:border-box; margin:0; }
        html, body { height:100dvh; overflow:hidden; }
        body { background:var(--bg); color:var(--ink); font-family:var(--disp);
            display:flex; flex-direction:column; transition:background 0.4s ease, color 0.4s ease; }

        /* ── HEADER ──────────────────────────────────── */
        .head { flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
            padding:14px 24px; border-bottom:1px solid var(--line); z-index:30; background:var(--bg); }
        .station-id { display:flex; align-items:center; gap:9px; }
        .wordmark { font-family:var(--disp); font-size:18px; font-weight:800; letter-spacing:-0.6px; color:var(--ink); line-height:1; }
        .head-live-dot { width:7px; height:7px; background:var(--acid); display:none; animation:blink 1s steps(2) infinite alternate; }
        .head-live-dot.visible { display:block; }
        .clock { display:flex; align-items:center; gap:16px; }
        .clock .cuceu-clock-text { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:1px; color:var(--dim); white-space:nowrap; }
        .tog { width:28px; height:28px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s, color 0.2s; }
        .tog:hover { background:var(--ink); color:var(--bg); }
        .tog svg { width:15px; height:15px; }
        .tog .icon-sun { display:none; } body.dark-mode .tog .icon-sun { display:block; } body.dark-mode .tog .icon-moon { display:none; }

        /* ── NOW PLAYING BANNER (raw drop-bar) ───────── */
        #now-playing-banner { flex-shrink:0; overflow:hidden; max-height:0; background:var(--bg);
            border-bottom:0 solid var(--line); z-index:25;
            transition:max-height 0.45s var(--mono, ease), border-bottom-width 0.45s; }
        #now-playing-banner.visible { max-height:58px; border-bottom:1px solid var(--line); }
        .banner-inner { display:flex; align-items:center; gap:14px; height:58px; padding:0 24px; }
        .banner-live-dot { width:9px; height:9px; flex-shrink:0; background:var(--acid); animation:blink 1s steps(2) infinite alternate; }
        @keyframes blink { from{opacity:1} to{opacity:0.35} }
        #banner-art { width:38px; height:38px; object-fit:cover; flex-shrink:0; border:1px solid var(--line); opacity:0; transition:opacity 0.35s ease; }
        #banner-art.has-art { opacity:1; }
        .banner-info { flex:1; min-width:0; display:flex; align-items:baseline; gap:12px; }
        .banner-label { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--acid); flex-shrink:0; }
        #banner-track { font-family:var(--mono); font-size:13px; font-weight:700; text-transform:uppercase; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .banner-btn { flex-shrink:0; background:var(--acid); color:#000; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; text-decoration:none; padding:9px 18px; }
        .banner-btn:hover { filter:brightness(1.1); }

        /* ── MARQUEE STAGE ───────────────────────────── */
        .main-content { flex:1; position:relative; overflow:hidden; min-height:0; }
        #logo-wrapper { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:0.4vw; overflow:hidden; pointer-events:none; }
        .marquee-track { display:flex; flex-wrap:nowrap; width:max-content; will-change:transform; }
        .track-right { transform:translateX(-50%); }
        img.cuceu-img { height:clamp(3rem, 4.6vw, 6rem); width:auto; margin-right:1.4vw; flex-shrink:0; user-select:none; -webkit-user-drag:none; }
        .marquee-track:nth-child(even) img.cuceu-img { transform:rotate(180deg); }
        body:not(.dark-mode) img.cuceu-img { filter:none; }

        /* ── DOCK (raw bottom nav) ───────────────────── */
        .dock { flex-shrink:0; display:flex; align-items:stretch; border-top:1px solid var(--line); background:var(--bg); z-index:30; }
        .dock-app { flex:1; position:relative; text-decoration:none; border-right:1px solid var(--line);
            display:flex; align-items:center; justify-content:center; gap:10px; min-height:56px; padding:0 12px;
            font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
            color:var(--dim); transition:background 0.2s, color 0.2s; }
        .dock-app:last-child { border-right:none; }
        .dock-app:hover { background:var(--ink); color:var(--bg); }
        .dock-app svg { width:16px; height:16px; flex-shrink:0; }
        .dock-app.is-fm { color:var(--ink); }
        .dock-app.is-fm:hover { background:var(--acid); color:#000; }
        .app-badge { display:none; align-items:center; gap:5px; font-size:9px; letter-spacing:1px; color:var(--acid); }
        .app-badge.visible { display:inline-flex; }
        .dock-app:hover .app-badge { color:#000; }
        .recording-dot { width:6px; height:6px; background:var(--acid); }
        .dock-app:hover .recording-dot { background:#000; }
        .ext { font-size:10px; opacity:0.6; }

        @media (max-width:680px) {
            .head { padding:11px 14px; }
            .wordmark { font-size:17px; }
            .banner-inner { padding:0 14px; gap:10px; }
            .banner-label { display:none; }
            .dock { flex-wrap:wrap; }
            .dock-app { flex:1 1 50%; min-height:52px; font-size:10px; letter-spacing:1px; }
            .dock-app:nth-child(2) { border-right:none; }
            .dock-app:nth-child(1), .dock-app:nth-child(2) { border-bottom:1px solid var(--line); }
            img.cuceu-img { height:2.3rem; margin-right:3.5vw; }
        }
    </style>
</head>
<body>

    <div class="head">
        <div class="station-id">
            <span class="wordmark">cuceu</span>
            <span class="head-live-dot" id="head-live-dot" title="On air"></span>
        </div>
        <div class="clock">
            <span class="cuceu-clock-text">FRI / 00.00.00</span>
            <button class="tog" id="theme-toggle-btn" aria-label="Toggle Theme">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </div>

    <div id="now-playing-banner">
        <div class="banner-inner">
            <span class="banner-live-dot"></span>
            <img id="banner-art" alt="">
            <div class="banner-info">
                <span class="banner-label">Live Now</span>
                <span id="banner-track">—</span>
            </div>
            <a href="/fm/" class="banner-btn" target="_top">Listen ↗</a>
        </div>
    </div>

    <div class="main-content">
        <div id="logo-wrapper"></div>
    </div>

    <nav class="dock">
        <a href="https://www.instagram.com/cuceuuu/" target="_blank" class="dock-app">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            Instagram <span class="ext">↗</span>
        </a>
        <a href="/td/index.html" class="dock-app internal-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
            TouchDesigner
        </a>
        <a href="/fm/" class="dock-app is-fm" target="_top" id="fm-app">
            Radio
            <span class="app-badge" id="fm-badge"><span class="recording-dot" style="display:none;"></span><span id="fm-badge-text">Offline</span></span>
        </a>
        <a href="/bin/index.html" class="dock-app internal-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            Bin
        </a>
    </nav>

    <script>
        if (window === window.parent) { window.location.replace('/?path=' + window.location.pathname); }
    </script>
    <script src="shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            CuceuTheme.bindToggle(document.getElementById('theme-toggle-btn'));

            // Build marquee rows (graffiti wall) — fill the whole stage, alternating direction
            const wrap = document.getElementById('logo-wrapper');
            const region = wrap.parentElement;
            const PER_ROW = 16;
            function makeRow(r) {
                const track = document.createElement('div');
                track.className = 'marquee-track ' + (r % 2 === 0 ? 'track-right' : 'track-left');
                let html = '';
                for (let i = 0; i < PER_ROW; i++) html += '<img class="cuceu-img" src="cuceugrta.png" alt="CUCEU">';
                track.innerHTML = html;
                wrap.appendChild(track);
                return track;
            }
            let r = 0;
            makeRow(r++);  // first row establishes the measurable row height
            const gap = parseFloat(getComputedStyle(wrap).rowGap) || 0;
            const rowH = wrap.firstElementChild.getBoundingClientRect().height + gap;
            const target = region.getBoundingClientRect().height * 1.15;  // overfill, centre + clip
            while (rowH > 0 && r * rowH < target) makeRow(r++);

            // Marquee animation with tape-deck spin-up
            const marqueeAnimations = [];
            const tracks = document.querySelectorAll('.marquee-track');
            let isSpinningUp = true;
            tracks.forEach((track, index) => {
                const isRight = track.classList.contains('track-right');
                const keyframes = isRight
                    ? [{ transform: 'translateX(-50%)' }, { transform: 'translateX(0%)' }]
                    : [{ transform: 'translateX(0%)' }, { transform: 'translateX(-50%)' }];
                const anim = track.animate(keyframes, { duration: 30000, iterations: Infinity, easing: 'linear' });
                anim.pause();
                anim.currentTime = (index * 4500) % 30000;
                marqueeAnimations.push(anim);
            });
            function setMarqueeState(state) {
                if (isSpinningUp) return;
                marqueeAnimations.forEach(a => state === 'running' ? a.play() : a.pause());
            }
            setTimeout(() => {
                marqueeAnimations.forEach(a => { a.play(); a.playbackRate = 0; });
                let start = null; const duration = 2500;
                function step(ts) {
                    if (!start) start = ts;
                    const progress = Math.min((ts - start) / duration, 1);
                    const easeIn = progress * progress * progress;
                    marqueeAnimations.forEach(a => a.playbackRate = easeIn);
                    if (progress < 1) requestAnimationFrame(step);
                    else { marqueeAnimations.forEach(a => a.playbackRate = 1); isSpinningUp = false; }
                }
                requestAnimationFrame(step);
            }, 1000);
            document.addEventListener('visibilitychange', () =>
                setMarqueeState(document.visibilityState === 'visible' ? 'running' : 'paused'));
            window.addEventListener('pageshow', (e) => {
                if (e.persisted) { document.body.classList.remove('is-exiting'); setMarqueeState('running'); }
            });
        });

        // ── STREAM STATUS + NOW PLAYING BANNER ───────────────
        const STREAM_BASE = "https://stream.cuceu.co.uk";
        let bannerShown = false;
        let lastBannerTitle = '';

        async function refreshBannerArt() {
            try {
                const artUrl = (await fetch(`${STREAM_BASE}/artwork.txt?t=${Date.now()}`).then(r => r.text())).trim();
                if (artUrl && artUrl.startsWith('http')) {
                    const img = document.getElementById('banner-art');
                    img.onload = () => img.classList.add('has-art');
                    img.src = artUrl;
                }
            } catch (e) { /* no big deal */ }
        }
        async function checkStream() {
            const fmBadgeTextEl = document.getElementById('fm-badge-text');
            const fmBadgeEl = document.getElementById('fm-badge');
            const liveDot = fmBadgeEl.querySelector('.recording-dot');
            const banner = document.getElementById('now-playing-banner');
            try {
                const response = await fetch(`${STREAM_BASE}/status-json.xsl?t=${Date.now()}`);
                if (!response.ok) throw new Error('not ok');
                const data = await response.json();
                const source = data.icestats?.source;
                if (source) {
                    const title = Array.isArray(source) ? (source[0].title || 'ON AIR') : (source.title || 'ON AIR');
                    fmBadgeTextEl.innerText = "On Air";
                    fmBadgeEl.classList.add('visible');
                    liveDot.style.display = 'block';
                    document.getElementById('head-live-dot').classList.add('visible');
                    document.getElementById('banner-track').textContent = title;
                    if (title !== lastBannerTitle) { lastBannerTitle = title; refreshBannerArt(); }
                    if (!bannerShown) {
                        bannerShown = true;
                        setTimeout(() => banner.classList.add('visible'), 2200);
                    }
                } else { throw new Error('No source'); }
            } catch (e) {
                if (bannerShown) { document.getElementById('now-playing-banner').classList.remove('visible'); bannerShown = false; }
                fmBadgeTextEl.innerText = "Offline";
                fmBadgeEl.classList.add('visible');
                liveDot.style.display = 'none';
                document.getElementById('head-live-dot').classList.remove('visible');
            }
        }
        checkStream();
        setInterval(checkStream, 15000);

        // ── KEYBOARD SHORTCUTS (1-4 → dock items) ────────────
        document.addEventListener('keydown', (e) => {
            const dockApps = document.querySelectorAll('.dock-app');
            const key = parseInt(e.key);
            if (key >= 1 && key <= dockApps.length) dockApps[key - 1].click();
        });
    </script>

</body>
</html>
