<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cuceu.sys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg:#000; --ink:#f2f0eb; --dim:#6b6b6b; --line:#262626; --acid:#ff4d00;
        --mono:'Space Mono', ui-monospace, monospace; --disp:'Archivo', system-ui, sans-serif;
    }
    body:not(.dark-mode){ --bg:#f4f2ec; --ink:#14110d; --dim:#8a857a; --line:#d8d4ca; --acid:#f23c00; }
    * { box-sizing:border-box; margin:0; }
    html,body { height:100dvh; overflow:hidden; }
    body { background:var(--bg); color:var(--ink); font-family:var(--mono);
        display:flex; flex-direction:column; font-size:13px; line-height:1.5;
        transition:background .3s, color .3s; }
    /* faint CRT scanlines */
    body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:50;
        background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.05) 2px 3px); opacity:.6; }
    body:not(.dark-mode)::after { background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.03) 2px 3px); }

    a { color:inherit; text-decoration:none; }
    .acid { color:var(--acid); }
    .dim { color:var(--dim); }
    .blink { animation:blink 1.1s steps(2) infinite; }
    @keyframes blink { 50%{opacity:0} }

    /* ── TITLE BAR ─────────────────────────────── */
    .bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
        padding:9px 16px; border-bottom:1px solid var(--line); font-weight:700; letter-spacing:1px; }
    .bar .led { color:var(--acid); margin-right:7px; }
    .bar .right { display:flex; align-items:center; gap:14px; color:var(--dim); font-weight:400; }
    .tog { border:1px solid var(--line); background:transparent; color:var(--ink); font-family:var(--mono);
        font-size:12px; font-weight:700; width:26px; height:24px; cursor:pointer; }
    .tog:hover { background:var(--ink); color:var(--bg); }

    /* ── BODY GRID ─────────────────────────────── */
    main { flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; padding:16px; overflow:hidden; }

    /* identity / boot */
    .id { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
    .id h1 { font-family:var(--disp); font-weight:900; font-size:clamp(38px,13vw,72px);
        line-height:.82; letter-spacing:-.03em; text-transform:uppercase; }
    .id h1 .sys { font-family:var(--mono); font-size:.34em; letter-spacing:0; vertical-align:top; color:var(--dim); }
    .onair { flex-shrink:0; border:1px solid var(--acid); color:var(--acid); font-weight:700; letter-spacing:2px;
        padding:5px 10px; font-size:11px; white-space:nowrap; }
    .onair.off { border-color:var(--dim); color:var(--dim); }
    .boot { color:var(--dim); font-size:12px; }
    .boot b { color:var(--acid); font-weight:400; }

    /* panels */
    .panel { border:1px solid var(--line); display:flex; flex-direction:column; }
    .panel-head { display:flex; justify-content:space-between; align-items:center;
        padding:7px 12px; border-bottom:1px solid var(--line); color:var(--dim);
        font-size:11px; font-weight:700; letter-spacing:2px; }
    .panel-body { padding:11px 12px; }
    .row { display:flex; gap:12px; padding:3px 0; }
    .row .k { color:var(--dim); width:74px; flex-shrink:0; }
    .row .v { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .eq { display:inline-flex; gap:2px; align-items:flex-end; height:13px; margin-left:8px; vertical-align:-2px; }
    .eq i { width:3px; background:var(--acid); animation:eq .9s ease-in-out infinite; }
    .eq i:nth-child(2){animation-delay:.1s} .eq i:nth-child(3){animation-delay:.25s}
    .eq i:nth-child(4){animation-delay:.4s} .eq i:nth-child(5){animation-delay:.15s}
    @keyframes eq { 0%,100%{height:3px} 50%{height:13px} }

    /* programs */
    .prog a { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line);
        letter-spacing:1px; }
    .prog a:last-child { border-bottom:none; }
    .prog a:hover, .prog a:focus { background:var(--acid); color:#000; outline:none; }
    .prog .num { color:var(--acid); font-weight:700; width:30px; }
    .prog a:hover .num { color:#000; }
    .prog .nm { font-weight:700; width:78px; }
    .prog .ds { color:var(--dim); flex:1; }
    .prog a:hover .ds { color:#000; }
    .prog .ar { color:var(--dim); }
    .prog a:hover .ar { color:#000; }

    /* live signal monitor */
    .signal { margin-top:auto; height:84px; display:flex; align-items:flex-end; gap:2px;
        border-bottom:1px solid var(--line); padding-bottom:2px; }
    .signal i { flex:1; height:4%; background:var(--line); transition:background .3s; }
    .signal.live i { background:var(--acid); }
    .sig-label { position:absolute; margin:6px 0 0 2px; font-size:10px; letter-spacing:2px; color:var(--dim); }

    /* footer prompt */
    .foot { flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
        padding:9px 16px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; }
    .foot .cur { color:var(--ink); }

    @media (max-width:680px){
        .row .k { width:64px; }
        .prog .nm { width:62px; }
        .boot { display:none; }
    }
</style>
</head>
<body>
    <div class="bar">
        <span><span class="led">●</span>CUCEU.SYS</span>
        <span class="right">
            <span id="clock">SAT 01.14.30</span>
            <button class="tog" id="tog" aria-label="Theme">*</button>
        </span>
    </div>

    <main>
        <div class="id">
            <h1>Cuceu<span class="sys">.sys</span></h1>
            <span class="onair off" id="onair">○ OFF AIR</span>
        </div>
        <div class="boot">
            <div>&gt; init audio bus ........ <b>ok</b></div>
            <div>&gt; link stream.cuceu.co.uk <b>ok</b></div>
        </div>

        <div class="panel">
            <div class="panel-head"><span>NOW PLAYING</span><span class="eq" id="eq" style="display:none"><i></i><i></i><i></i><i></i><i></i></span></div>
            <div class="panel-body">
                <div class="row"><span class="k">track</span><span class="v" id="track">— standby —</span></div>
                <div class="row"><span class="k">status</span><span class="v dim" id="status">offline</span></div>
                <div class="row"><span class="k">station</span><span class="v">CUCEU RADIO · LDN</span></div>
            </div>
        </div>

        <div class="panel prog">
            <div class="panel-head"><span>PROGRAMS</span><span class="dim">sel 1–4</span></div>
            <a href="/fm/" data-k="1"><span class="num">[1]</span><span class="nm">RADIO</span><span class="ds">tune in</span><span class="ar acid">▶</span></a>
            <a href="/td/index.html" data-k="2"><span class="num">[2]</span><span class="nm">TD</span><span class="ds">touchdesigner / visuals</span><span class="ar">→</span></a>
            <a href="/bin/index.html" data-k="3"><span class="num">[3]</span><span class="nm">BIN</span><span class="ds">trash</span><span class="ar">→</span></a>
            <a href="https://www.instagram.com/cuceuuu/" target="_blank" data-k="4"><span class="num">[4]</span><span class="nm">IG</span><span class="ds">instagram</span><span class="ar">↗</span></a>
        </div>

        <div class="signal" id="signal" aria-hidden="true"></div>
    </main>

    <div class="foot">
        <span><span class="cur">cuceu@radio</span>:~$ <span class="blink">▮</span></span>
        <span id="conn">conn ○</span>
    </div>

<script>
    // theme
    const dark = () => document.body.classList.toggle('dark-mode', localStorage.getItem('cuceu-theme') !== 'light');
    dark();
    document.getElementById('tog').onclick = () => {
        const isLight = document.body.classList.toggle('dark-mode') === false;
        localStorage.setItem('cuceu-theme', isLight ? 'light' : 'dark');
    };
    // clock
    const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'], p=n=>String(n).padStart(2,'0');
    (function t(){const n=new Date();document.getElementById('clock').textContent=`${DAYS[n.getDay()]} ${p(n.getHours())}.${p(n.getMinutes())}.${p(n.getSeconds())}`;setTimeout(t,1000);})();
    // keyboard launch
    document.addEventListener('keydown',e=>{const a=document.querySelector(`.prog a[data-k="${e.key}"]`);if(a)a.click();});
    // live stream readout
    const BASE='https://stream.cuceu.co.uk';
    const onair=document.getElementById('onair'), trackEl=document.getElementById('track'),
          statusEl=document.getElementById('status'), eq=document.getElementById('eq'), conn=document.getElementById('conn');
    // live signal monitor (synthesized spectrum)
    const sig=document.getElementById('signal'); const BARS=46; const bars=[];
    for(let i=0;i<BARS;i++){const b=document.createElement('i');sig.appendChild(b);bars.push(b);}
    let live=false;
    (function spectrum(t){
        for(let i=0;i<BARS;i++){
            const env=Math.sin(i/BARS*Math.PI);
            const h=live ? 6 + env*(Math.sin(i*0.6+t/180)*0.5+0.5)*(30+Math.random()*55) : 3+Math.random()*2;
            bars[i].style.height=h+'%';
        }
        requestAnimationFrame(spectrum);
    })(0);
    async function poll(){
        try{
            const d=await fetch(`${BASE}/status-json.xsl?t=`+Date.now()).then(r=>r.json());
            const s=d.icestats&&d.icestats.source; if(!s) throw 0;
            const title=Array.isArray(s)?(s[0].title||'ON AIR'):(s.title||'ON AIR');
            onair.textContent='● ON AIR'; onair.classList.remove('off'); onair.classList.add('blink');
            trackEl.textContent=title.toUpperCase(); trackEl.classList.remove('dim');
            statusEl.textContent='live · 320 kbps'; statusEl.classList.remove('dim'); statusEl.classList.add('acid');
            eq.style.display='inline-flex'; conn.innerHTML='conn <span class="acid">●</span>';
            live=true; sig.classList.add('live');
        }catch(_){
            live=false; sig.classList.remove('live');
            onair.textContent='○ OFF AIR'; onair.classList.add('off'); onair.classList.remove('blink');
            trackEl.textContent='— standby —'; trackEl.classList.add('dim');
            statusEl.textContent='offline'; statusEl.classList.add('dim'); statusEl.classList.remove('acid');
            eq.style.display='none'; conn.textContent='conn ○';
        }
    }
    poll(); setInterval(poll,5000);
</script>
</body>
</html>
